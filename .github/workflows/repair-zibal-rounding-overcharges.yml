name: Repair Zibal Rounding Overcharges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-zibal-rounding-overcharges.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-zibal-rounding-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate repair
        run: |
          node --check services/zibal-rounding-refund.js
          node --check scripts/refund-zibal-rounding-overcharges.js
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Apply idempotent refund
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git pull --ff-only

          node --check services/zibal-rounding-refund.js
          node --check scripts/refund-zibal-rounding-overcharges.js

          echo '=== DRY RUN ==='
          node scripts/refund-zibal-rounding-overcharges.js
          echo '=== APPLY ==='
          node scripts/refund-zibal-rounding-overcharges.js --apply
          echo '=== IDEMPOTENCY CHECK ==='
          node scripts/refund-zibal-rounding-overcharges.js --apply

          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          (async()=>{
            const [[summary]]=await db.pool.query(
              "SELECT COUNT(*) refund_count,COALESCE(SUM(refund_toman),0) refund_toman,COUNT(DISTINCT telegram_id) users FROM zibal_rounding_refunds"
            );
            const [[target]]=await db.pool.query(
              `SELECT u.wallet,z.track_id,
                      EXISTS(SELECT 1 FROM zibal_rounding_refunds r WHERE r.track_id=z.track_id) refunded
                 FROM zibal_payments z
                 JOIN users u ON u.telegram_id=z.telegram_id
                WHERE z.track_id='4814436321'
                LIMIT 1`
            );
            const [targetLogs]=await db.pool.query(
              `SELECT amount,type,description,timestamp
                 FROM wallet_logs
                WHERE telegram_id=(SELECT telegram_id FROM zibal_payments WHERE track_id='4814436321' LIMIT 1)
                  AND type='zibal_rounding_refund'
                ORDER BY timestamp DESC
                LIMIT 5`
            );
            const [[pending]]=await db.pool.query(
              `SELECT COUNT(*) count
                 FROM zibal_payments z
                 LEFT JOIN zibal_rounding_refunds r ON r.track_id=z.track_id
                WHERE z.credited=1
                  AND r.track_id IS NULL
                  AND z.paid_rial - ((z.amount_toman + CEIL(z.amount_toman / 10)) * 10) = 10`
            );
            console.log('REFUND_SUMMARY='+JSON.stringify(summary||null));
            console.log('TARGET_AFTER_REFUND='+JSON.stringify(target||null));
            console.log('TARGET_REFUND_LOGS='+JSON.stringify(targetLogs));
            console.log('PENDING_ROUNDING_REFUNDS='+JSON.stringify(pending||null));
            if(!target || Number(target.refunded)!==1) throw new Error('TARGET_REFUND_MISSING');
            if(Number(pending?.count||0)!==0) throw new Error('ROUNDING_REFUNDS_PENDING');
            await db.pool.end();
          })().catch(async e=>{console.error(e);try{await db.pool.end()}catch{};process.exit(1)});
          NODE

          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          REMOTE
