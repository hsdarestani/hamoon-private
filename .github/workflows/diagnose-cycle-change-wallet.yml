name: Diagnose Cycle Change Wallet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cycle-change-wallet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Diagnose production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          echo '=== RECENT CYCLE LOGS ==='
          pm2 logs hamoonbot --nostream --lines 8000 2>&1 | grep -E -A10 -B2 'BILLING_CYCLE_CHANGE_FAILED|BILLING_CYCLE_CHANGE_SUCCESS|INSUFFICIENT_WALLET' | tail -800 || true

          echo '=== RECENT DB STATE ==='
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          const delivery=require('./delivery-charge');
          (async()=>{
            await delivery.ensureSchema(db.pool);
            const [users]=await db.pool.query(`
              SELECT DISTINCT p.telegram_id
              FROM purchases p
              WHERE p.updated_at >= DATE_SUB(NOW(), INTERVAL 6 HOUR)
                 OR p.last_billed_at >= DATE_SUB(NOW(), INTERVAL 6 HOUR)
              ORDER BY p.updated_at DESC
              LIMIT 100
            `).catch(()=>[[]]);
            const [pendingUsers]=await db.pool.query(`
              SELECT telegram_id, MAX(updated_at) AS last_updated
              FROM pending_delivery_charges
              WHERE status='pending'
              GROUP BY telegram_id
              ORDER BY last_updated DESC
              LIMIT 100
            `);
            const ids=[...new Set([...users,...pendingUsers].map(r=>String(r.telegram_id)))];
            for(const uid of ids){
              const [u]=await db.pool.query('SELECT telegram_id,wallet FROM users WHERE telegram_id=? LIMIT 1',[uid]);
              const [p]=await db.pool.query(`
                SELECT server_id,server_name,datacenter,status,duration,amount,delivered_at,created_at,updated_at
                FROM purchases
                WHERE telegram_id=?
                ORDER BY updated_at DESC
                LIMIT 30
              `,[uid]);
              const [r]=await db.pool.query(`
                SELECT server_id,datacenter,amount,status,cancel_reason,created_at,updated_at,charged_at,cancelled_at
                FROM pending_delivery_charges
                WHERE telegram_id=?
                ORDER BY updated_at DESC
                LIMIT 30
              `,[uid]);
              const pending=r.filter(x=>String(x.status)==='pending').reduce((s,x)=>s+Number(x.amount||0),0);
              if(pending>0){
                console.log('USER_STATE='+JSON.stringify({
                  telegram_id:uid,
                  wallet:Number(u[0]?.wallet||0),
                  pending_reserved:pending,
                  spendable:Number(u[0]?.wallet||0)-pending,
                  pending:r.filter(x=>String(x.status)==='pending').map(x=>({
                    server_id:String(x.server_id),datacenter:x.datacenter,amount:Number(x.amount||0),
                    created_at:x.created_at,updated_at:x.updated_at
                  })),
                  purchases:p.map(x=>({
                    server_id:String(x.server_id),name:x.server_name,dc:x.datacenter,status:x.status,duration:x.duration,
                    amount:Number(x.amount||0),delivered_at:x.delivered_at,created_at:x.created_at,updated_at:x.updated_at
                  }))
                }));
              }
            }
            await db.pool.end();
          })().catch(async e=>{console.error('DIAG_FAILED='+String(e?.stack||e));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
