name: Recover Salar Pending SSH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-salar-pending-ssh.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose and recover
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node - <<'NODE'
          require('dotenv').config();
          const net = require('net');
          const db = require('./db');
          const cloud = require('./cloud-api');
          const dcs = require('./datacenters');
          const lifecycle = require('./services/hetzner-lifecycle');
          const clean = require('./services/hetzner-clean-ip-recovery');

          function tcp22(ip, timeout=5000) {
            return new Promise(resolve => {
              const s = new net.Socket();
              let done=false;
              const finish=v=>{if(done)return;done=true;s.destroy();resolve(v)};
              s.setTimeout(timeout);
              s.once('connect',()=>finish(true));
              s.once('timeout',()=>finish(false));
              s.once('error',()=>finish(false));
              s.connect(22, ip);
            });
          }
          function ipOf(s){return s?.public_net?.ipv4?.ip||s?.public_ip||s?.ip||null}
          function locationOf(s,dc){return String(s?.datacenter?.location?.name||s?.location?.name||s?.location||dc?.HETZNER_LOCATION||'').toLowerCase()}

          (async()=>{
            const name='Srv-HET-5e6860';
            const [rows]=await db.pool.execute(
              `SELECT * FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,[name]
            );
            if(!rows.length) throw new Error('PURCHASE_NOT_FOUND');
            const p=rows[0];
            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            if(!dc) throw new Error('DC_NOT_FOUND');
            console.log('PURCHASE='+JSON.stringify({
              telegram_id:p.telegram_id,server_id:p.server_id,server_name:p.server_name,
              datacenter:p.datacenter,status:p.status,public_ip:p.public_ip,
              created_at:p.created_at,delivered_at:p.delivered_at,ip_quality_attempts:p.ip_quality_attempts,
              ip_quality_last_result:p.ip_quality_last_result
            }));

            let server=await cloud.getServer(dc,null,p.server_id);
            let ip=ipOf(server);
            console.log('PROVIDER_BEFORE='+JSON.stringify({status:server?.status||server?.state,ip,location:locationOf(server,dc)}));
            console.log('TCP22_BEFORE='+(ip?await tcp22(ip):false));
            if(ip){
              const q=await lifecycle.checkIpQuality(ip,{polls:8,pollDelayMs:1200}).catch(e=>({error:e.message}));
              console.log('QUALITY_BEFORE='+JSON.stringify(q));
            }

            const beforeReady=await lifecycle.waitForReadiness(dc,p.server_id,{timeoutMs:30000}).catch(e=>({ready:false,status:'error',error:e.message}));
            console.log('READINESS_BEFORE='+JSON.stringify(beforeReady));
            if(beforeReady.ready){
              await db.markDelivered(p.telegram_id,p.server_id,p.datacenter,beforeReady.ip||ip);
              console.log('RECOVERY=already_ready_marked_delivered');
            } else {
              console.log('RECOVERY=change_ip_clean_same_location');
              const changed=await clean.changeHetznerPublicIp({
                db,dc,telegramId:p.telegram_id,serverId:p.server_id,datacenter:p.datacenter
              });
              console.log('CHANGE_RESULT='+JSON.stringify({oldIp:changed.oldIp,newIp:changed.newIp,attempts:changed.attempts,quality:lifecycle.qualitySummary(changed.quality)}));
              const afterReady=await lifecycle.waitForReadiness(dc,p.server_id,{timeoutMs:60000});
              console.log('READINESS_AFTER='+JSON.stringify(afterReady));
              if(!afterReady.ready) throw Object.assign(new Error('NOT_READY_AFTER_CLEAN_CHANGE'),{code:'NOT_READY_AFTER_CLEAN_CHANGE'});
              await db.markDelivered(p.telegram_id,p.server_id,p.datacenter,afterReady.ip||changed.newIp);
              console.log('RECOVERY=delivered_after_clean_change');
            }

            const [finalRows]=await db.pool.execute(
              `SELECT telegram_id,server_id,server_name,datacenter,status,public_ip,delivered_at,ip_quality_attempts,ip_quality_last_result
                 FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,[name]
            );
            console.log('FINAL='+JSON.stringify(finalRows[0]||null));
            await db.pool.end();
          })().catch(async e=>{
            console.error('RECOVERY_FAILED='+String(e?.code||e?.message||e));
            console.error('RECOVERY_ERROR_DETAIL='+String(e?.stack||e));
            try{await db.pool.end()}catch{}
            process.exit(1);
          });
          NODE
          REMOTE
