name: Probe Mahan bot production host

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-mahan-bot-host.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
    steps:
      - name: Check Mahan bot installation on Hamoon production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ -f /opt/mahan-cloud-bot/package.json ]; then
            echo 'MAHAN_BOT_PATH=present'
          else
            echo 'MAHAN_BOT_PATH=absent'
          fi
          if command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}}' | grep -q '^mahan-cloud-bot'; then
            echo 'MAHAN_BOT_CONTAINER=present'
          else
            echo 'MAHAN_BOT_CONTAINER=absent'
          fi
          REMOTE
