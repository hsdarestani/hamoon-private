name: Apply safe Hetzner pricing fixes

on:
  push:
    branches:
      - agent/audit-legacy-hetzner-pricing-20260804
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        if: github.event_name == 'push'
        run: python3 scripts/apply-hetzner-pricing-fix.py

      - name: Validate syntax and pricing
        run: |
          node -c Hetzner/hetzner-api.js
          node -c index.js
          node -c scripts/reconcile-hetzner-billing-amounts.js
          node scripts/validate-hetzner-pricing.js
          npm run validate:hetzner-lifecycle
          npm run validate:provider-capabilities

      - name: Commit patched files
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Hetzner location pricing and legacy cycle amounts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
