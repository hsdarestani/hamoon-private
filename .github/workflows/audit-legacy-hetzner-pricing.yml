name: Audit legacy Hetzner CX23 pricing

on:
  push:
    branches:
      - agent/audit-legacy-hetzner-pricing-20260804
    paths:
      - .github/workflows/audit-legacy-hetzner-pricing.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-legacy-hetzner-pricing.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST || secrets.HAMOON_HOST || secrets.SERVER_HOST || secrets.SERVER_IP || secrets.SSH_HOST || secrets.VPS_HOST || secrets.DEPLOY_HOST || secrets.HOST || vars.HAMOON_SERVER_HOST || vars.HAMOON_HOST || vars.SERVER_HOST || vars.SERVER_IP || vars.SSH_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER || secrets.HAMOON_USER || secrets.SERVER_USER || secrets.SERVER_USERNAME || secrets.SSH_USER || secrets.SSH_USERNAME || secrets.VPS_USER || secrets.DEPLOY_USER || secrets.USERNAME || vars.HAMOON_SERVER_USER || vars.HAMOON_USER || vars.SERVER_USER || vars.SSH_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SSH_PORT || secrets.SERVER_PORT || secrets.SSH_PORT || secrets.VPS_PORT || secrets.DEPLOY_PORT || vars.HAMOON_SSH_PORT || vars.SERVER_PORT || vars.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.HAMOON_SSH_PRIVATE_KEY || secrets.HAMOON_PRIVATE_KEY || secrets.HAMOON_KEY || secrets.SERVER_SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY || secrets.SERVER_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY || secrets.SSHKEY || secrets.PRIVATE_KEY || secrets.DEPLOY_PRIVATE_KEY || secrets.DEPLOY_KEY || secrets.VPS_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_KEY_B64 }}
      SSH_PASSWORD: ${{ secrets.HAMOON_SERVER_PASSWORD || secrets.HAMOON_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.VPS_PASSWORD || secrets.DEPLOY_PASSWORD || secrets.PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Discover available repository secret names
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets?per_page=100" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print("AVAILABLE_SECRET_NAMES=" + ",".join(sorted(x["name"] for x in data.get("secrets", []))))'

      - name: Audit production CX23 purchases
        shell: bash
        run: |
          set -euo pipefail

          host="${SSH_HOST:-91.107.241.4}"
          user="${SSH_USER:-root}"
          port="${SSH_PORT:-22}"

          if [[ -z "${SSH_PRIVATE_KEY:-}" && -z "${SSH_PASSWORD:-}" ]]; then
            echo "No supported SSH key or password secret was found."
            exit 2
          fi

          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          ssh_args=(-o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -p "$port")
          if [[ -n "${SSH_PRIVATE_KEY:-}" ]]; then
            if grep -q "BEGIN .*PRIVATE KEY" <<<"$SSH_PRIVATE_KEY"; then
              printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hamoon_key"
            else
              printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$HOME/.ssh/hamoon_key"
            fi
            chmod 600 "$HOME/.ssh/hamoon_key"
            ssh_args+=(-i "$HOME/.ssh/hamoon_key")
            ssh_cmd=(ssh "${ssh_args[@]}")
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
            ssh_args=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$port")
            ssh_cmd=(sshpass -p "$SSH_PASSWORD" ssh "${ssh_args[@]}")
          fi

          script_b64="$(base64 -w0 <<'NODE'
          const db = require('./db');

          (async () => {
            const rows = await db.getAllPurchases();
            const out = rows
              .filter((p) => {
                const dc = String(p.datacenter || '').toLowerCase();
                const flavor = String(p.flavor_id || '').toLowerCase();
                return dc.includes('hetzner') && flavor === 'cx23';
              })
              .map((p) => ({
                server_id: p.server_id,
                telegram_id: p.telegram_id,
                datacenter: p.datacenter,
                server_name: p.server_name,
                flavor_id: p.flavor_id,
                amount: Number(p.amount || 0),
                duration: p.duration,
                status: p.status,
                auto_renew: Number(p.auto_renew ?? 1),
                created_at: p.created_at,
                last_billed_at: p.last_billed_at,
                updated_at: p.updated_at,
              }))
              .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));

            console.log('HAMOON_CX23_AUDIT_BEGIN');
            console.log(JSON.stringify(out, null, 2));
            console.log('HAMOON_CX23_AUDIT_END');
            process.exit(0);
          })().catch((error) => {
            console.error('HAMOON_CX23_AUDIT_FAILED', error.code || error.message);
            process.exit(1);
          });
          NODE
          )"

          "${ssh_cmd[@]}" "$user@$host" \
            "cd /root/Hamoon && printf '%s' '$script_b64' | base64 -d | node"
