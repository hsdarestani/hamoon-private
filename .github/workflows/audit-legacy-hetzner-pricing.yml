name: Validate Hetzner pricing

on:
  pull_request:
    branches:
      - main
    paths:
      - Hetzner/hetzner-api.js
      - index.js
      - scripts/reconcile-hetzner-billing-amounts.js
      - scripts/validate-hetzner-pricing.js
      - package.json
      - .github/workflows/audit-legacy-hetzner-pricing.yml
  push:
    branches:
      - main
      - agent/audit-legacy-hetzner-pricing-20260804
    paths:
      - Hetzner/hetzner-api.js
      - index.js
      - scripts/reconcile-hetzner-billing-amounts.js
      - scripts/validate-hetzner-pricing.js
      - package.json
      - .github/workflows/audit-legacy-hetzner-pricing.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node -c Hetzner/hetzner-api.js
      - run: node -c index.js
      - run: node -c scripts/reconcile-hetzner-billing-amounts.js
      - run: node scripts/validate-hetzner-pricing.js
      - run: npm run validate:hetzner-lifecycle
      - run: npm run validate:provider-capabilities
