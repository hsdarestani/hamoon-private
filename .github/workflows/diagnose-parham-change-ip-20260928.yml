name: Diagnose Parham Change IP 2026-09-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-parham-change-ip-20260928.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          echo "=== PARHAM PURCHASES ==="
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          const h=require('./Hetzner/hetzner-api');
          const dcs=require('./datacenters');
          (async()=>{
            const uid='7293732698';
            const [p]=await db.pool.query(
              `SELECT telegram_id,server_id,server_name,datacenter,public_ip,status,updated_at
                 FROM purchases
                WHERE telegram_id=? AND LOWER(datacenter) LIKE 'hetzner%'
                ORDER BY id DESC LIMIT 20`,[uid]);
            console.log('PURCHASES='+JSON.stringify(p));
            const dc=dcs.hetzner || Object.values(dcs).find(x=>String(x?.provider||'').toLowerCase()==='hetzner');
            const all=[];
            for(let page=1;page<=5;page++){
              const r=await h.hetznerRequest(dc,'GET','/primary_ips?type=ipv4&per_page=50&page='+page);
              all.push(...(r?.primary_ips||[]));
              if(!r?.meta?.pagination?.next_page) break;
            }
            const unassigned=all.filter(x=>x?.assignee_id==null).map(x=>({
              id:x.id,ip:x.ip,name:x.name,type:x.type,assignee_type:x.assignee_type,
              location:x?.location?.name||x?.location||null,created:x.created||x.created_at||null
            }));
            console.log('PRIMARY_IPV4_TOTAL='+all.length);
            console.log('PRIMARY_IPV4_UNASSIGNED='+JSON.stringify(unassigned));
            const [s]=await h.hetznerRequest(dc,'GET','/servers?per_page=1').then(x=>[x]);
            console.log('SERVER_TOTAL='+Number(s?.meta?.pagination?.total_entries||0));
            await db.pool.end();
          })().catch(async e=>{console.error('DIAG='+JSON.stringify({message:e.message,code:e.code,status:e.status,data:e.data||e.response?.data||null}));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          echo "=== RECENT CHANGE IP LOGS ==="
          for f in "$HOME/.pm2/logs/hamoonbot-out.log" "$HOME/.pm2/logs/hamoonbot-error.log"; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            tail -n 12000 "$f" | grep -E '7293732698|166290719|HETZNER_CHANGE_IP|PRIMARY_CREATE|resource_limit_exceeded|rate_limit_exceeded|/primary_ips' | tail -n 260 || true
          done
          REMOTE
