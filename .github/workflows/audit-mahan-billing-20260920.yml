name: Audit Mahan reseller billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mahan-billing-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect Mahan wallet charges and target server
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const userId='1478447415';
          const target='166621727';
          (async()=>{
            const c=await mysql.createConnection({
              host:process.env.DB_HOST||'127.0.0.1',
              user:process.env.DB_USER,
              password:process.env.DB_PASSWORD,
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try{
              const [[u]]=await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1',[userId]);
              const [clients]=await c.execute('SELECT * FROM api_clients WHERE telegram_id=? ORDER BY id',[userId]);
              const [targetRows]=await c.execute('SELECT * FROM purchases WHERE telegram_id=? AND server_id=? ORDER BY created_at DESC',[userId,target]);
              const [recentPurchases]=await c.execute('SELECT * FROM purchases WHERE telegram_id=? ORDER BY created_at DESC LIMIT 30',[userId]);
              const [logs]=await c.execute('SELECT * FROM wallet_logs WHERE telegram_id=? ORDER BY timestamp DESC LIMIT 300',[userId]);

              const pickPurchase=r=>({
                server_id:String(r.server_id||''),
                flavor_id:r.flavor_id,
                duration:r.duration,
                amount:Number(r.amount||0),
                status:r.status,
                delivered:!!r.delivered_at,
                pricing_mode:r.pricing_mode||'legacy',
                last_billed_at:r.last_billed_at
              });
              const clientSummary=clients.map(r=>({
                id:r.id,
                name:r.name,
                monthly_prorated_pricing:Number(r.monthly_prorated_pricing||0),
                min_wallet_balance:Number(r.min_wallet_balance||0),
                max_servers:Number(r.max_servers||0)
              }));
              const negative=logs.filter(r=>Number(r.amount)<0);
              const amountCounts={};
              const typeTotals={};
              for(const row of negative){
                const amount=Math.abs(Number(row.amount||0));
                const key=String(amount);
                amountCounts[key]=(amountCounts[key]||0)+1;
                const type=String(row.type||'unknown');
                typeTotals[type]=(typeTotals[type]||0)+amount;
              }
              const targetLogSummary=logs
                .filter(r=>String(r.description||'').includes(target))
                .map(r=>({amount:Number(r.amount||0),type:r.type,timestamp:r.timestamp}));

              console.log('WALLET='+Number(u?.wallet||0));
              console.log('API_CLIENTS='+JSON.stringify(clientSummary));
              console.log('TARGET_PURCHASE='+JSON.stringify(targetRows.map(pickPurchase)));
              console.log('RECENT_PURCHASES='+JSON.stringify(recentPurchases.map(pickPurchase)));
              console.log('NEGATIVE_AMOUNT_COUNTS='+JSON.stringify(amountCounts));
              console.log('NEGATIVE_TOTALS_BY_TYPE='+JSON.stringify(typeTotals));
              console.log('TARGET_WALLET_LOGS='+JSON.stringify(targetLogSummary));
            } finally { await c.end(); }
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e.code||e.message));process.exit(1);});
          NODE
          REMOTE
