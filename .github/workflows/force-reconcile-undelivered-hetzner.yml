name: Reconcile Undelivered Hetzner Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-reconcile-undelivered-hetzner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Reconcile and notify
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node - <<'NODE'
          const TelegramBot = require('node-telegram-bot-api');
          const runtime = require('./runtime-bootstrap');
          const db = require('./db');
          const datacenters = require('./datacenters');
          runtime.applyRuntimeSafetyDefaults();
          runtime.installSafeLifecycleModule();
          const lifecycle = require('./services/hetzner-lifecycle');
          const bot = new TelegramBot(process.env.TELEGRAM_BOT_TOKEN, { polling: false });
          const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const code = s => `<pre><code>${esc(s)}</code></pre>`;

          (async()=>{
            const [before] = await db.pool.execute(`SELECT telegram_id,server_id,datacenter,server_name,status,created_at,public_ip,ip_quality_attempts,ip_quality_summary FROM purchases WHERE delivered_at IS NULL AND (LOWER(datacenter)='hetzner' OR LOWER(datacenter) LIKE 'hetzner-%') AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality') ORDER BY created_at`);
            console.log('BEFORE_COUNT='+before.length);
            for (const p of before) {
              const dc = datacenters[p.datacenter] || datacenters.hetzner;
              try {
                const srv = await require('./cloud-api').getServer(dc, null, p.server_id);
                const ip = srv?.public_net?.ipv4?.ip || srv?.addresses?.public?.find?.(a=>Number(a.version)===4)?.addr || srv?.public_ip || null;
                console.log(JSON.stringify({server_id:String(p.server_id),user:String(p.telegram_id),db_status:p.status,provider_status:srv?.status||srv?.state||null,provider_ip:ip,secret_present:Boolean(await db.getServerSecret(p.server_id,'root_password').catch(()=>null)),quality:p.ip_quality_summary||null}));
              } catch (e) {
                console.log(JSON.stringify({server_id:String(p.server_id),provider_error:e?.code||e?.message||String(e)}));
              }
            }

            const results = await lifecycle.reconcileProvisioning({
              db,
              resolveDatacenter: key => {
                const dc = datacenters[key] || datacenters.hetzner;
                return dc ? { ...dc, key } : null;
              },
              timeoutMs: 90000,
              maxIpRotations: Number(process.env.HETZNER_MAX_IP_QUALITY_ROTATIONS || 20)
            });
            console.log('RESULTS='+JSON.stringify(results.map(r=>({server_id:String(r.server_id||''),user:String(r.telegram_id||''),status:r.status,ready:!!r.ready,newly_delivered:!!r.newly_delivered,reason:r.reason||r.quality?.reason||null,quality_fail_open:!!r.quality_fail_open,ip:r.ip||null}))));

            for (const item of results.filter(r=>r.newly_delivered)) {
              const purchase = await db.getPurchaseByServerId(item.server_id).catch(()=>null);
              const password = await db.getServerSecret(item.server_id,'root_password').catch(()=>null);
              if (!purchase || !password) {
                await db.updateScopedStatus(item.telegram_id,item.server_id,item.datacenter,'manual_review').catch(()=>{});
                console.log('NOTIFY_SKIPPED_MISSING_SECRET server_id='+item.server_id);
                continue;
              }
              const lines = [
                `✅ سرور ${esc(purchase.server_name || item.server_id)} اکنون آماده و قابل تحویل است.`,
                `🔹 IP: <code>${esc(item.ip || purchase.public_ip || '')}</code>`,
                '✅ SSH در دسترس است.',
                item.quality_fail_open
                  ? '✅ سرور روشن و SSH قابل دسترسی است؛ بررسی‌های تکمیلی شبکه در پس‌زمینه ادامه دارد.'
                  : '✅ تست دسترسی IP از ایران و چند نقطه خارجی تأیید شد.',
                `🔑 <b>رمز عبور روت:</b>\n${code(password)}`
              ];
              await bot.sendMessage(item.telegram_id, lines.join('\n'), { parse_mode:'HTML' });
              console.log('NOTIFIED server_id='+item.server_id+' user='+item.telegram_id);
            }

            const [after] = await db.pool.execute(`SELECT telegram_id,server_id,server_name,status,created_at,public_ip,ip_quality_attempts,ip_quality_summary FROM purchases WHERE delivered_at IS NULL AND (LOWER(datacenter)='hetzner' OR LOWER(datacenter) LIKE 'hetzner-%') AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality','manual_review') ORDER BY created_at`);
            console.log('AFTER_COUNT='+after.length);
            for(const r of after) console.log('REMAINING='+JSON.stringify(r));
            await bot.close().catch(()=>{});
            process.exit(0);
          })().catch(async e=>{console.error(e);await bot.close().catch(()=>{});process.exit(1)});
          NODE
          REMOTE
