name: Inspect Events 166481659

on:
  push:
    paths:
      - '.github/workflows/inspect-events-166481659.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Inspect logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          echo '=== SERVER EVENTS ==='
          grep -n -B 8 -A 20 -E '166481659|Srv-FIN-9f6daa|65\.109\.195\.219' server_events.log 2>/dev/null | tail -n 500 || true
          echo '=== PM2 RELEVANT ==='
          pm2 logs hamoonbot --lines 16000 --nostream 2>&1             | grep -B 10 -A 25 -E '166481659|Srv-FIN-9f6daa|reset_password|initial_password|password_prestore|password_recovery'             | tail -n 900 || true
          REMOTE
