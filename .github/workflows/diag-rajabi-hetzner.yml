name: Diagnose Rajabi Hetzner Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-rajabi-hetzner.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect affected deliveries
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const net = require('net');
          const dcs = require('./datacenters');
          const cloud = require('./cloud-api');

          const ids = ['166521506','166522427'];
          const tcp22 = (ip) => new Promise(resolve => {
            if (!ip) return resolve(false);
            const s = net.createConnection({host: ip, port: 22, timeout: 5000}, () => {
              s.destroy(); resolve(true);
            });
            s.on('error', () => resolve(false));
            s.on('timeout', () => { s.destroy(); resolve(false); });
          });

          (async()=>{
            const db = await mysql.createConnection({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            const [rows] = await db.query(
              `SELECT telegram_id,server_id,datacenter,status,public_ip,created_at,lifecycle_updated_at,delivered_at,ip_quality_attempts,ip_quality_summary
               FROM purchases WHERE server_id IN (?,?) ORDER BY created_at ASC`, ids
            );
            for (const row of rows) {
              const dc = dcs[row.datacenter];
              let provider = null;
              let providerError = null;
              try {
                const s = await cloud.getServer(dc, null, row.server_id);
                provider = {
                  status: s?.status || null,
                  ip: s?.addresses?.public?.find?.(x => Number(x.version) === 4)?.addr || s?.public_ip || null
                };
              } catch (e) {
                providerError = String(e?.message || e).slice(0,160);
              }
              const ip = provider?.ip || row.public_ip || null;
              const ssh22 = await tcp22(ip);
              console.log(JSON.stringify({
                purchase: row,
                provider,
                provider_error: providerError,
                tcp22_from_production: ssh22
              }));
            }
            await db.end();
          })().catch(e=>{ console.error('DIAG_FAILED='+String(e?.stack||e)); process.exitCode=1; });
          NODE
          REMOTE
