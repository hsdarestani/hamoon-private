name: Diagnose current Hoseinzadeh Hetzner delivery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect current server suspension
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const cloud=require('./cloud-api');
          const datacenters=require('./datacenters');
          (async()=>{
            const conn=await mysql.createConnection({
              host:process.env.DB_HOST||'localhost',
              user:process.env.DB_USER||'root',
              password:process.env.DB_PASSWORD||'',
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try {
              const [[user]]=await conn.execute(
                'SELECT telegram_id,wallet,updated_at FROM users WHERE telegram_id=?',
                ['278773395']
              );
              console.log('USER='+JSON.stringify(user||null));
              const [[p]]=await conn.execute(
                `SELECT telegram_id,server_id,server_name,datacenter,status,provider_status,public_ip,
                        duration,amount,auto_renew,auto_renew_disabled_at,renewal_stopped_at,suspend_reason,
                        delivered_at,created_at,updated_at,lifecycle_updated_at,last_billed_at,
                        ip_quality_attempts,ip_quality_summary
                   FROM purchases WHERE server_id=?`,
                ['166498066']
              );
              console.log('PURCHASE='+JSON.stringify(p||null,null,2));
              const [wallet]=await conn.execute(
                `SELECT id,amount,description,type,timestamp
                   FROM wallet_logs
                  WHERE telegram_id=? AND timestamp >= DATE_SUB(NOW(), INTERVAL 2 HOUR)
                  ORDER BY id DESC LIMIT 60`,
                ['278773395']
              );
              console.log('WALLET_LOGS='+JSON.stringify(wallet,null,2));
              const [events]=await conn.execute(
                `SELECT event_key,event_type,amount_toman,period_start,period_end,created_at,metadata
                   FROM billing_events
                  WHERE telegram_id=? AND server_id=?
                  ORDER BY id DESC LIMIT 30`,
                ['278773395','166498066']
              ).catch(()=>[[]]);
              console.log('BILLING_EVENTS='+JSON.stringify(events,null,2));
              if(p){
                const key=String(p.datacenter||'').split('__')[0];
                const dc=datacenters[p.datacenter]||datacenters[key];
                try {
                  const srv=await cloud.getServer(dc,null,String(p.server_id));
                  console.log('PROVIDER='+JSON.stringify({
                    id:String(p.server_id),
                    status:srv?.status||srv?.state||null,
                    ip:srv?.public_net?.ipv4?.ip||srv?.public_ip||null,
                    image:srv?.image?.name||srv?.image?.description||srv?.image?.id||null
                  }));
                } catch(e) {
                  console.log('PROVIDER='+JSON.stringify({error:String(e?.message||e),http:e?.response?.status||null}));
                }
              }
            } finally { await conn.end(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          echo '=== FOCUSED LOGS ==='
          pm2 logs hamoonbot --lines 16000 --nostream 2>&1 | grep -B 35 -A 70 -E '166498066|Srv-FIN-c98ce3' | tail -n 900 || true
          REMOTE
