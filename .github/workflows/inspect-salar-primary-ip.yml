name: Inspect Salar Hetzner Primary IP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-salar-primary-ip.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect provider state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          const dcs=require('./datacenters');
          const api=require('./Hetzner/hetzner-api');
          const net=require('net');
          function tcp(ip){return new Promise(r=>{const s=new net.Socket();let d=false;const f=v=>{if(d)return;d=true;s.destroy();r(v)};s.setTimeout(3500);s.once('connect',()=>f(true));s.once('timeout',()=>f(false));s.once('error',()=>f(false));s.connect(22,ip)})}
          (async()=>{
            const [rows]=await db.pool.execute("SELECT * FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1");
            const p=rows[0]; if(!p) throw new Error('PURCHASE_NOT_FOUND');
            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            const raw=await api.hetznerRequest(dc,'GET','/servers/'+p.server_id);
            const primaries=await api.hetznerRequest(dc,'GET','/primary_ips?per_page=100');
            const related=(primaries.primary_ips||[]).filter(x=>
              String(x.assignee_id||'')===String(p.server_id) ||
              ['91.107.240.231','91.107.246.160'].includes(String(x.ip||''))
            );
            console.log('DB='+JSON.stringify({telegram_id:p.telegram_id,server_id:p.server_id,status:p.status,public_ip:p.public_ip,delivered_at:p.delivered_at}));
            console.log('SERVER_RAW='+JSON.stringify(raw.server));
            console.log('RELATED_PRIMARY_IPS='+JSON.stringify(related));
            for(const ip of ['91.107.240.231','91.107.246.160']) console.log('TCP22_'+ip.replaceAll('.','_')+'='+(await tcp(ip)));
            await db.pool.end();
          })().catch(async e=>{console.error('INSPECT_FAILED='+String(e?.message||e));console.error('INSPECT_DATA='+JSON.stringify(e?.data||null));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
