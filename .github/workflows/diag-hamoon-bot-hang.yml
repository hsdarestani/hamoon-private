name: Diagnose Hamoon Bot Hang

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-hamoon-bot-hang.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose production bot
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== HEAD ==='
          git rev-parse --short HEAD
          echo '=== PM2 ==='
          pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const p of JSON.parse(s)){console.log(JSON.stringify({name:p.name,pid:p.pid,status:p.pm2_env?.status,restarts:p.pm2_env?.restart_time,uptime:p.pm2_env?.pm_uptime,script:p.pm2_env?.pm_exec_path}))}})"
          echo '=== NODE PROCESSES ==='
          ps -eo pid,ppid,etime,cmd | grep -E '[n]ode .*index|[n]ode .*server\.js|[n]ode .*hamoon' | head -n 40 || true
          echo '=== RECENT BOT LOGS ==='
          pm2 logs hamoonbot --lines 400 --nostream 2>&1 | tail -n 400
          echo '=== ERROR SUMMARY ==='
          pm2 logs hamoonbot --lines 800 --nostream 2>&1 | grep -Ei 'error|fatal|poll|409|conflict|ETELEGRAM|ECONN|timeout|unhandled|rejection|DB_POOL|closed state|too many|rate|429|SyntaxError|ReferenceError|TypeError' | tail -n 220 || true
          echo '=== DB PING ==='
          node - <<'NODE'
          const db=require('./db');
          db.pingDatabase().then(()=>{console.log('DB_PING=ok');process.exit(0)}).catch(e=>{console.log('DB_PING=failed:'+String(e.code||e.message));process.exit(0)});
          NODE
          REMOTE
