name: Audit Hetzner Capacity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Read-only capacity and hygiene audit
        shell: bash
        run: |
          set -u
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          set +e
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' AUDIT_B64='' bash -s" >audit-output.log 2>&1 <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node -e "$(printf '%s' "$AUDIT_B64" | base64 -d)"
          REMOTE
          rc=$?
          set -e
          { echo '## Hetzner capacity audit'; echo; echo 'Exit code:' "$rc"; echo; echo '```json'; sed -n '1,360p' audit-output.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat audit-output.log
          exit "$rc"
