name: Recover Pending Hetzner Deliveries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-pending-hetzner-deliveries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-recover:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate policy fix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-hetzner-pending-delivery-unblock.js
          node --check runtime-bootstrap.js
          node --check index-core.js
          grep -q "HETZNER_IP_QUALITY_INCONCLUSIVE_FAIL_OPEN_MS: String(3 \* 60 \* 1000)" runtime-bootstrap.js
          grep -q "HETZNER_IP_QUALITY_INCONCLUSIVE_ROTATE_PROBES: '10'" runtime-bootstrap.js
          grep -q 'item.quality_fail_open' index-core.js

      - name: Commit policy fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add runtime-bootstrap.js index-core.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(hetzner): bound inconclusive delivery checks'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and recover stuck deliveries
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node --check runtime-bootstrap.js
          node --check index-core.js

          echo '=== REQUEUE FALSE MANUAL REVIEWS ==='
          node - <<'NODE'
          const db=require('./db');
          (async()=>{
            const [result]=await db.pool.execute(`
              UPDATE purchases
              SET status='pending_ip_quality',
                  ip_quality_attempts=0,
                  lifecycle_error_code=NULL,
                  lifecycle_updated_at=NOW(),
                  updated_at=NOW()
              WHERE delivered_at IS NULL
                AND status='manual_review'
                AND (LOWER(datacenter)='hetzner' OR LOWER(datacenter) LIKE 'hetzner-%')
                AND ip_quality_summary LIKE '%reason=insufficient_results%'
            `);
            console.log('REQUEUED='+result.affectedRows);
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$STATUS"
          test "$STATUS" = online

          # Allow at least one full minute reconciler cycle plus readiness checks.
          sleep 85

          echo '=== REMAINING UNDELIVERED ==='
          node - <<'NODE'
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.execute(`SELECT telegram_id,server_id,server_name,status,created_at,delivered_at,public_ip,ip_quality_attempts,ip_quality_summary FROM purchases WHERE delivered_at IS NULL AND (LOWER(datacenter)='hetzner' OR LOWER(datacenter) LIKE 'hetzner-%') AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality','manual_review') ORDER BY created_at`);
            console.log('REMAINING_COUNT='+rows.length);
            for(const r of rows) console.log(JSON.stringify(r));
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          echo '=== DELIVERY EVENTS ==='
          pm2 logs hamoonbot --lines 400 --nostream 2>&1 | grep -Ei 'HETZNER_PROVISIONING_RECONCILE|HETZNER_DELIVERY_NOTIFY_FAILED|quality_fail_open|manual_review|ip_quality_exhausted' | tail -n 160 || true
          REMOTE
