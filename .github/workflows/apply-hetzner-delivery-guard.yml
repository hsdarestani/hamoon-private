          s = p.read_text()
          if "pending_ip_quality" not in s:
              s = s.replace("  assert(!lifecycle.isBillablePurchase({ status: 'provisioning' }));\n", "  assert(!lifecycle.isBillablePurchase({ status: 'provisioning' }));\n  assert(!lifecycle.isBillablePurchase({ status: 'pending_ip_quality' }));\n", 1)
          if "pingNodeSuccess" not in s:
              pass
          validation_marker = "  const text = ['customer-api.js','index.js','Hetzner/hetzner-api.js','services/hetzner-lifecycle.js'].map(f=>fs.readFileSync(f,'utf8')).join('\\n');\n"
          if "originalRootPasswordFlow" not in s:
              add = "  const originalRootPasswordFlow = fs.readFileSync('index-core.js','utf8');\n  assert(/rootPassword = srv\\.root_password \\|\\| null/.test(originalRootPasswordFlow));\n  assert(!/rootPassword = await openstackApi\\.resetServerPassword\\(effectiveDc, null, srv\\.id\\)/.test(originalRootPasswordFlow));\n  assert(/reconcileProvisioning/.test(originalRootPasswordFlow));\n  assert.strictEqual(lifecycle.pingNodeSuccess([[['OK', 0.04], ['TIMEOUT', 3]]]), true);\n  assert.strictEqual(lifecycle.pingNodeSuccess([[['TIMEOUT', 3]]]), false);\n"
              if validation_marker not in s: raise SystemExit('Lifecycle validator marker not found')
              s = s.replace(validation_marker, add + validation_marker, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check Hetzner/hetzner-api.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check index-core.js
          npm run validate:hetzner-lifecycle
          npm run validate:hetzner-pricing
          grep -q "rootPassword = srv.root_password || null" index-core.js
          ! grep -q "rootPassword = await openstackApi.resetServerPassword(effectiveDc, null, srv.id)" index-core.js
          grep -q "pending_ip_quality" db.js
          grep -q "checkIpQuality" services/hetzner-lifecycle.js
          grep -q "HETZNER_PROVISIONING_RECONCILE" index-core.js

      - name: Commit guarded delivery patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add Hetzner/hetzner-api.js services/hetzner-lifecycle.js datacenters.js db.js index-core.js scripts/validate-hetzner-lifecycle.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m "fix(hetzner): guard delivery until password and IP health pass"
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and restore server-secret key safely
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git pull --ff-only

          # Restore the historical encryption key only if the current env lacks it.
          # The correct candidate is selected by successfully decrypting existing DB rows; the key is never printed.
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dotenv = require('dotenv');
          const mysql = require('mysql2/promise');
          const envPath = path.resolve('.env');
          const currentText = fs.existsSync(envPath) ? fs.readFileSync(envPath, 'utf8') : '';
          const current = dotenv.parse(currentText);
          function decrypt(payload, rawKey) {
            const parsed = JSON.parse(payload);
            const key = crypto.createHash('sha256').update(String(rawKey)).digest();
            const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(parsed.iv, 'base64'));
            decipher.setAuthTag(Buffer.from(parsed.tag, 'base64'));
            return Buffer.concat([decipher.update(Buffer.from(parsed.data, 'base64')), decipher.final()]).toString('utf8');
          }
          function envFiles(root, depth = 0, out = []) {
            if (depth > 4) return out;
            let items = []; try { items = fs.readdirSync(root, { withFileTypes: true }); } catch { return out; }
            for (const item of items) {
              const f = path.join(root, item.name);
              if (item.isDirectory()) { if (!['node_modules','.git','proc','sys','dev'].includes(item.name)) envFiles(f, depth + 1, out); }
              else if (item.isFile() && (item.name === '.env' || item.name.startsWith('.env.'))) out.push(f);
            }
            return out;
          }
          (async () => {
            const dbCfg = { host: current.DB_HOST || 'localhost', user: current.DB_USER || 'root', password: current.DB_PASSWORD || '', database: current.DB_NAME || 'hamooncloud_db' };
            const c = await mysql.createConnection(dbCfg);
            const [rows] = await c.query('SELECT secret_value_enc FROM server_secrets ORDER BY id DESC LIMIT 10');
            await c.end();
            if (!rows.length) {
              if (!current.SERVER_SECRET_KEY) throw new Error('No existing encrypted rows to identify SERVER_SECRET_KEY safely');
              console.log('SERVER_SECRET_KEY_PRESENT=yes; verification_skipped=no_rows');
              return;
            }
            const candidates = [];
            if (current.SERVER_SECRET_KEY) candidates.push(current.SERVER_SECRET_KEY);
            for (const f of envFiles('/root')) {
              try {
                const parsed = dotenv.parse(fs.readFileSync(f, 'utf8'));
                if (parsed.SERVER_SECRET_KEY && !candidates.includes(parsed.SERVER_SECRET_KEY)) candidates.push(parsed.SERVER_SECRET_KEY);
              } catch {}
            }
            let best = null;
            for (const candidate of candidates) {
              let score = 0;
              for (const row of rows) {
                try { if (decrypt(row.secret_value_enc, candidate)) score += 1; } catch {}
              }
              if (!best || score > best.score) best = { key: candidate, score };
            }
            if (!best || best.score < 1) throw new Error('Could not verify any historical SERVER_SECRET_KEY against existing encrypted records');
            if (!current.SERVER_SECRET_KEY || current.SERVER_SECRET_KEY !== best.key) {
              let next = currentText.replace(/^SERVER_SECRET_KEY=.*$/m, '').trimEnd();
              next += `\nSERVER_SECRET_KEY=${best.key}\n`;
              fs.writeFileSync(envPath, next, { mode: 0o600 });
            }
            console.log(`SERVER_SECRET_KEY_VERIFIED=yes; verified_rows=${best.score}`);
          })().catch(e => { console.error('SERVER_SECRET_KEY_RESTORE_FAILED=' + e.message); process.exit(1); });
          NODE

          node --check Hetzner/hetzner-api.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check index-core.js
          npm run validate:hetzner-lifecycle
          npm run validate:hetzner-pricing

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 4
          pm2 describe hamoonbot | grep -E 'status|script path|uptime' || true

          echo '=== DEPLOY VERIFICATION ==='
          grep -q "rootPassword = srv.root_password || null" index-core.js && echo 'ORIGINAL_PASSWORD_FLOW=yes'
          if grep -q "rootPassword = await openstackApi.resetServerPassword(effectiveDc, null, srv.id)" index-core.js; then echo 'PURCHASE_RESET_PASSWORD_CALL=bad'; exit 1; else echo 'PURCHASE_RESET_PASSWORD_CALL=none'; fi
          grep -q 'pending_ip_quality' db.js && echo 'PENDING_IP_QUALITY=yes'
          grep -q 'checkIpQuality' services/hetzner-lifecycle.js && echo 'IP_QUALITY_GATE=yes'
          grep -q 'HETZNER_PROVISIONING_RECONCILE' index-core.js && echo 'RECONCILER=yes'

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          (async()=>{
            const [rows] = await db.pool.query('SELECT server_id FROM server_secrets ORDER BY id DESC LIMIT 1');
            if (!rows.length) throw new Error('no secret rows');
            const value = await db.getServerSecret(rows[0].server_id, 'root_password');
            console.log('SERVER_SECRET_DECRYPT_TEST=' + (value ? 'pass' : 'fail'));
            process.exit(value ? 0 : 1);
          })().catch(e=>{ console.error('SERVER_SECRET_DECRYPT_TEST=fail'); process.exit(1); });
          NODE
          REMOTE
