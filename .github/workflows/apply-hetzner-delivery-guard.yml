name: Apply Hetzner Delivery Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hetzner-delivery-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-hetzner-delivery-guard.py
          python3 scripts/harden-hetzner-pending-management.py
          python3 scripts/repair-hetzner-management-bootstrap-compat.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate guarded flow
        shell: bash
        run: |
          set -euo pipefail
          node --check Hetzner/hetzner-api.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check index-core.js
          npm run validate:db-exports
          npm run validate:hetzner-lifecycle
          npm run validate:hetzner-pricing
          node -e "require('./server-display-names-bootstrap').applyPatches(require('fs').readFileSync('index-core.js','utf8')); console.log('SERVER_DISPLAY_BOOTSTRAP_COMPAT=yes')"
          grep -q "rootPassword = srv.root_password || null" index-core.js
          ! grep -q "rootPassword = await openstackApi.resetServerPassword(effectiveDc, null, srv.id)" index-core.js
          grep -q "pending_ip_quality" db.js
          grep -q "checkIpQuality" services/hetzner-lifecycle.js
          grep -q "HETZNER_PROVISIONING_RECONCILE" index-core.js
          grep -q "pending Hetzner delivery redacted" index-core.js
          grep -q "blockUndeliveredHetznerAction" index-core.js

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add Hetzner/hetzner-api.js datacenters.js db.js index-core.js scripts/validate-hetzner-lifecycle.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix(hetzner): keep delivery guard compatible with runtime patches"
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git pull --ff-only

          node scripts/restore-server-secret-key.js .env
          node --check Hetzner/hetzner-api.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check index-core.js
          npm run validate:db-exports
          npm run validate:hetzner-lifecycle
          npm run validate:hetzner-pricing
          node -e "require('./server-display-names-bootstrap').applyPatches(require('fs').readFileSync('index-core.js','utf8')); console.log('SERVER_DISPLAY_BOOTSTRAP_COMPAT=yes')"

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = "online"

          echo '=== DEPLOY VERIFICATION ==='
          grep -q "rootPassword = srv.root_password || null" index-core.js && echo 'ORIGINAL_PASSWORD_FLOW=yes'
          if grep -q "rootPassword = await openstackApi.resetServerPassword(effectiveDc, null, srv.id)" index-core.js; then
            echo 'PURCHASE_RESET_PASSWORD_CALL=bad'
            exit 1
          else
            echo 'PURCHASE_RESET_PASSWORD_CALL=none'
          fi
          grep -q 'pending_ip_quality' db.js && echo 'PENDING_IP_QUALITY=yes'
          grep -q 'checkIpQuality' services/hetzner-lifecycle.js && echo 'IP_QUALITY_GATE=yes'
          grep -q 'HETZNER_PROVISIONING_RECONCILE' index-core.js && echo 'RECONCILER=yes'
          grep -q 'pending Hetzner delivery redacted' index-core.js && echo 'PENDING_MANAGEMENT_REDACTION=yes'
          grep -q 'blockUndeliveredHetznerAction' index-core.js && echo 'PENDING_SENSITIVE_ACTION_BLOCK=yes'

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          setTimeout(async () => {
            try {
              const [rows] = await db.pool.query("SELECT server_id FROM server_secrets WHERE secret_type='root_password' ORDER BY id DESC LIMIT 1");
              if (!rows.length) throw new Error('no root password secret rows');
              const value = await db.getServerSecret(rows[0].server_id, 'root_password');
              console.log('SERVER_SECRET_DECRYPT_TEST=' + (value ? 'pass' : 'fail'));
              await db.pool.end();
              process.exit(value ? 0 : 1);
            } catch (error) {
              console.error('SERVER_SECRET_DECRYPT_TEST=fail');
              process.exit(1);
            }
          }, 1500);
          NODE
          REMOTE
