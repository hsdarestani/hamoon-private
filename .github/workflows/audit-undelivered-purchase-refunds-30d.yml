name: Audit Undelivered Purchase Refunds 30d

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-undelivered-purchase-refunds-30d.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.query(`
              SELECT p.telegram_id,p.server_id,p.server_name,p.datacenter,p.status,p.duration,p.amount,
                     p.created_at,p.delivered_at,p.deleted_at
              FROM purchases p
              WHERE (LOWER(p.datacenter)='hetzner' OR LOWER(p.datacenter) LIKE 'hetzner-%')
                AND p.created_at>=DATE_SUB(NOW(),INTERVAL 30 DAY)
                AND p.delivered_at IS NULL
              ORDER BY p.created_at ASC
            `);
            const out=[];
            for(const p of rows){
              const [logs]=await db.pool.query(`
                SELECT id,amount,description,type,timestamp
                FROM wallet_logs
                WHERE telegram_id=?
                  AND timestamp>=DATE_SUB(?,INTERVAL 10 MINUTE)
                  AND (description LIKE ? OR description LIKE ?)
                ORDER BY timestamp ASC,id ASC
              `,[String(p.telegram_id),new Date(p.created_at),'%'+String(p.server_name||'__never__')+'%','%'+String(p.server_id||'__never__')+'%']);
              const purchaseDebits=logs.filter(l=>Number(l.amount)<0 && ['purchase','server_api_purchase','purchase_recovery'].includes(String(l.type)));
              const refunds=logs.filter(l=>Number(l.amount)>0 && /refund|بازگشت|برگشت/i.test(String(l.type)+' '+String(l.description)));
              const purchaseDebit=purchaseDebits.reduce((s,l)=>s+Math.abs(Number(l.amount||0)),0);
              const refundAmount=refunds.reduce((s,l)=>s+Number(l.amount||0),0);
              const net=Math.max(0,purchaseDebit-refundAmount);
              out.push({
                telegram_id:String(p.telegram_id),server_id:String(p.server_id),server_name:p.server_name,
                status:p.status,duration:p.duration,amount:Number(p.amount||0),created_at:p.created_at,deleted_at:p.deleted_at,
                purchaseDebit,refundAmount,netUnreturned:net,
                logs:logs.map(l=>({id:l.id,amount:Number(l.amount),type:l.type,timestamp:l.timestamp,description:l.description}))
              });
            }
            console.log('UNDELIVERED='+JSON.stringify(out));
            const [targetP]=await db.pool.query(`
              SELECT * FROM purchases WHERE telegram_id='7293732698' AND created_at>=DATE_SUB(NOW(),INTERVAL 30 DAY) ORDER BY created_at ASC
            `);
            for(const p of targetP){
              const end=p.delivered_at?new Date(p.delivered_at):new Date();
              const [logs]=await db.pool.query(`
                SELECT id,amount,description,type,timestamp FROM wallet_logs
                WHERE telegram_id=? AND timestamp>=? AND timestamp<=?
                  AND (description LIKE ? OR description LIKE ?)
                ORDER BY timestamp ASC,id ASC
              `,[String(p.telegram_id),new Date(p.created_at),end,'%'+String(p.server_name||'__never__')+'%','%'+String(p.server_id||'__never__')+'%']);
              console.log('TARGET_DETAIL='+JSON.stringify({
                server_id:String(p.server_id),server_name:p.server_name,status:p.status,duration:p.duration,
                created_at:p.created_at,delivered_at:p.delivered_at,
                logs:logs.map(l=>({id:l.id,amount:Number(l.amount),type:l.type,timestamp:l.timestamp,description:l.description}))
              }));
            }
            await db.pool.end();
          })().catch(async e=>{console.error('AUDIT_FAILED='+String(e?.stack||e));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
