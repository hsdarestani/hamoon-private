# Production deployment with validation and authenticated read-only smoke checks.
name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'public/dashboard/**'
      - 'dashboard-api.js'
      - 'server.js'
      - 'db.js'
      - 'scripts/validate-dashboard.js'
      - 'scripts/validate-dashboard-v2.js'
      - 'scripts/smoke-dashboard-live.js'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-admin-dashboard-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dashboard source
        shell: bash
        run: |
          set -euo pipefail
          node --check public/dashboard/app.js
          node --check public/dashboard/runtime-fix.js
          node --check public/dashboard/dashboard-v2.js
          node --check dashboard-api.js
          node --check db.js
          node --check server.js
          node --check scripts/smoke-dashboard-live.js
          node scripts/validate-dashboard.js
          node scripts/validate-dashboard-v2.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dashboard production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          echo '=== BEFORE ==='
          git rev-parse --short HEAD

          echo '=== UPDATE SOURCE ==='
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          echo '=== VALIDATE PRODUCTION SOURCE ==='
          node --check public/dashboard/app.js
          node --check public/dashboard/runtime-fix.js
          node --check public/dashboard/dashboard-v2.js
          node --check dashboard-api.js
          node --check db.js
          node --check server.js
          node --check scripts/smoke-dashboard-live.js
          node scripts/validate-dashboard.js
          node scripts/validate-dashboard-v2.js

          echo '=== RESTART DASHBOARD ==='
          pm2 restart dashboard-server --update-env
          sleep 4
          pm2 describe dashboard-server | grep -E 'status|restarts|uptime|script path' | head -n 16 || true

          echo '=== HEALTH ==='
          curl -fsS --max-time 8 http://127.0.0.1:3000/health
          echo

          echo '=== LIVE READ-ONLY SMOKE ==='
          DASHBOARD_SMOKE_BASE_URL=http://127.0.0.1:3000 node scripts/smoke-dashboard-live.js

          echo '=== RECENT DASHBOARD ERRORS ==='
          pm2 logs dashboard-server --lines 120 --nostream 2>/dev/null | grep -Ei 'SyntaxError|ReferenceError|TypeError|DASHBOARD_API_ERROR|dashboard.*failed' | tail -n 60 || true

          echo '=== AFTER ==='
          git rev-parse --short HEAD
          REMOTE
