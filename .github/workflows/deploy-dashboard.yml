# Production dashboard + reseller API deployment with validation and read-only smoke checks.
name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'public/dashboard/**'
      - 'dashboard-api.js'
      - 'customer-api.js'
      - 'reseller-api-extensions.js'
      - 'external-payments.js'
      - 'services/hetzner-lifecycle.js'
      - 'server.js'
      - 'db.js'
      - 'package.json'
      - 'scripts/validate-dashboard.js'
      - 'scripts/validate-dashboard-v2.js'
      - 'scripts/smoke-dashboard-live.js'
      - 'scripts/smoke-reseller-api-live.js'
      - 'scripts/smoke-reseller-api-authenticated.js'
      - 'docs/reseller-api.md'
      - '.env'
      - '.env.save'
      - '.env.example'
      - '.gitignore'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-admin-dashboard-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dashboard and reseller API source
        shell: bash
        run: |
          set -euo pipefail
          node --check public/dashboard/app.js
          node --check public/dashboard/runtime-fix.js
          node --check public/dashboard/dashboard-v2.js
          node --check public/dashboard/reseller-api-admin.js
          node --check dashboard-api.js
          node --check customer-api.js
          node --check reseller-api-extensions.js
          node --check external-payments.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check server.js
          node --check scripts/smoke-dashboard-live.js
          node --check scripts/smoke-reseller-api-live.js
          node --check scripts/smoke-reseller-api-authenticated.js
          node scripts/validate-dashboard.js
          node scripts/validate-dashboard-v2.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          ENV_BACKUP="$(mktemp)"
          if [ -f .env ]; then cp .env "$ENV_BACKUP"; fi
          cleanup() { rm -f "$ENV_BACKUP"; }
          trap cleanup EXIT

          echo '=== BEFORE ==='
          git rev-parse --short HEAD

          echo '=== UPDATE SOURCE ==='
          git checkout -- .env .env.save 2>/dev/null || true
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -s "$ENV_BACKUP" ]; then cp "$ENV_BACKUP" .env; chmod 600 .env || true; fi

          echo '=== VALIDATE PRODUCTION SOURCE ==='
          node --check public/dashboard/app.js
          node --check public/dashboard/runtime-fix.js
          node --check public/dashboard/dashboard-v2.js
          node --check public/dashboard/reseller-api-admin.js
          node --check dashboard-api.js
          node --check customer-api.js
          node --check reseller-api-extensions.js
          node --check external-payments.js
          node --check services/hetzner-lifecycle.js
          node --check db.js
          node --check server.js
          node --check scripts/smoke-dashboard-live.js
          node --check scripts/smoke-reseller-api-live.js
          node --check scripts/smoke-reseller-api-authenticated.js
          node scripts/validate-dashboard.js
          node scripts/validate-dashboard-v2.js

          echo '=== RESTART DASHBOARD/API ==='
          pm2 restart dashboard-server --update-env
          sleep 4
          pm2 describe dashboard-server | grep -E 'status|restarts|uptime|script path' | head -n 16 || true

          echo '=== HEALTH ==='
          curl -fsS --max-time 8 http://127.0.0.1:3000/health
          echo

          echo '=== LIVE DASHBOARD READ-ONLY SMOKE ==='
          DASHBOARD_SMOKE_BASE_URL=http://127.0.0.1:3000 node scripts/smoke-dashboard-live.js

          echo '=== LIVE RESELLER API ROUTE SMOKE ==='
          RESELLER_API_SMOKE_BASE_URL=http://127.0.0.1:3000 node scripts/smoke-reseller-api-live.js

          echo '=== LIVE RESELLER API AUTHENTICATED SMOKE ==='
          RESELLER_API_SMOKE_BASE_URL=http://127.0.0.1:3000 node scripts/smoke-reseller-api-authenticated.js

          echo '=== MARKET PAYMENT ROUTE SMOKE ==='
          code="$(curl -ksS --max-time 10 -o /tmp/hamoon-market-payment-response -w '%{http_code}' 'https://pay.hamooncloud.ir/payments/vestaland-market/status?receipt=invalid' || true)"
          echo "market payment invalid receipt -> HTTP ${code:-000}"
          test "$code" = "400"
          rm -f /tmp/hamoon-market-payment-response

          echo '=== PUBLIC RESELLER API DIAGNOSTIC ==='
          for url in 'https://pay.hamooncloud.ir/api/v1/me' 'http://91.107.241.4/api/v1/me'; do
            code="$(curl -ksS --max-time 10 -o /tmp/hamoon-public-api-response -w '%{http_code}' "$url" || true)"
            echo "$url -> HTTP ${code:-000}"
          done
          rm -f /tmp/hamoon-public-api-response

          echo '=== NETWORK DIAGNOSTICS ==='
          ss -lntp 2>/dev/null | grep -E '(:80|:443|:3000)' || true
          if command -v nginx >/dev/null 2>&1; then
            (sudo -n nginx -T 2>/dev/null || nginx -T 2>/dev/null || true) | grep -E '^[[:space:]]*(listen|server_name|proxy_pass)' | head -n 80 || true
          fi

          echo '=== RECENT DASHBOARD/API ERRORS ==='
          pm2 logs dashboard-server --lines 160 --nostream 2>/dev/null | grep -Ei 'SyntaxError|ReferenceError|TypeError|DASHBOARD_API_ERROR|CUSTOMER_API_ERROR|dashboard.*failed|VESTALAND_MARKET' | tail -n 80 || true

          echo '=== AFTER ==='
          git rev-parse --short HEAD
          REMOTE
