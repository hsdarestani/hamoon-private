name: Audit deny user firewall

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-deny-user-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Audit firewall
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const dcs=require('./datacenters');
          const h=require('./Hetzner/hetzner-api');
          (async()=>{
            const dc={...dcs.hetzner,key:'hetzner'};
            const fw=await h.hetznerRequest(dc,'GET','/firewalls/11330120');
            console.log('FIREWALL='+JSON.stringify(fw.firewall||null));
            const acts=await h.hetznerRequest(dc,'GET','/firewalls/11330120/actions?sort=id:desc&per_page=100');
            console.log('ACTIONS='+JSON.stringify((acts.actions||[]).map(a=>({
              id:a.id,command:a.command,status:a.status,started:a.started,finished:a.finished,error:a.error||null
            }))));
            const all=await h.hetznerRequest(dc,'GET','/firewalls?per_page=200');
            const deny=(all.firewalls||[]).filter(f=>String(f.name||'').startsWith('deny-user'));
            console.log('DENY_FIREWALLS='+JSON.stringify(deny.map(f=>({
              id:f.id,name:f.name,created:f.created,rules:f.rules,applied_to:f.applied_to
            }))));
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e?.stack||e));process.exit(1)});
          NODE
          REMOTE
