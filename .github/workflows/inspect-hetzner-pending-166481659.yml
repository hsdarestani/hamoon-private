name: Inspect Hetzner Pending SSH 166481659

on:
  push:
    paths:
      - '.github/workflows/inspect-hetzner-pending-166481659.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live provider and SSH state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          node - <<'NODE'
          require('dotenv').config();
          const net = require('net');
          const db = require('./db');
          const datacenters = require('./datacenters');
          const cloud = require('./cloud-api');
          const lifecycle = require('./services/hetzner-lifecycle');

          const userId = '278773395';
          const serverId = '166481659';
          const dcKey = 'hetzner-finland';

          function tcp(host, port, timeout=5000) {
            return new Promise(resolve => {
              const started = Date.now();
              const socket = net.createConnection({host, port});
              let done=false;
              const finish=(ok,error=null)=>{
                if(done)return; done=true; socket.destroy();
                resolve({ok,error,ms:Date.now()-started});
              };
              socket.setTimeout(timeout);
              socket.once('connect',()=>finish(true));
              socket.once('timeout',()=>finish(false,'timeout'));
              socket.once('error',e=>finish(false,e.code||e.message));
            });
          }

          (async()=>{
            const purchase = await db.getPurchaseForUserServer(userId, serverId, dcKey);
            console.log('PURCHASE='+JSON.stringify(purchase,null,2));
            const dc = datacenters[dcKey];
            const tok = await cloud.getToken(dc);
            const server = await cloud.getServer(dc,tok,serverId);
            console.log('PROVIDER='+JSON.stringify({
              id:server?.id,
              name:server?.name,
              status:server?.status,
              locked:server?.locked,
              rescue_enabled:server?.rescue_enabled,
              image:server?.image,
              server_type:server?.server_type,
              datacenter:server?.datacenter,
              public_net:server?.public_net
            },null,2));

            const ip = server?.public_net?.ipv4?.ip || purchase?.public_ip;
            console.log('TCP22='+JSON.stringify(await tcp(ip,22,5000)));
            console.log('TCP80='+JSON.stringify(await tcp(ip,80,3000)));
            console.log('TCP443='+JSON.stringify(await tcp(ip,443,3000)));

            const readiness = await lifecycle.waitForReadiness(dc, serverId, {timeoutMs:30000});
            console.log('READINESS='+JSON.stringify(readiness,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          echo '=== TARGET LOG CONTEXT ==='
          pm2 logs hamoonbot --lines 15000 --nostream 2>&1             | grep -B 12 -A 30 -E '166481659|Srv-FIN-9f6daa|65\.109\.195\.219'             | tail -n 1000 || true
          REMOTE
