name: Final Check Salar Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-check-salar.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Verify final state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const net=require('net');
          const db=require('./db');
          const dcs=require('./datacenters');
          const api=require('./Hetzner/hetzner-api');
          const lifecycle=require('./services/hetzner-lifecycle');
          function tcp22(ip,timeout=5000){return new Promise(resolve=>{const s=new net.Socket();let done=false;const f=v=>{if(done)return;done=true;s.destroy();resolve(v)};s.setTimeout(timeout);s.once('connect',()=>f(true));s.once('timeout',()=>f(false));s.once('error',()=>f(false));s.connect(22,ip)})}
          (async()=>{
            const [rows]=await db.pool.execute("SELECT * FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1");
            const p=rows[0]; if(!p) throw new Error('PURCHASE_NOT_FOUND');
            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            const s=(await api.hetznerRequest(dc,'GET','/servers/'+p.server_id)).server;
            const ip=s?.public_net?.ipv4?.ip||p.public_ip||null;
            const ssh=ip?await tcp22(ip):false;
            const q=ip?await lifecycle.checkIpQuality(ip,{polls:15,pollDelayMs:1200}):null;
            console.log('FINAL_DB='+JSON.stringify({
              telegram_id:p.telegram_id,server_id:p.server_id,status:p.status,
              public_ip:p.public_ip,delivered_at:p.delivered_at,
              ip_quality_attempts:p.ip_quality_attempts,
              ip_quality_last_result:p.ip_quality_last_result
            }));
            console.log('FINAL_PROVIDER='+JSON.stringify({status:s?.status,ip,location:s?.location?.name||null,image:s?.image?.name||null}));
            console.log('FINAL_SSH='+ssh);
            console.log('FINAL_QUALITY='+lifecycle.qualitySummary(q));
            await db.pool.end();
            if(String(p.status)!=='active'||!p.delivered_at||!ssh||!q?.ok) process.exit(2);
          })().catch(async e=>{console.error('FINAL_CHECK_FAILED='+String(e?.message||e));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
