name: Verify Hetzner Password Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hetzner-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Recover and capture safe production state
        id: production
        shell: bash
        run: |
          set +e
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE' > "$RUNNER_TEMP/hetzner-verify-raw.log" 2>&1
          set +e
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH" || { echo 'APP_PATH_OK=no'; exit 0; }
          echo 'APP_PATH_OK=yes'

          git fetch origin main >/dev/null 2>&1
          git checkout main >/dev/null 2>&1
          git merge --ff-only origin/main >/dev/null 2>&1
          echo "LIVE_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)"

          if grep -q '^SERVER_SECRET_KEY=.' .env 2>/dev/null; then
            echo 'SERVER_SECRET_KEY_PRESENT=yes'
          else
            echo 'SERVER_SECRET_KEY_PRESENT=no'
          fi

          node scripts/restore-server-secret-key.js .env
          echo "RESTORE_SECRET_KEY_EXIT=$?"

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          setTimeout(async () => {
            try {
              const [rows] = await db.pool.query("SELECT server_id FROM server_secrets WHERE secret_type='root_password' ORDER BY id DESC LIMIT 1");
              if (!rows.length) {
                console.log('SERVER_SECRET_DECRYPT_TEST=no_rows');
              } else {
                try {
                  const value = await db.getServerSecret(rows[0].server_id, 'root_password');
                  console.log('SERVER_SECRET_DECRYPT_TEST=' + (value ? 'pass' : 'empty'));
                } catch (e) {
                  console.log('SERVER_SECRET_DECRYPT_TEST=fail:' + String(e.code || e.message || 'unknown').replace(/\s+/g, '_').slice(0,80));
                }
              }
              await db.pool.end();
            } catch (e) {
              console.log('SERVER_SECRET_DECRYPT_TEST=query_failed');
              try { await db.pool.end(); } catch (_) {}
            }
            process.exit(0);
          }, 500);
          NODE

          node scripts/recover-hetzner-password-missing.js
          echo "PASSWORD_RECOVERY_EXIT=$?"

          pm2 restart hamoonbot --update-env >/dev/null 2>&1
          echo "PM2_RESTART_EXIT=$?"
          sleep 5
          PM2_STATUS="$(pm2 jlist 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')}catch(e){process.stdout.write('parse_failed')}})")"
          echo "PM2_STATUS=$PM2_STATUS"

          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async()=>{
            const c=await mysql.createConnection({
              host:process.env.DB_HOST||'localhost',
              user:process.env.DB_USER||'root',
              password:process.env.DB_PASSWORD||'',
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            const [rows]=await c.query(`
              SELECT p.server_id,p.datacenter,p.status,
                     IF(p.delivered_at IS NULL,'no','yes') delivered,
                     p.ip_quality_attempts,
                     EXISTS(SELECT 1 FROM server_secrets s WHERE s.server_id=p.server_id AND s.secret_type='root_password') has_password_secret
              FROM purchases p
              WHERE (LOWER(p.datacenter)='hetzner' OR LOWER(p.datacenter) LIKE 'hetzner-%')
                AND p.delivered_at IS NULL
              ORDER BY p.created_at DESC
              LIMIT 30
            `);
            const target=rows.find(r=>String(r.server_id)==='161295473');
            console.log('TARGET_161295473='+(target?JSON.stringify(target):'not_found'));
            const passwordMissingCandidates=rows.filter(r=>r.status==='manual_review' && Number(r.ip_quality_attempts||0)===0 && Number(r.has_password_secret||0)===0);
            console.log('PASSWORD_MISSING_CANDIDATES='+passwordMissingCandidates.length);
            console.log('UNDELIVERED_HETZNER_COUNT='+rows.length);
            await c.end();
          })().catch(e=>console.log('DB_STATE_QUERY=failed:'+String(e.message||e).replace(/\s+/g,'_').slice(0,80)));
          NODE
          REMOTE
          SSH_EXIT=$?
          echo "SSH_EXIT=$SSH_EXIT" >> "$RUNNER_TEMP/hetzner-verify-raw.log"
          exit 0

      - name: Commit safe verification report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          RAW="$RUNNER_TEMP/hetzner-verify-raw.log"
          {
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E '^(APP_PATH_OK|LIVE_COMMIT|SERVER_SECRET_KEY_PRESENT|SERVER_SECRET_KEY_VERIFIED|SERVER_SECRET_KEY_PRESENT|RESTORE_SECRET_KEY_EXIT|SERVER_SECRET_DECRYPT_TEST|HETZNER_PASSWORD_RECOVERY_COUNT|PASSWORD_RECOVERY_EXIT|PM2_RESTART_EXIT|PM2_STATUS|TARGET_161295473|PASSWORD_MISSING_CANDIDATES|UNDELIVERED_HETZNER_COUNT|SSH_EXIT)=' "$RAW" || true
          } > ops/last-hetzner-password-recovery.txt
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add ops/last-hetzner-password-recovery.txt
          git commit -m 'ops(hetzner): record resilient password recovery verification'
          git push origin HEAD:main
