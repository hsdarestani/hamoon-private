name: Notify Rajabi Manage Fix

on:
  push:
    paths:
      - '.github/workflows/notify-rajabi-manage-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Send Telegram message
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node - <<'NODE'
          require('dotenv').config();
          const token = process.env.TELEGRAM_BOT_TOKEN || process.env.BOT_TOKEN;
          if (!token) throw new Error('BOT_TOKEN_NOT_FOUND');

          const chatId = '6940016723';
          const text = [
            'سلام وقت بخیر 🌹',
            '',
            'مشکل نمایش سرور برطرف شد و سرور Srv-HET-470171 الان باید داخل بخش «⚙️ مدیریت سرورها» برای شما نمایش داده شود.',
            '',
            'لطفاً دوباره از منوی اصلی وارد «⚙️ مدیریت سرورها» شوید، سرور Srv-HET-470171 را انتخاب کنید و از همان‌جا گزینه حذف سرور را بزنید.',
            '',
            'اگر لیست قبلی باز است، از منوی اصلی دوباره وارد مدیریت سرورها شوید تا لیست جدید نمایش داده شود.'
          ].join('\n');

          (async () => {
            const res = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text })
            });
            const body = await res.json();
            console.log(JSON.stringify({ ok: body.ok, message_id: body.result?.message_id || null, error: body.description || null }));
            if (!res.ok || !body.ok) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          REMOTE
