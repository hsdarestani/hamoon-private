name: Inspect Hoseinzadeh Pending Billing

on:
  push:
    paths:
      - '.github/workflows/inspect-hoseinzadeh-pending-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect DB and logs
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              const [target] = await conn.execute(
                `SELECT * FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,
                ['Srv-FIN-581e23']
              );
              console.log('TARGET=' + JSON.stringify(target, null, 2));
              if (!target[0]) return;
              const uid = String(target[0].telegram_id);

              const [purchases] = await conn.execute(
                `SELECT telegram_id,server_id,server_name,datacenter,status,public_ip,duration,amount,
                        auto_renew,created_at,last_billed_at,delivered_at,lifecycle_updated_at,
                        suspend_reason
                   FROM purchases
                  WHERE telegram_id=?
                    AND datacenter LIKE 'hetzner%'
                    AND created_at >= (NOW() - INTERVAL 2 DAY)
                  ORDER BY created_at DESC`,
                [uid]
              );
              console.log('RECENT_PURCHASES=' + JSON.stringify(purchases, null, 2));

              const [wallet] = await conn.execute(
                `SELECT id,telegram_id,amount,type,description,timestamp
                   FROM wallet_logs
                  WHERE telegram_id=?
                    AND timestamp >= (NOW() - INTERVAL 2 DAY)
                  ORDER BY id DESC LIMIT 200`,
                [uid]
              );
              console.log('WALLET_LOGS=' + JSON.stringify(wallet, null, 2));

              const [user] = await conn.execute(
                `SELECT telegram_id,wallet,updated_at FROM users WHERE telegram_id=? LIMIT 1`,
                [uid]
              );
              console.log('USER=' + JSON.stringify(user, null, 2));
            } finally {
              await conn.end();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

          echo '=== RELEVANT PM2 LOGS ==='
          pm2 logs hamoonbot --lines 12000 --nostream 2>&1             | grep -E -B 8 -A 20 'Srv-FIN-581e23|581e23|MINUTE_RENEWAL|ATOMIC_RENEWAL|HETZNER_PROVISIONING_RECONCILE|pending_ssh|HETZNER_PENDING'             | tail -n 900 || true
          REMOTE
