name: Probe server IP 91.107.247.145

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-server-ip-91-107-247-145.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
      TARGET_IP: 91.107.247.145
      TARGET_SERVER_ID: '166093734'
    steps:
      - name: Probe production DB provider network and recent IP logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' TARGET_IP='$TARGET_IP' TARGET_SERVER_ID='$TARGET_SERVER_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const datacenters = require('./datacenters');
          const cloud = require('./cloud-api');
          const hetzner = require('./Hetzner/hetzner-api');
          const targetIp = process.env.TARGET_IP;

          (async () => {
            const [rows] = await db.pool.execute(`
              SELECT server_id, datacenter, status, public_ip, delivered_at, created_at, updated_at
              FROM purchases
              WHERE public_ip = ?
                AND COALESCE(status, '') NOT IN ('deleted','provider_missing')
              ORDER BY updated_at DESC, created_at DESC
              LIMIT 10
            `, [targetIp]);
            console.log('PROBE_MATCH_COUNT=' + rows.length);
            for (const row of rows) {
              const safe = {
                server_id: String(row.server_id),
                datacenter: String(row.datacenter || ''),
                db_status: String(row.status || ''),
                public_ip: String(row.public_ip || ''),
                delivered: row.delivered_at ? 'yes' : 'no',
                created_at: row.created_at,
                updated_at: row.updated_at
              };
              const dc = datacenters[row.datacenter];
              if (!dc) {
                console.log('PROBE_ROW=' + JSON.stringify({...safe, provider_state: 'datacenter_not_found'}));
                continue;
              }
              try {
                const srv = await cloud.getServer(dc, null, row.server_id);
                const providerIp = (srv?.addresses?.public || []).find(a => Number(a?.version) === 4)?.addr || null;
                console.log('PROBE_ROW=' + JSON.stringify({
                  ...safe,
                  provider_state: String(srv?.status || srv?.state || 'unknown'),
                  provider_ip: providerIp,
                  provider_name: srv?.name || null
                }));

                const raw = await hetzner.hetznerRequest(dc, 'GET', `/servers/${row.server_id}`);
                const ipv4 = raw?.server?.public_net?.ipv4 || null;
                console.log('PROBE_RAW_IPV4=' + JSON.stringify({
                  ip: ipv4?.ip || null,
                  blocked: ipv4?.blocked ?? null
                }));

                const primaries = await hetzner.hetznerRequest(dc, 'GET', '/primary_ips?per_page=200');
                const match = (primaries?.primary_ips || []).find(p => String(p?.ip || '') === targetIp || String(p?.assignee_id || '') === String(row.server_id));
                console.log('PROBE_PRIMARY_IP=' + JSON.stringify(match ? {
                  id: match.id,
                  ip: match.ip,
                  type: match.type,
                  assignee_id: match.assignee_id,
                  assignee_type: match.assignee_type,
                  auto_delete: match.auto_delete,
                  location: match.location?.name || match.location || null
                } : null));
              } catch (e) {
                console.log('PROBE_PROVIDER_ERROR=' + String(e?.status || e?.code || e?.message || 'unknown').replace(/\s+/g, '_').slice(0,160));
              }
            }
            await db.pool.end().catch(() => {});
          })().catch(async (e) => {
            console.log('PROBE_FATAL=' + String(e?.message || e).replace(/\s+/g, '_').slice(0,160));
            try { await db.pool.end(); } catch (_) {}
            process.exitCode = 1;
          });
          NODE

          echo 'PROBE_RECENT_LOGS_BEGIN'
          pm2 logs hamoonbot --nostream --lines 12000 2>&1 \
            | grep -E "$TARGET_SERVER_ID|$TARGET_IP" \
            | tail -n 160 \
            | sed -E 's/((root_)?password|pass)([[:space:]]*[:=][[:space:]]*)[^,}[:space:]]+/\1\3<redacted>/Ig' \
            || true
          echo 'PROBE_RECENT_LOGS_END'
          REMOTE
