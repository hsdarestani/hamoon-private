name: Check Post Patch Hetzner Purchases
# temporary suspension-cause check

on:
  push:
    paths:
      - '.github/workflows/check-post-patch-hetzner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Inspect affected server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          (async()=>{
            const conn=await mysql.createConnection({
              host:process.env.DB_HOST||'localhost',
              user:process.env.DB_USER||'root',
              password:process.env.DB_PASSWORD||'',
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try{
              const [[p]]=await conn.execute(
                `SELECT telegram_id,server_id,server_name,datacenter,status,provider_status,public_ip,
                        duration,amount,auto_renew,auto_renew_disabled_at,renewal_stopped_at,suspend_reason,
                        created_at,updated_at,delivered_at,last_billed_at,ip_quality_summary
                   FROM purchases WHERE server_id='166498066'`
              );
              console.log('PURCHASE='+JSON.stringify(p||null,null,2));
              const [wl]=await conn.execute(
                `SELECT id,amount,description,type,timestamp
                   FROM wallet_logs
                  WHERE telegram_id='278773395'
                    AND timestamp >= DATE_SUB(NOW(), INTERVAL 90 MINUTE)
                  ORDER BY id DESC LIMIT 40`
              );
              console.log('WALLET='+JSON.stringify(wl,null,2));
            } finally { await conn.end(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo '=== SERVER FOCUSED LOGS ==='
          pm2 logs hamoonbot --nostream --lines 25000 2>&1             | grep -B 18 -A 35 -E '166498066|Srv-FIN-c98ce3|278773395'             | grep -E '166498066|Srv-FIN-c98ce3|278773395|SUSPEND|RESUME|خاموش|روشن|MINUTE_RENEWAL|Billing|billing|CHANGE_IP|PROVISIONING|callback|Callback|action'             | tail -n 500 || true
          REMOTE
