name: Check Post Patch Hetzner Purchases
# temporary user-specific current-state check

on:
  push:
    paths:
      - '.github/workflows/check-post-patch-hetzner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Inspect recent purchases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const net=require('net');
          const tcp=(host,port=22,timeout=2500)=>new Promise(resolve=>{
            if(!host)return resolve(null);
            const s=net.createConnection({host,port});
            let done=false;const f=(ok,error=null)=>{if(done)return;done=true;s.destroy();resolve({ok,error})};
            s.setTimeout(timeout);s.once('connect',()=>f(true));s.once('timeout',()=>f(false,'timeout'));s.once('error',e=>f(false,e.code||e.message));
          });
          (async()=>{
            const conn=await mysql.createConnection({
              host:process.env.DB_HOST||'localhost',
              user:process.env.DB_USER||'root',
              password:process.env.DB_PASSWORD||'',
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try{
              const [rows]=await conn.execute(
                `SELECT telegram_id,server_id,server_name,datacenter,status,provider_status,public_ip,created_at,updated_at,delivered_at,ip_quality_summary
                   FROM purchases
                  WHERE telegram_id='278773395'
                    AND datacenter LIKE 'hetzner%'
                    AND created_at >= '2026-09-18 20:00:00'
                  ORDER BY created_at DESC
                  LIMIT 12`
              );
              const out=[];
              for(const row of rows){
                out.push({
                  telegram_id:String(row.telegram_id),
                  server_id:String(row.server_id),
                  server_name:row.server_name,
                  datacenter:row.datacenter,
                  status:row.status,
                  provider_status:row.provider_status,
                  public_ip:row.public_ip,
                  created_at:row.created_at,
                  updated_at:row.updated_at,
                  delivered_at:row.delivered_at,
                  ip_quality_summary:row.ip_quality_summary,
                  tcp22:await tcp(row.public_ip)
                });
              }
              console.log('POST_PATCH='+JSON.stringify(out,null,2));
            }finally{await conn.end()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          REMOTE
