name: Deploy Stable SSH And Verify Salar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-stable-ssh-verify-salar.yml'

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Deploy bot and verify delivery
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node --check services/hetzner-lifecycle.js
          grep -q "HETZNER_SSH_STABLE_SUCCESSES" services/hetzner-lifecycle.js
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 6
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "HAMOONBOT_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = "online"

          sleep 75

          node - <<'NODE'
          require('dotenv').config();
          const net=require('net');
          const db=require('./db');
          const dcs=require('./datacenters');
          const lifecycle=require('./services/hetzner-lifecycle');
          const api=require('./Hetzner/hetzner-api');
          function tcp22(ip,timeout=5000){return new Promise(resolve=>{const s=new net.Socket();let d=false;const f=v=>{if(d)return;d=true;s.destroy();resolve(v)};s.setTimeout(timeout);s.once('connect',()=>f(true));s.once('timeout',()=>f(false));s.once('error',()=>f(false));s.connect(22,ip)})}
          (async()=>{
            const [rows]=await db.pool.execute("SELECT * FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1");
            const p=rows[0]; if(!p) throw new Error('PURCHASE_NOT_FOUND');
            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            const s=(await api.hetznerRequest(dc,'GET','/servers/'+p.server_id)).server;
            const ip=s?.public_net?.ipv4?.ip||p.public_ip||null;
            const ssh=ip?await tcp22(ip):false;
            const q=ip?await lifecycle.checkIpQuality(ip,{polls:15,pollDelayMs:1200}):null;
            console.log('VERIFY_DB='+JSON.stringify({status:p.status,public_ip:p.public_ip,delivered_at:p.delivered_at,last_billed_at:p.last_billed_at}));
            console.log('VERIFY_PROVIDER='+JSON.stringify({status:s?.status,ip,location:s?.location?.name||null}));
            console.log('VERIFY_SSH='+ssh);
            console.log('VERIFY_QUALITY='+lifecycle.qualitySummary(q));
            await db.pool.end();
            if(String(p.status)!=='active'||!p.delivered_at||!ssh||!q?.ok) process.exit(2);
          })().catch(async e=>{console.error('VERIFY_FAILED='+String(e?.message||e));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
