name: Rebuild Salar Undelivered Server

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-salar-undelivered.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Rebuild undelivered VM and verify readiness
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          const dcs=require('./datacenters');
          const cloud=require('./cloud-api');
          const api=require('./Hetzner/hetzner-api');
          const lifecycle=require('./services/hetzner-lifecycle');

          (async()=>{
            const [rows]=await db.pool.execute(
              "SELECT * FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1"
            );
            const p=rows[0];
            if(!p) throw new Error('PURCHASE_NOT_FOUND');
            if(p.delivered_at) throw new Error('ALREADY_DELIVERED_ABORT_REBUILD');

            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            const before=(await api.hetznerRequest(dc,'GET','/servers/'+p.server_id)).server;
            const currentIp=before?.public_net?.ipv4?.ip||null;
            console.log('BEFORE='+JSON.stringify({
              server_id:p.server_id,status:p.status,provider:before?.status,
              ip:currentIp,image:before?.image?.name,delivered_at:p.delivered_at
            }));

            await db.updateScopedStatus(p.telegram_id,p.server_id,p.datacenter,'rebuilding');
            const rebuilt=await cloud.rebuildServer(dc,null,p.server_id,'ubuntu-24.04');
            console.log('REBUILD_STARTED='+JSON.stringify({
              action_id:rebuilt?.action?.id||rebuilt?.id||null,
              password_received:Boolean(rebuilt?.root_password)
            }));

            if(rebuilt?.root_password){
              await db.upsertServerSecret({
                telegramId:p.telegram_id,
                serverId:p.server_id,
                datacenter:p.datacenter,
                secretType:'root_password',
                secretValue:rebuilt.root_password
              });
            }

            const aid=rebuilt?.action?.id||rebuilt?.id;
            if(aid) await cloud.waitHetznerAction(dc,aid,240000);
            await db.updateScopedStatus(p.telegram_id,p.server_id,p.datacenter,'pending_ssh');

            const ready=await lifecycle.waitForReadiness(dc,p.server_id,{timeoutMs:180000});
            console.log('READINESS='+JSON.stringify({
              ready:ready.ready,status:ready.status,ip:ready.ip||null,
              quality:lifecycle.qualitySummary(ready.quality)
            }));

            if(ready.ready){
              await db.updatePublicIp(p.telegram_id,p.server_id,p.datacenter,ready.ip);
              await db.updateIpQualityResult?.(
                p.telegram_id,p.server_id,p.datacenter,
                lifecycle.qualitySummary(ready.quality),false
              ).catch(()=>{});
              await db.markDelivered(p.telegram_id,p.server_id,p.datacenter,ready.ip);
              console.log('RECOVERY_RESULT=delivered');
            }else{
              await db.updateScopedStatus(p.telegram_id,p.server_id,p.datacenter,ready.status);
              console.log('RECOVERY_RESULT='+ready.status);
            }

            const [after]=await db.pool.execute(
              "SELECT status,public_ip,delivered_at,ip_quality_last_result FROM purchases WHERE server_id=?",
              [String(p.server_id)]
            );
            console.log('FINAL='+JSON.stringify(after[0]||null));
            await db.pool.end();
          })().catch(async e=>{
            console.error('RECOVERY_FAILED='+String(e?.message||e));
            try{await db.pool.end()}catch{}
            process.exit(1);
          });
          NODE
          REMOTE
