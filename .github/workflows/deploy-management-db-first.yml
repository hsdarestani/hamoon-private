name: Deploy Management DB First

on:
  push:
    branches: [main]
    paths:
      - 'index-core.js'
      - 'runtime-bootstrap.js'
      - 'survey-service.js'
      - 'survey-bootstrap.js'
      - 'services/loyalty-club.js'
      - 'loyalty-club-bootstrap.js'
      - 'loyalty-history-bootstrap.js'
      - 'Hetzner/hetzner-api.js'
      - 'hetzner-purchase-images.js'
      - 'hetzner-management-scope-bootstrap.js'
      - 'provider-visibility-bootstrap.js'
      - 'rebuild-bootstrap.js'
      - 'services/hetzner-additional-ip-billing.js'
      - 'scripts/validate-provider-visibility.js'
      - 'scripts/validate-management-fast-path.js'
      - 'scripts/validate-purchase-performance.js'
      - 'scripts/validate-hetzner-management-buttons.js'
      - '.github/workflows/deploy-management-db-first.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-production-billing-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate DB-first management runtime
        run: |
          set -euo pipefail
          node --check hetzner-management-scope-bootstrap.js
          node --check provider-visibility-bootstrap.js
          node --check hetzner-purchase-images.js
          node --check rebuild-bootstrap.js
          node --check services/hetzner-additional-ip-billing.js
          node --check scripts/validate-provider-visibility.js
          node --check scripts/validate-purchase-performance.js
          node --check scripts/validate-management-fast-path.js
          node scripts/validate-provider-visibility.js
          node scripts/validate-purchase-performance.js
          node scripts/validate-management-fast-path.js
          node --check survey-service.js
          node --check survey-bootstrap.js
          node --check services/loyalty-club.js
          node --check loyalty-club-bootstrap.js
          node --check loyalty-history-bootstrap.js
          node --check Hetzner/hetzner-api.js
          node --check Hetzner/hetzner-api.js
          node scripts/validate-hetzner-management-buttons.js
          node - <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const runtime = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          if (!runtime.includes('const datacenterKeys = []; // MANAGE_DB_FIRST')) {
            throw new Error('MANAGE_DB_FIRST_NOT_COMPOSED');
          }
          if (runtime.includes("await require('./stale-server-reconcile').reconcileStaleServersForUser")) {
            throw new Error('MANAGE_STALE_RECONCILE_BLOCKING');
          }
          if (!runtime.includes("scheduleStaleServerReconcile([effectiveUserId], 1500)")) {
            throw new Error('MANAGE_STALE_RECONCILE_NOT_DEFERRED');
          }
          if (!runtime.includes("case '🏆 باشگاه هامون'")) throw new Error('LOYALTY_MENU_NOT_COMPOSED');
          if (!runtime.includes('[LOYALTY_CLUB_OPEN_OK]')) throw new Error('LOYALTY_RESPONSIVE_HANDLER_NOT_COMPOSED');
          new Function(runtime);
          console.log('MANAGE_DB_FIRST_COMPOSED=yes');
          NODE

      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          node --check hetzner-management-scope-bootstrap.js
          node --check provider-visibility-bootstrap.js
          node --check hetzner-purchase-images.js
          node --check rebuild-bootstrap.js
          node --check services/hetzner-additional-ip-billing.js
          node --check scripts/validate-provider-visibility.js
          node --check scripts/validate-purchase-performance.js
          node --check scripts/validate-management-fast-path.js
          node scripts/validate-provider-visibility.js
          node scripts/validate-purchase-performance.js
          node scripts/validate-management-fast-path.js
          node --check survey-service.js
          node --check survey-bootstrap.js
          node --check services/loyalty-club.js
          node --check loyalty-club-bootstrap.js
          node --check loyalty-history-bootstrap.js
          node scripts/validate-hetzner-management-buttons.js
          node - <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const runtime = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          if (!runtime.includes('const datacenterKeys = []; // MANAGE_DB_FIRST')) process.exit(1);
          if (runtime.includes("await require('./stale-server-reconcile').reconcileStaleServersForUser")) process.exit(1);
          if (!runtime.includes("scheduleStaleServerReconcile([effectiveUserId], 1500)")) process.exit(1);
          if (!runtime.includes("case '🏆 باشگاه هامون'")) process.exit(1);
          if (!runtime.includes('[LOYALTY_CLUB_OPEN_OK]')) process.exit(1);
          new Function(runtime);
          console.log('PRODUCTION_MANAGE_DB_FIRST=yes');
          NODE

          node - <<'NODE'
          require('dotenv').config();
          const datacenters = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          (async () => {
            const keys = Object.keys(datacenters).filter(k => String(datacenters[k]?.provider || datacenters[k]?.apiType || '').toLowerCase().includes('hetzner'));
            const summary = {};
            for (const key of keys) {
              const plans = await hetzner.getHetznerSellablePlans(datacenters[key]);
              const dedicated = plans.filter(p => String(p.family || '').toUpperCase() === 'CCX');
              if (dedicated.length) throw new Error('DEDICATED_PLAN_STILL_SELLABLE:' + key);
              summary[key] = plans.map(p => p.id);
            }
            console.log('HETZNER_SELLABLE_PLANS=' + JSON.stringify(summary));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$STATUS"
          test "$STATUS" = "online"

          sleep 12
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            const [[users]] = await conn.query('SELECT COUNT(*) AS total FROM users');
            const [invites] = await conn.query("SELECT invite_status, COUNT(*) AS total FROM survey_invites WHERE survey_version='services_2026_09' GROUP BY invite_status ORDER BY invite_status");
            const [[progress]] = await conn.query("SELECT COUNT(*) AS started, SUM(completed_at IS NOT NULL) AS completed, SUM(rewarded_at IS NOT NULL) AS rewarded FROM user_surveys WHERE survey_version='services_2026_09'");
            console.log('SURVEY_USERS_TOTAL=' + Number(users.total || 0));
            console.log('SURVEY_INVITES=' + JSON.stringify(invites));
            console.log('SURVEY_PROGRESS=' + JSON.stringify(progress));
            await conn.end();
          })().catch(error => {
            console.error('SURVEY_PRODUCTION_VERIFY_FAILED=' + (error?.message || error));
            process.exit(1);
          });
          NODE

          pm2 logs hamoonbot --lines 160 --nostream 2>/dev/null | grep -E 'SURVEY_BROADCAST_(PROGRESS|DONE|FAILED)' | tail -20 || true
          REMOTE
