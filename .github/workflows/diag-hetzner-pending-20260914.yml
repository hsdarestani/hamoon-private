name: Diagnose latest pending Hetzner deliveries

on:
  push:
    branches: [diag/hetzner-pending-20260914]
    paths:
      - '.github/workflows/diag-hetzner-pending-20260914.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_diag_key
          chmod 600 ~/.ssh/hamoon_diag_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production diagnosis
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_diag_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo "PROD_HEAD=$(git rev-parse HEAD)"
          DB_AUTO_INIT=false node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async () => {
            const pool = mysql.createPool({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db',
              connectionLimit: 2
            });
            const [columns] = await pool.query(`
              SELECT TABLE_NAME, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_KEY
              FROM INFORMATION_SCHEMA.COLUMNS
              WHERE TABLE_SCHEMA = DATABASE() AND COLUMN_NAME = 'server_id'
              ORDER BY TABLE_NAME
            `);
            console.log('SERVER_ID_COLUMNS=' + JSON.stringify(columns));
            const [fks] = await pool.query(`
              SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME,
                     REFERENCED_TABLE_NAME, REFERENCED_COLUMN_NAME
              FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE
              WHERE TABLE_SCHEMA = DATABASE()
                AND (COLUMN_NAME = 'server_id' OR REFERENCED_COLUMN_NAME = 'server_id')
                AND REFERENCED_TABLE_NAME IS NOT NULL
              ORDER BY TABLE_NAME, CONSTRAINT_NAME
            `);
            console.log('SERVER_ID_FKS=' + JSON.stringify(fks));
            const [pending] = await pool.query(`
              SELECT telegram_id, server_id, server_name, datacenter, status, flavor_id, os_label,
                     ssh_key_id, public_ip, ip_quality_attempts, delivered_at, created_at
              FROM purchases
              WHERE datacenter = 'hetzner'
                AND delivered_at IS NULL
                AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality','manual_review')
              ORDER BY created_at ASC
            `);
            console.log('PENDING_GERMANY=' + JSON.stringify(pending));
            await pool.end();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          REMOTE
