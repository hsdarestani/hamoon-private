name: Diagnose latest pending Hetzner deliveries

on:
  push:
    branches: [diag/hetzner-pending-20260914]
    paths:
      - '.github/workflows/diag-hetzner-pending-20260914.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_diag_key
          chmod 600 ~/.ssh/hamoon_diag_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production diagnosis
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_diag_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo "PROD_HEAD=$(git rev-parse HEAD)"
          pm2 show hamoonbot --no-color | grep -E 'status|pid' | head -n 4 || true
          DB_AUTO_INIT=false node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          (async () => {
            const pool = mysql.createPool({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db',
              connectionLimit: 2
            });
            const [rows] = await pool.query(`
              SELECT telegram_id, server_id, server_name, datacenter, status,
                     public_ip, ip_quality_attempts, ip_quality_summary,
                     created_at, updated_at, delivered_at
              FROM purchases
              WHERE datacenter = 'hetzner'
                AND created_at >= '2026-09-14 10:30:00'
              ORDER BY created_at ASC
            `);
            console.log('RECENT_GERMANY=' + JSON.stringify(rows));
            for (const row of rows) {
              try {
                const raw = await hetzner.getHetznerServer(dcs[row.datacenter], row.server_id);
                console.log('PROVIDER=' + JSON.stringify({
                  telegram_id: row.telegram_id,
                  server_id: row.server_id,
                  server_name: row.server_name,
                  status: row.status,
                  delivered_at: row.delivered_at,
                  ip: raw?.public_net?.ipv4?.ip || null,
                  provider_status: raw?.status || null,
                  location: raw?.datacenter?.location?.name || raw?.location?.name || null
                }));
              } catch (error) {
                console.log('PROVIDER=' + JSON.stringify({
                  telegram_id: row.telegram_id,
                  server_id: row.server_id,
                  status: row.status,
                  delivered_at: row.delivered_at,
                  provider_error: String(error?.code || error?.message || error).slice(0, 100)
                }));
              }
            }
            await pool.end();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          echo '=== DELIVERY / FALLBACK LOGS ==='
          pm2 logs hamoonbot --nostream --lines 2200 2>/dev/null | grep -E 'HETZNER_LOCATION_FALLBACK|HETZNER_PROVISIONING_RECONCILE|HETZNER_DELIVERY_NOTIFY_FAILED|165810574|Srv-HET-d89ec4|pending Hetzner delivery redacted' | tail -n 520 || true
          REMOTE
