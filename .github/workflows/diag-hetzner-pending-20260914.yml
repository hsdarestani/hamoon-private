name: Diagnose latest pending Hetzner deliveries

on:
  push:
    branches: [diag/hetzner-pending-20260914]
    paths:
      - '.github/workflows/diag-hetzner-pending-20260914.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_diag_key
          chmod 600 ~/.ssh/hamoon_diag_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production diagnosis
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_diag_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo "PROD_HEAD=$(git rev-parse HEAD)"

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          const target = '165810574';
          (async () => {
            const [purchaseRows] = await db.pool.query(`
              SELECT telegram_id, server_id, server_name, datacenter, status, public_ip,
                     ip_quality_attempts, ip_quality_checked_at, ip_quality_summary,
                     created_at, updated_at, lifecycle_updated_at, delivered_at
              FROM purchases WHERE server_id = ? LIMIT 1
            `, [target]);
            console.log('TARGET_PURCHASE=' + JSON.stringify(purchaseRows[0] || null));

            const [historyRows] = await db.pool.query(`
              SELECT ip_address, first_seen_at, last_seen_at, seen_count, last_event
              FROM server_ip_history
              WHERE server_id = ?
              ORDER BY last_seen_at ASC
            `, [target]);
            console.log('TARGET_IP_HISTORY=' + JSON.stringify(historyRows));

            const purchase = purchaseRows[0];
            if (purchase) {
              try {
                const raw = await hetzner.getHetznerServer(dcs[purchase.datacenter], target);
                console.log('TARGET_PROVIDER=' + JSON.stringify({
                  id: String(raw?.id || ''),
                  name: raw?.name || null,
                  status: raw?.status || null,
                  ip: raw?.public_net?.ipv4?.ip || null,
                  ipv4_id: raw?.public_net?.ipv4?.id || null,
                  datacenter: raw?.datacenter?.name || null,
                  location: raw?.datacenter?.location?.name || raw?.location?.name || null
                }));
              } catch (e) {
                console.log('TARGET_PROVIDER_ERROR=' + String(e?.code || e?.message || e));
              }
            }
            await db.pool.end();
          })().catch(async err => {
            console.error('DIAG_ERROR=' + String(err?.stack || err));
            try { await db.pool.end(); } catch (_) {}
            process.exit(1);
          });
          NODE

          echo '=== TARGET RECONCILE CONTEXT ==='
          pm2 logs hamoonbot --nostream --lines 1800 2>/dev/null | grep -B 8 -A 12 -E '165810574|Srv-HET-d89ec4' | tail -n 260 || true
          REMOTE
