name: Diagnose latest pending Hetzner deliveries

on:
  push:
    branches: [diag/hetzner-pending-20260914]
    paths:
      - '.github/workflows/diag-hetzner-pending-20260914.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_diag_key
          chmod 600 ~/.ssh/hamoon_diag_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production diagnosis
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_diag_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo "PROD_HEAD=$(git rev-parse HEAD)"
          pm2 show hamoonbot --no-color | grep -E 'status|pid' | head -n 4 || true

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          (async () => {
            const [rows] = await db.pool.query(`
              SELECT telegram_id, server_id, server_name, datacenter, status,
                     public_ip, provider_status, provider_status_checked_at,
                     ip_quality_attempts, ip_quality_checked_at, ip_quality_summary,
                     created_at, updated_at, lifecycle_updated_at, delivered_at
              FROM purchases
              WHERE datacenter LIKE 'hetzner%'
              ORDER BY created_at DESC
              LIMIT 12
            `);
            console.log('LATEST_HETZNER_PURCHASES=' + JSON.stringify(rows));
            await db.pool.end();
          })().catch(async err => {
            console.error('DIAG_ERROR=' + String(err?.stack || err));
            try { await db.pool.end(); } catch (_) {}
            process.exit(1);
          });
          NODE

          echo '=== RECENT HETZNER RECONCILE LOGS ==='
          pm2 logs hamoonbot --nostream --lines 900 2>/dev/null | grep -E 'HETZNER_PROVISIONING_RECONCILE|HETZNER_PROVISIONING_IP_|hetzner_delivery_pending|pending_ip_quality|ip_quality|manual_review' | tail -n 220 || true
          REMOTE
