name: Post Fix Check 166481659

on:
  push:
    paths:
      - '.github/workflows/post-fix-check-166481659.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Wait for reconciler and inspect
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const net=require('net');
          const db=require('./db');
          const dc=require('./datacenters')['hetzner-finland'];
          const cloud=require('./cloud-api');
          const tcp=(host,port,timeout=4000)=>new Promise(resolve=>{
            const s=net.createConnection({host,port});
            let done=false; const f=(ok,error=null)=>{if(done)return;done=true;s.destroy();resolve({ok,error})};
            s.setTimeout(timeout);s.once('connect',()=>f(true));s.once('timeout',()=>f(false,'timeout'));s.once('error',e=>f(false,e.code||e.message));
          });
          (async()=>{
            const p=await db.getPurchaseByServerId('166481659');
            const srv=await cloud.getServer(dc,null,'166481659');
            const ip=p?.public_ip;
            console.log('STATE='+JSON.stringify({
              status:p?.status,delivered_at:p?.delivered_at,last_billed_at:p?.last_billed_at,
              public_ip:p?.public_ip,ip_quality_summary:p?.ip_quality_summary,ip_quality_attempts:p?.ip_quality_attempts,
              provider_status:srv?.status,tcp22:ip?await tcp(ip,22):null
            }));
          })().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo '=== RECOVERY LOGS ==='
          pm2 logs hamoonbot --lines 5000 --nostream 2>&1             | grep -B 10 -A 25 -E '166481659|HETZNER_PENDING_SSH_RECOVERY|ssh_unreachable_after_powercycle'             | tail -n 600 || true
          REMOTE
