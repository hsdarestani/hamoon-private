name: Inspect Customer IP From Hamoon

on:
  push:
    paths:
      - '.github/workflows/inspect-customer-ip-from-hamoon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect production logs and probe
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          echo '=== TARGETED LOG CONTEXT ==='
          pm2 logs hamoonbot --lines 8000 --nostream 2>/dev/null             | grep -B 12 -A 24 -E '91\.107\.156\.1|91\.107\.154\.221'             | tail -n 320 || true

          echo '=== LIVE STRICT QUALITY PROBE 7/8 IRAN ==='
          node - <<'NODE'
          'use strict';
          const strict = require('./services/check-host-strict-fetch');
          const lifecycle = require('./services/hetzner-lifecycle');
          strict.installStrictCheckHostFetch();
          (async () => {
            const q = await lifecycle.checkIpQuality('91.107.156.1', {
              iranCount: 8,
              iranMin: 7,
              globalCount: 6,
              globalRatio: 0.67,
              polls: 15,
              pollDelayMs: 1500
            });
            console.log(JSON.stringify(q, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          REMOTE
