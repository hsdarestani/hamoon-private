name: Audit user 1045202254 billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-user-1045202254-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Compact duplicate billing audit
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const userId = '1045202254';
          const iso = v => v ? new Date(v).toISOString() : null;

          (async () => {
            const c = await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            try {
              const [[u]] = await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1',[userId]);
              if (!u) throw new Error('USER_NOT_FOUND');
              console.log('AUDIT_USER=' + userId);
              console.log('WALLET=' + Number(u.wallet||0));

              const [purchases] = await c.execute(`SELECT server_id,server_name,duration,amount FROM purchases WHERE telegram_id=? AND status!='deleted' ORDER BY created_at`,[userId]);
              console.log('PURCHASE_COUNT=' + purchases.length);
              for (const p of purchases) console.log('SERVER=' + JSON.stringify({server_id:String(p.server_id),server_name:String(p.server_name||''),duration:String(p.duration||''),amount:Number(p.amount||0)}));

              const [logs] = await c.execute(`SELECT id,amount,description,type,timestamp FROM wallet_logs WHERE telegram_id=? AND amount<0 AND type='billing' AND timestamp>=DATE_SUB(NOW(),INTERVAL 30 DAY) ORDER BY timestamp,id`,[userId]);
              const candidates=[];
              for (const p of purchases) {
                const sid=String(p.server_id||''); const name=String(p.server_name||'');
                const m=logs.filter(l=>{const d=String(l.description||''); return (sid&&d.includes(sid))||(name&&d.includes(name));});
                let prev=null;
                for (const l of m) {
                  if (prev) {
                    const gap=(new Date(l.timestamp)-new Date(prev.timestamp))/1000;
                    if (gap>=0 && gap<600) candidates.push({server_id:sid,server_name:name,duration:String(p.duration||''),first_log_id:Number(prev.id),duplicate_log_id:Number(l.id),first_at:iso(prev.timestamp),duplicate_at:iso(l.timestamp),gap_seconds:Math.round(gap),first_amount:Number(prev.amount),duplicate_amount:Number(l.amount),refund_candidate:Math.abs(Number(l.amount||0))});
                  }
                  prev=l;
                }
              }
              const unique=[]; const seen=new Set();
              for (const x of candidates) if (!seen.has(x.duplicate_log_id)) {seen.add(x.duplicate_log_id); unique.push(x);}
              console.log('DUPLICATE_CANDIDATE_COUNT=' + unique.length);
              for (const x of unique) console.log('DUPLICATE=' + JSON.stringify(x));
              console.log('DUPLICATE_LOG_IDS=' + unique.map(x=>x.duplicate_log_id).join(','));
              console.log('REFUND_CANDIDATE_TOMAN=' + Math.round(unique.reduce((s,x)=>s+x.refund_candidate,0)));

              const [refunds]=await c.execute(`SELECT id,amount,description,timestamp FROM wallet_logs WHERE telegram_id=? AND type='billing_duplicate_refund' ORDER BY timestamp DESC LIMIT 10`,[userId]);
              console.log('EXISTING_DUPLICATE_REFUNDS=' + refunds.length);
              for (const r of refunds) console.log('PRIOR_REFUND=' + JSON.stringify({id:Number(r.id),amount:Number(r.amount),description:String(r.description||''),timestamp:iso(r.timestamp)}));
            } finally { await c.end(); }
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e.code||e.message));process.exit(1);});
          NODE
          REMOTE
