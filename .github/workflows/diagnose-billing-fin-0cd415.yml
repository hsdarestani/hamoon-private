name: Diagnose billing Srv-FIN-0cd415

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-billing-fin-0cd415.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live billing state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const db = require('./db');
          const dcs = require('./datacenters');
          const cloud = require('./cloud-api');
          const HOURS = { hourly:1, daily:24, weekly:168, monthly:720 };

          (async()=>{
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            let rows;
            try {
              [rows] = await conn.execute(
                `SELECT server_id, telegram_id, datacenter, server_name, flavor_id, amount, duration, status,
                        created_at, updated_at, last_billed_at, auto_renew, auto_renew_disabled_at,
                        renewal_stopped_at, suspend_reason, deleted_at, public_ip, lifecycle_error_code,
                        lifecycle_updated_at
                   FROM purchases
                  WHERE server_name = ? OR public_ip = ?
                  ORDER BY created_at DESC`,
                ['Srv-FIN-0cd415','65.109.177.195']
              );
            } finally { await conn.end(); }
            console.log('MATCH_COUNT=' + rows.length);
            for (const p of rows) {
              const now = new Date();
              const base = new Date(p.last_billed_at || p.created_at || now);
              const cycleHours = HOURS[String(p.duration)] || null;
              const due = cycleHours ? new Date(base.getTime() + cycleHours*3600000) : null;
              const remainingHours = due ? (due-now)/3600000 : null;
              const wallet = Number(await db.getUserWallet(String(p.telegram_id)).catch(()=>NaN));
              const logs = await db.getWalletLogs(String(p.telegram_id), 30).catch(()=>[]);
              console.log('PURCHASE ' + JSON.stringify({
                server_id:String(p.server_id), telegram_id:String(p.telegram_id), datacenter:p.datacenter,
                server_name:p.server_name, flavor_id:p.flavor_id, amount:Number(p.amount), duration:p.duration,
                status:p.status, created_at:p.created_at, updated_at:p.updated_at, last_billed_at:p.last_billed_at,
                auto_renew:Number(p.auto_renew), auto_renew_disabled_at:p.auto_renew_disabled_at,
                renewal_stopped_at:p.renewal_stopped_at, suspend_reason:p.suspend_reason, public_ip:p.public_ip,
                lifecycle_error_code:p.lifecycle_error_code, lifecycle_updated_at:p.lifecycle_updated_at,
                cycle_hours:cycleHours, due_at:due?.toISOString()||null,
                remaining_hours:remainingHours==null?null:Number(remainingHours.toFixed(2)), wallet
              }));
              console.log('WALLET_LOGS ' + JSON.stringify((logs||[]).slice(0,20).map(l=>({
                timestamp:l.timestamp, type:l.type, amount:Number(l.amount), description:String(l.description||'').slice(0,180)
              }))));
              const dc = dcs[p.datacenter];
              if (dc) {
                try {
                  const token = await cloud.getToken(dc);
                  const srv = await cloud.getServer(dc, token, p.server_id);
                  console.log('PROVIDER ' + JSON.stringify({
                    id:String(srv?.id||p.server_id), status:srv?.status||srv?.state||null,
                    ip:srv?.public_net?.ipv4?.ip||srv?.public_ip||srv?.ip||null,
                    name:srv?.name||null
                  }));
                } catch (e) {
                  console.log('PROVIDER_ERROR ' + JSON.stringify({status:e?.response?.status||e?.status||null, code:e?.code||null, message:String(e?.message||e).slice(0,180)}));
                }
              }
              try {
                const all = await db.getAllPurchases();
                const userActive = (all||[]).filter(x=>String(x.telegram_id)===String(p.telegram_id) && !['deleted','provider_missing'].includes(String(x.status||'').toLowerCase()));
                console.log('USER_ACTIVE_PURCHASES ' + JSON.stringify(userActive.map(x=>({server_id:String(x.server_id),server_name:x.server_name,datacenter:x.datacenter,status:x.status,duration:x.duration,amount:Number(x.amount),last_billed_at:x.last_billed_at,suspend_reason:x.suspend_reason,auto_renew:Number(x.auto_renew)}))));
              } catch {}
            }
          })().then(async()=>{try{await db.pool.end();}catch{}}).catch(async e=>{console.error('DIAG_FATAL ' + JSON.stringify({code:e?.code||null,message:String(e?.message||e)}));try{await db.pool.end();}catch{};process.exitCode=1;});
          NODE
          echo '=== RECENT MATCHING PM2 LOGS ==='
          pm2 logs hamoonbot --lines 5000 --nostream 2>/dev/null | grep -E 'Srv-FIN-0cd415|65\.109\.177\.195|Billing' | tail -n 220 || true
          REMOTE
