name: Diagnose Resume Fix

on:
  push:
    branches: [main]
    paths:
      - 'resume-transactional-bootstrap.js'
      - 'billing-settlement-recovery.js'
      - 'runtime-bootstrap.js'
      - '.github/workflows/diagnose-resume-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax new recovery files
        run: |
          node --check resume-transactional-bootstrap.js
          node --check billing-settlement-recovery.js
          node --check scripts/recover-suspended-server.js
          node --check runtime-bootstrap.js

      - name: Apply billing renewal guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { applyBillingRenewalGuardPatches } = require('./billing-renewal-guard-bootstrap');
          const out = applyBillingRenewalGuardPatches(fs.readFileSync('index-core.js', 'utf8'));
          if (!out.includes('async function resumePurchaseWithBillingGuard(')) throw new Error('RENEWAL_RESUME_FUNCTION_MISSING');
          console.log('billing renewal guard: ok');
          NODE

      - name: Apply atomic settlement after renewal guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { applyBillingRenewalGuardPatches } = require('./billing-renewal-guard-bootstrap');
          const { applyBillingSettlementPatches } = require('./billing-settlement-bootstrap');
          let out = applyBillingRenewalGuardPatches(fs.readFileSync('index-core.js', 'utf8'));
          out = applyBillingSettlementPatches(out);
          for (const marker of ["require('./billing-settlement')", 'settleServerRenewalAtomic({', "settlement.status === 'charged'"]) {
            if (!out.includes(marker)) throw new Error('SETTLEMENT_STAGE_MARKER_MISSING:' + marker);
          }
          console.log('atomic settlement: ok');
          NODE

      - name: Apply resume recovery after atomic settlement
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { applyBillingRenewalGuardPatches } = require('./billing-renewal-guard-bootstrap');
          const { applyBillingSettlementPatches } = require('./billing-settlement-bootstrap');
          const { applyResumeTransactionalPatches } = require('./resume-transactional-bootstrap');
          let out = applyBillingRenewalGuardPatches(fs.readFileSync('index-core.js', 'utf8'));
          out = applyBillingSettlementPatches(out);
          out = applyResumeTransactionalPatches(out);
          for (const marker of [
            "require('./billing-settlement-recovery')",
            'renewalSettlementEventKey',
            'rollbackServerRenewalAtomic({',
            'PROVIDER_POWER_ON_NOT_CONFIRMED',
            'resumeProviderErrorMessage(error)'
          ]) {
            if (!out.includes(marker)) throw new Error('RESUME_STAGE_MARKER_MISSING:' + marker);
          }
          console.log('resume recovery: ok');
          NODE

      - name: Full runtime composition
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const composed = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          if (!composed.includes('PROVIDER_POWER_ON_NOT_CONFIRMED')) throw new Error('FULL_RUNTIME_RESUME_MARKER_MISSING');
          console.log('full runtime composition: ok');
          NODE

      - name: Existing billing validators
        run: |
          node scripts/validate-billing-cycle-change.js
          node scripts/validate-billing-renewal-guard.js
          node scripts/validate-reseller-billing-grace.js
