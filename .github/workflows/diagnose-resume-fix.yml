name: Diagnose Resume Fix

on:
  push:
    branches: [main]
    paths:
      - 'resume-transactional-bootstrap.js'
      - 'billing-settlement-recovery.js'
      - 'runtime-bootstrap.js'
      - '.github/workflows/diagnose-resume-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose legacy runtime and apply resume recovery
        run: |
          set -euo pipefail
          node --check resume-transactional-bootstrap.js
          node --check billing-settlement-recovery.js
          node - <<'NODE'
          const fs = require('fs');
          const runtime = require('./runtime-bootstrap');
          const { applyResumeTransactionalPatches } = require('./resume-transactional-bootstrap');
          const baseline = runtime.applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          const out = applyResumeTransactionalPatches(baseline);
          const required = [
            "require('./billing-settlement-recovery')",
            'renewalSettlementEventKey',
            'rollbackServerRenewalAtomic({',
            'PROVIDER_POWER_ON_NOT_CONFIRMED',
            'resumeProviderErrorMessage(error)'
          ];
          for (const marker of required) {
            if (!out.includes(marker)) throw new Error('FINAL_RESUME_MARKER_MISSING:' + marker);
          }
          new Function(out);
          console.log('resume recovery composition: ok');
          NODE
