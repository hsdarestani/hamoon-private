name: Deploy Zibal Resilience

on:
  push:
    branches: [main]
    paths:
      - 'services/zibal-gateway.js'
      - 'scripts/validate-zibal-gateway.js'
      - 'index-core.js'
      - 'server.js'
      - 'external-payments.js'
      - '.github/workflows/deploy-zibal-resilience.yml'
  workflow_dispatch:

concurrency:
  group: hamoon-zibal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate Zibal routing changes
        shell: bash
        run: |
          set -euo pipefail
          node --check services/zibal-gateway.js
          node --check scripts/validate-zibal-gateway.js
          node --check index-core.js
          node --check server.js
          node --check external-payments.js
          node scripts/validate-zibal-gateway.js
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const runtime = require('./runtime-bootstrap');
          const source = runtime.applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          new vm.Script(source, { filename: 'index-core.runtime-patched.js' });
          console.log('runtime-patched-index: ok');
          NODE

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git pull --ff-only
          node scripts/restore-server-secret-key.js .env >/dev/null

          node --check services/zibal-gateway.js
          node --check index-core.js
          node --check server.js
          node --check external-payments.js
          node scripts/validate-zibal-gateway.js

          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const runtime = require('./runtime-bootstrap');
          const source = runtime.applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          new vm.Script(source, { filename: 'index-core.runtime-patched.js' });
          console.log('runtime-patched-index: ok');
          NODE

          echo '=== SAFE LIVE ZIBAL CONNECTIVITY TEST ==='
          node - <<'NODE'
          const axios = require('axios');
          const { postToZibal } = require('./services/zibal-gateway');
          (async () => {
            const response = await postToZibal(axios, '/v1/request', {
              merchant: '__hamoon_connectivity_test_invalid__',
              amount: 10000,
              callbackUrl: 'https://pay.hamooncloud.ir/zibal/callback'
            }, { timeoutMs: 8000 });
            const data = response.data || {};
            if (Number(data.result) === 100 || data.trackId) {
              throw new Error('CONNECTIVITY_TEST_UNEXPECTED_TRANSACTION');
            }
            console.log('ZIBAL_CONNECTIVITY_OK gateway_ip=' + response.zibalGatewayIp + ' result=' + String(data.result));
          })().catch(error => {
            console.error('ZIBAL_CONNECTIVITY_FAILED', error.code || error.message, error.zibalGatewayIp || '');
            process.exit(1);
          });
          NODE

          echo '=== RESTART PAYMENT PROCESSES ==='
          pm2 restart hamoonbot --update-env >/dev/null
          pm2 restart dashboard-server --update-env >/dev/null
          sleep 5

          node - <<'NODE'
          const { execSync } = require('child_process');
          const list = JSON.parse(execSync('pm2 jlist', { encoding: 'utf8' }));
          for (const name of ['hamoonbot', 'dashboard-server']) {
            const p = list.find(x => x.name === name);
            const status = p?.pm2_env?.status || 'missing';
            console.log(name + '_STATUS=' + status);
            if (status !== 'online') process.exitCode = 1;
          }
          NODE

          echo '=== POST-RESTART ZIBAL CONNECTIVITY ==='
          node - <<'NODE'
          const axios = require('axios');
          const { postToZibal } = require('./services/zibal-gateway');
          (async () => {
            const response = await postToZibal(axios, '/v1/request', {
              merchant: '__hamoon_connectivity_test_invalid__',
              amount: 10000,
              callbackUrl: 'https://pay.hamooncloud.ir/zibal/callback'
            }, { timeoutMs: 8000 });
            const data = response.data || {};
            if (Number(data.result) === 100 || data.trackId) throw new Error('UNEXPECTED_TRANSACTION');
            console.log('ZIBAL_POST_RESTART_OK gateway_ip=' + response.zibalGatewayIp + ' result=' + String(data.result));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          REMOTE
