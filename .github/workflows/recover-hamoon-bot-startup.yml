name: Recover Hamoon Bot Startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-hamoon-bot-startup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bootstrap and validate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fix-server-display-names-delete-bootstrap.js
          node --check server-display-names-bootstrap.js
          node - <<'NODE'
          const fs = require('fs');
          const b = require('./server-display-names-bootstrap');
          b.applyPatches(fs.readFileSync('index-core.js','utf8'));
          console.log('BOOTSTRAP_PATCH_OK');
          NODE

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add server-display-names-bootstrap.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(runtime): support deletion refund flow in display-name bootstrap'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify bot
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node --check server-display-names-bootstrap.js
          node - <<'NODE'
          const fs = require('fs');
          const b = require('./server-display-names-bootstrap');
          b.applyPatches(fs.readFileSync('index-core.js','utf8'));
          console.log('PROD_BOOTSTRAP_PATCH_OK');
          NODE
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 8
          STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$STATUS"
          test "$STATUS" = online
          echo '=== RECENT STARTUP ERRORS ==='
          pm2 logs hamoonbot --lines 120 --nostream 2>&1 | grep -Ei 'server-display-names|Error:|SyntaxError|ReferenceError|TypeError|ETELEGRAM: 409|polling_error' | tail -n 80 || true
          REMOTE
