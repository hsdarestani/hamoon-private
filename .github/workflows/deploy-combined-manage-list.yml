name: Deploy Combined Manage List

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-combined-manage-list.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Validate combined manage runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check index-core.js
          node --check provider-visibility-bootstrap.js
          node --check server-display-names-bootstrap.js
          npm run validate:hetzner-purchase-architecture
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const runtime = require('./runtime-bootstrap');
          const source = runtime.applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          new vm.Script(source, { filename: 'index-core.runtime-patched.js' });
          for (const marker of [
            'const projectManageKeyboard = projects.map',
            'const keyboard = [...projectManageKeyboard, ...serverManageKeyboard];',
            '[MANAGE] provider list missed owned server; using purchase fallback',
            'const datacenterKeys = []; // MANAGE_DB_FIRST',
            'const serverDisplayNames = await getServerDisplayNameMap(effectiveUserId);'
          ]) {
            if (!source.includes(marker)) throw new Error('MANAGE_RUNTIME_MARKER_MISSING:' + marker);
          }
          console.log('MANAGE_RUNTIME_PATCH=ok');
          NODE

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git pull --ff-only
          node scripts/restore-server-secret-key.js .env >/dev/null

          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const runtime = require('./runtime-bootstrap');
          const source = runtime.applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          new vm.Script(source, { filename: 'index-core.runtime-patched.js' });
          if (!source.includes('const keyboard = [...projectManageKeyboard, ...serverManageKeyboard];')) {
            throw new Error('COMBINED_MANAGE_LIST_NOT_ACTIVE');
          }
          console.log('PRODUCTION_RUNTIME_PATCH=ok');
          NODE

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5

          node - <<'NODE'
          const { execSync } = require('child_process');
          const list = JSON.parse(execSync('pm2 jlist', { encoding: 'utf8' }));
          const proc = list.find(x => x.name === 'hamoonbot');
          const status = proc?.pm2_env?.status || 'missing';
          console.log('HAMOONBOT_STATUS=' + status);
          if (status !== 'online') process.exit(1);
          NODE

          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const { getUserProjects } = require('./user_projects');
          (async () => {
            const userId = '6940016723';
            const projects = getUserProjects(userId) || [];
            const purchases = await db.getUserActivePurchases(userId);
            const target = purchases.find(p => String(p.server_id) === '163962972');
            console.log('RAJABI_PROJECT_COUNT=' + projects.length);
            console.log('RAJABI_ACTIVE_PURCHASE_COUNT=' + purchases.length);
            console.log('TARGET_VISIBLE_SOURCE=' + JSON.stringify(target ? {
              server_id: String(target.server_id),
              server_name: target.server_name,
              datacenter: target.datacenter,
              status: target.status
            } : null));
            if (!target) throw new Error('TARGET_ACTIVE_PURCHASE_NOT_FOUND');
          })().then(() => process.exit(0)).catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE
          REMOTE
