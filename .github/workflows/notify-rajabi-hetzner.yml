name: Notify Rajabi Hetzner Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify-rajabi-hetzner.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Send notification
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const TelegramBot = require('node-telegram-bot-api');
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = '6940016723';
          const text = [
            '✅ سلام، مشکل ساخت و تحویل سرورهای Hetzner بررسی و اصلاح شد.',
            '',
            'مشکل مربوط به حالتی بود که بعضی IPها بعد از روشن شدن سرور دسترسی SSH مناسبی نداشتند و سرور روی بررسی دستی می‌ماند.',
            'الان سیستم اصلاح شده و در این حالت قبل از توقف، به‌صورت خودکار IP جدید می‌گیرد و دوباره SSH و دسترسی ایران/خارج را بررسی می‌کند.',
            '',
            'دو سروری که در حالت manual_review بودند حذف شده‌اند. آخرین سرور آلمان شما الان فعال و تحویل‌شده است و تست IP ایران و خارج را کامل پاس کرده. ✅',
            '',
            'اگر سرور جدیدی بسازید، این مسیر اصلاح‌شده روی آن اعمال می‌شود.'
          ].join('\n');

          (async()=>{
            if (!token) throw new Error('TELEGRAM_BOT_TOKEN_MISSING');
            const bot = new TelegramBot(token, {polling:false});
            const msg = await bot.sendMessage(chatId, text);
            console.log('TELEGRAM_NOTIFY_SENT=yes');
            console.log('TELEGRAM_NOTIFY_MESSAGE_ID=' + String(msg?.message_id || 'unknown'));
          })().catch(err=>{
            console.log('TELEGRAM_NOTIFY_SENT=no');
            console.log('TELEGRAM_NOTIFY_ERROR=' + String(err?.message || err).slice(0,160));
            process.exit(1);
          });
          NODE
          REMOTE
