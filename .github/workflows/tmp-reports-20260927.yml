name: Temporary branch diagnostics 2026-09-27

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate changed runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check Hetzner/hetzner-api.js
          node --check billing-settlement.js
          node --check datacenters.js
          node --check hetzner-traffic-bootstrap.js
          node --check provider-visibility-bootstrap.js
          node --check services/loyalty-club.js
          node scripts/validate-hetzner-traffic.js
          node scripts/validate-provider-visibility.js
          node scripts/validate-hetzner-pricing.js
          node <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const output = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          fs.writeFileSync('/tmp/hamoon-patched-index.js', output);
          console.log('PATCHED_RUNTIME_BYTES=' + Buffer.byteLength(output));
          NODE
          node --check /tmp/hamoon-patched-index.js

      - name: Prepare read-only production audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Audit user 53328018 Hetzner traffic
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const userId = '53328018';
          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              const [[u]] = await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1', [userId]);
              console.log('USER_FOUND=' + Boolean(u));
              if (u) console.log('WALLET_TOMAN=' + Number(u.wallet || 0));

              const [purchases] = await c.execute(
                `SELECT server_id,server_name,datacenter,status,created_at,delivered_at
                   FROM purchases
                  WHERE telegram_id=?
                    AND (datacenter='hetzner' OR datacenter LIKE 'hetzner-%')
                  ORDER BY created_at DESC`,
                [userId]
              );
              console.log('HETZNER_PURCHASES=' + JSON.stringify(purchases));

              const [logs] = await c.execute(
                `SELECT id,amount,description,type,timestamp
                   FROM wallet_logs
                  WHERE telegram_id=?
                    AND type='hetzner_traffic_overage'
                  ORDER BY timestamp DESC
                  LIMIT 100`,
                [userId]
              );
              console.log('TRAFFIC_OVERAGE_LOGS=' + JSON.stringify(logs));

              try {
                const [billing] = await c.execute(
                  `SELECT server_id,period_start,billed_overage_bytes,billed_amount_toman,last_outgoing_bytes,included_traffic_bytes,price_per_tb,updated_at
                     FROM hetzner_traffic_billing
                    WHERE telegram_id=?
                    ORDER BY period_start DESC, updated_at DESC`,
                  [userId]
                );
                console.log('TRAFFIC_BILLING_ROWS=' + JSON.stringify(billing));
              } catch (e) {
                console.log('TRAFFIC_BILLING_ROWS_ERROR=' + String(e.code || e.message));
              }

              const dcs = require('./datacenters');
              const trafficApi = require('./hetzner-traffic');
              for (const p of purchases.filter(x => String(x.status || '').toLowerCase() !== 'deleted')) {
                const dc = dcs[p.datacenter] || dcs[String(p.datacenter || '').split('__')[0]];
                if (!dc) {
                  console.log('LIVE_TRAFFIC=' + JSON.stringify({server_id:p.server_id,error:'DATACENTER_CONFIG_MISSING'}));
                  continue;
                }
                try {
                  const t = await trafficApi.getServerTraffic(dc, p.server_id, 'current');
                  console.log('LIVE_TRAFFIC=' + JSON.stringify({
                    server_id:p.server_id,
                    server_name:p.server_name,
                    datacenter:p.datacenter,
                    outgoing_traffic:t.outgoing_traffic,
                    incoming_traffic:t.incoming_traffic,
                    included_traffic:t.included_traffic,
                    period_start:t.traffic_period_start,
                    period_reset:t.traffic_period_reset,
                    generated_at:t.generated_at
                  }));

                  const { hetznerRequest } = require('./Hetzner/hetzner-api');
                  const period = trafficApi.currentHetznerTrafficPeriod(new Date());
                  const end = new Date().toISOString();
                  const params = new URLSearchParams({
                    type: 'network',
                    start: period.start,
                    end,
                    step: '1800'
                  });
                  const metricData = await hetznerRequest(dc, 'GET', '/servers/' + encodeURIComponent(p.server_id) + '/metrics?' + params.toString());
                  const series = metricData?.metrics?.time_series || {};
                  console.log('CURRENT_MONTH_METRICS=' + JSON.stringify({
                    server_id:p.server_id,
                    start:period.start,
                    end,
                    outgoing_bytes:trafficApi.sumHetznerMetricDirection(series, 'out', 1800),
                    incoming_bytes:trafficApi.sumHetznerMetricDirection(series, 'in', 1800)
                  }));
                } catch (e) {
                  console.log('LIVE_TRAFFIC=' + JSON.stringify({server_id:p.server_id,error:String(e.code || e.status || e.message)}));
                }
              }
            } finally {
              await c.end();
            }
          })().catch(e => {
            console.error('AUDIT_FAILED=' + String(e.code || e.message));
            process.exit(1);
          });
          NODE
          REMOTE
