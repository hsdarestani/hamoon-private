name: Repair user 138279367 Hetzner server

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-user-138279367.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Repair live server
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          node <<'NODE'
          const net = require('net');
          require('dotenv').config();
          process.env.HETZNER_CHANGE_IP_CLEAN_ATTEMPTS = '4';
          process.env.HETZNER_CHANGE_IP_QUALITY_PROBE_ATTEMPTS = '2';
          const mysql = require('mysql2/promise');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          const db = require('./db');
          const cleanIp = require('./services/hetzner-clean-ip-change');
          const userId = '138279367';

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          function tcp22(ip, timeout=4000) {
            return new Promise(resolve => {
              if (!ip) return resolve(false);
              const s = net.createConnection({host: ip, port: 22});
              let done = false;
              const finish = v => { if (done) return; done = true; s.destroy(); resolve(v); };
              s.setTimeout(timeout);
              s.once('connect', () => finish(true));
              s.once('timeout', () => finish(false));
              s.once('error', () => finish(false));
            });
          }
          async function waitTcp(ip, attempts=12) {
            for (let i=1; i<=attempts; i++) {
              const ok = await tcp22(ip);
              console.log('TCP22_ATTEMPT ' + JSON.stringify({attempt:i, ip, ok}));
              if (ok) return true;
              if (i < attempts) await sleep(5000);
            }
            return false;
          }
          async function rawServer(dc, id) {
            const data = await hetzner.hetznerRequest(dc, 'GET', `/servers/${encodeURIComponent(String(id))}`);
            return data.server;
          }
          function info(s) {
            return {
              id:String(s?.id||''), name:s?.name||null, status:s?.status||null,
              ip:s?.public_net?.ipv4?.ip||null,
              server_type:s?.server_type?.name||null,
              user_label:s?.labels?.user||null
            };
          }

          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1', user: process.env.DB_USER,
              password: process.env.DB_PASSWORD, database: process.env.DB_NAME || 'hamooncloud_db'
            });
            let purchases;
            try {
              [purchases] = await conn.execute(
                "SELECT server_id, datacenter, server_name, status, public_ip, suspend_reason, auto_renew FROM purchases WHERE telegram_id=? AND status <> 'deleted' ORDER BY created_at DESC",
                [userId]
              );
            } finally { await conn.end(); }

            if (purchases.length !== 1) throw new Error(`EXPECTED_ONE_LIVE_PURCHASE_GOT_${purchases.length}`);
            const p = purchases[0];
            const dc = dcs[p.datacenter];
            if (!dc || String(dc.provider||dc.apiType||'').toLowerCase() !== 'hetzner') throw new Error('LIVE_PURCHASE_NOT_HETZNER');

            let srv = await rawServer(dc, p.server_id);
            console.log('BEFORE ' + JSON.stringify({...info(srv), db_status:p.status, db_ip:p.public_ip, suspend_reason:p.suspend_reason, datacenter:p.datacenter}));
            let ip = srv?.public_net?.ipv4?.ip || null;
            let reachable = await tcp22(ip);
            console.log('TCP22_BEFORE=' + reachable);

            if (!reachable) {
              console.log('ACTION reboot');
              const data = await hetzner.hetznerRequest(dc, 'POST', `/servers/${p.server_id}/actions/reboot`, {});
              if (data?.action?.id) await hetzner.waitHetznerAction(dc, data.action.id, 180000);
              await sleep(10000);
              srv = await rawServer(dc, p.server_id);
              ip = srv?.public_net?.ipv4?.ip || ip;
              reachable = await waitTcp(ip, 10);
              console.log('AFTER_REBOOT ' + JSON.stringify({...info(srv), tcp22:reachable}));
            }

            if (!reachable) {
              console.log('ACTION clean_ip_change');
              try {
                const result = await cleanIp.changeHetznerPublicIp({
                  db, dc, telegramId:userId, serverId:String(p.server_id), datacenter:String(p.datacenter)
                });
                console.log('IP_CHANGE_RESULT ' + JSON.stringify({oldIp:result.oldIp,newIp:result.newIp,attempts:result.attempts||1}));
              } catch (e) {
                console.log('IP_CHANGE_ERROR ' + JSON.stringify({code:e?.code||null,message:String(e?.message||e).slice(0,180),currentIp:e?.currentIp||null}));
              }
              srv = await rawServer(dc, p.server_id);
              ip = srv?.public_net?.ipv4?.ip || ip;
              reachable = await waitTcp(ip, 12);
              console.log('AFTER_IP_CHANGE ' + JSON.stringify({...info(srv), tcp22:reachable}));
            }

            const sync = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1', user: process.env.DB_USER,
              password: process.env.DB_PASSWORD, database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              await sync.execute(
                `UPDATE purchases SET public_ip=?, status='active', suspend_reason=NULL, lifecycle_error_code=NULL, lifecycle_updated_at=CURRENT_TIMESTAMP, updated_at=CURRENT_TIMESTAMP
                 WHERE telegram_id=? AND server_id=? AND datacenter=? AND status <> 'deleted'`,
                [ip, userId, String(p.server_id), String(p.datacenter)]
              );
            } finally { await sync.end(); }

            console.log('FINAL ' + JSON.stringify({...info(srv), tcp22:reachable, db_synced:true}));
            if (!reachable) {
              const e = new Error('SERVER_STILL_NOT_REACHABLE_ON_TCP22');
              e.code = 'SERVER_STILL_NOT_REACHABLE_ON_TCP22';
              throw e;
            }
          })().then(async()=>{ try{await db.pool.end();}catch{} }).catch(async e=>{ console.error('REPAIR_FATAL ' + JSON.stringify({code:e?.code||null,message:String(e?.message||e)})); try{await db.pool.end();}catch{} process.exitCode=1; });
          NODE
          REMOTE
