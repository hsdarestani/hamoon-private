name: Recover Pending SSH 166481659

on:
  push:
    paths:
      - '.github/workflows/recover-pending-ssh-166481659.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Recover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const net=require('net');
          const db=require('./db');
          const dc=require('./datacenters')['hetzner-finland'];
          const cloud=require('./cloud-api');

          const EXPECTED={
            userId:'278773395',
            serverId:'166481659',
            name:'Srv-FIN-9f6daa',
            datacenter:'hetzner-finland'
          };

          function tcp22(ip, timeout=4000) {
            return new Promise(resolve=>{
              const s=net.createConnection({host:ip,port:22});
              let done=false;
              const finish=(ok,error=null)=>{if(done)return;done=true;s.destroy();resolve({ok,error});};
              s.setTimeout(timeout);
              s.once('connect',()=>finish(true));
              s.once('timeout',()=>finish(false,'timeout'));
              s.once('error',e=>finish(false,e.code||e.message));
            });
          }
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const p=await db.getPurchaseForUserServer(EXPECTED.userId,EXPECTED.serverId,EXPECTED.datacenter);
            if(!p) throw new Error('GUARD_PURCHASE_NOT_FOUND');
            if(String(p.server_name)!==EXPECTED.name) throw new Error('GUARD_NAME_MISMATCH');
            if(String(p.status)!=='pending_ssh') throw new Error('GUARD_STATUS_CHANGED:'+String(p.status));
            if(p.delivered_at) throw new Error('GUARD_ALREADY_DELIVERED');

            const before=await cloud.getServer(dc,await cloud.getToken(dc),EXPECTED.serverId);
            if(String(before?.name)!==EXPECTED.name) throw new Error('GUARD_PROVIDER_NAME_MISMATCH');
            const ip=before?.public_net?.ipv4?.ip||p.public_ip;
            console.log('BEFORE='+JSON.stringify({status:before?.status,ip,tcp22:await tcp22(ip)}));

            const off=await cloud.powerOffHetznerServer(dc,EXPECTED.serverId);
            const offId=off?.id||off?.action?.id;
            if(offId) await cloud.waitHetznerAction(dc,offId,120000);
            await sleep(2000);

            const on=await cloud.powerOnHetznerServer(dc,EXPECTED.serverId);
            const onId=on?.id||on?.action?.id;
            if(onId) await cloud.waitHetznerAction(dc,onId,120000);

            let result={ok:false,error:'not_checked'};
            for(let i=0;i<18;i++){
              await sleep(i===0?5000:5000);
              result=await tcp22(ip,4000);
              console.log('SSH_PROBE_'+(i+1)+'='+JSON.stringify(result));
              if(result.ok) break;
            }

            const after=await cloud.getServer(dc,null,EXPECTED.serverId);
            console.log('AFTER='+JSON.stringify({status:after?.status,ip,tcp22:result}));
          })().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)});
          NODE
          REMOTE
