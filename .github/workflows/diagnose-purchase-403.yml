name: Diagnose Purchase 403

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-purchase-403.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Diagnose production purchase errors
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== RECENT PURCHASE ERRORS ==='
          pm2 logs hamoonbot --lines 1800 --nostream 2>&1 | grep -E -C 3 'Purchase Error|Hetzner createServer error|status code 403|HTTP 403|forbidden|forbidden|403' | tail -300 || true
          echo '=== HETZNER READ-ONLY API TEST ==='
          node - <<'NODE'
          require('dotenv').config();
          const datacenters = require('./datacenters');
          const axios = require('axios');
          (async () => {
            const dc = datacenters.hetzner || Object.values(datacenters).find(x => String(x?.provider || x?.apiType || '').toLowerCase().includes('hetzner'));
            if (!dc) throw new Error('HETZNER_DC_NOT_FOUND');
            const token = dc.HETZNER_API_TOKEN || dc.HETZNER_TOKEN || dc.apiToken || dc.token || process.env.HETZNER_API_TOKEN || process.env.HETZNER_TOKEN || process.env.HCLOUD_TOKEN;
            console.log('TOKEN_PRESENT=' + Boolean(token));
            const r = await axios.get('https://api.hetzner.cloud/v1/server_types?per_page=1', {
              headers: { Authorization: 'Bearer ' + token },
              timeout: 20000,
              validateStatus: () => true
            });
            console.log('HETZNER_SERVER_TYPES_HTTP=' + r.status);
            console.log('HETZNER_SERVER_TYPES_BODY=' + JSON.stringify(r.data));
          })().catch(e => { console.error('HETZNER_TEST_FATAL=' + (e?.message || e)); process.exit(1); });
          NODE
          REMOTE