name: Diagnose Management Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-management-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live management callbacks
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== VERSION ==='
          git rev-parse HEAD
          echo '=== PM2 ==='
          pm2 jlist > /tmp/p.json
          node -e "const a=require('/tmp/p.json').filter(x=>x.name==='hamoonbot'); console.log(JSON.stringify(a.map(p=>({pid:p.pid,status:p.pm2_env?.status,mode:p.pm2_env?.exec_mode,restarts:p.pm2_env?.restart_time,script:p.pm2_env?.pm_exec_path,cwd:p.pm2_env?.pm_cwd})),null,2))"
          echo '=== BOT API ==='
          set +u
          [ -f .env ] && set -a && . ./.env && set +a
          set -u
          node - <<'NODE'
          const https=require('https');
          const token=process.env.TELEGRAM_BOT_TOKEN;
          if(!token){ console.log('TELEGRAM_BOT_TOKEN_MISSING'); process.exit(0); }
          https.get('https://api.telegram.org/bot'+token+'/getWebhookInfo',res=>{
            let d=''; res.on('data',c=>d+=c); res.on('end',()=>{
              try{
                const j=JSON.parse(d);
                const r=j.result||{};
                console.log(JSON.stringify({ok:j.ok,url:r.url||'',pending_update_count:r.pending_update_count,last_error_date:r.last_error_date||null,last_error_message:r.last_error_message||null},null,2));
              }catch(e){console.log('WEBHOOK_INFO_PARSE_ERROR',e.message)}
            });
          }).on('error',e=>console.log('WEBHOOK_INFO_ERROR',e.message));
          NODE
          sleep 2
          echo '=== CALLBACK TRACE ==='
          pm2 logs hamoonbot --nostream --lines 5000 2>&1 | grep -E -i "MANAGE_CALLBACK_RECEIVED|STALE_CALLBACK|CALLBACK_ACK_FAILED|TELEGRAM_PARSE_FALLBACK|Manage Server Error|callback_query|ETELEGRAM|409 Conflict|terminated by other getUpdates|query is too old|query_id_invalid" | tail -800 || true
          echo '=== LAST MANAGE LIST EVENTS ==='
          pm2 logs hamoonbot --nostream --lines 2500 2>&1 | grep -E "\[MANAGE\]" | tail -120 || true
          REMOTE
