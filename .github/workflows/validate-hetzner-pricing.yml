name: Validate Hetzner pricing

on:
  pull_request:
    branches:
      - main
    paths:
      - Hetzner/hetzner-api.js
      - index.js
      - index-core.js
      - runtime-bootstrap.js
      - hetzner-purchase-architecture-bootstrap.js
      - hetzner-purchase-images.js
      - provider-capabilities.js
      - scripts/reconcile-hetzner-billing-amounts.js
      - scripts/validate-hetzner-pricing.js
      - scripts/validate-hetzner-purchase-architecture.js
      - scripts/validate-provider-capabilities.js
      - package.json
      - .github/workflows/validate-hetzner-pricing.yml
  push:
    branches:
      - main
    paths:
      - Hetzner/hetzner-api.js
      - index.js
      - index-core.js
      - runtime-bootstrap.js
      - hetzner-purchase-architecture-bootstrap.js
      - hetzner-purchase-images.js
      - provider-capabilities.js
      - scripts/reconcile-hetzner-billing-amounts.js
      - scripts/validate-hetzner-pricing.js
      - scripts/validate-hetzner-purchase-architecture.js
      - scripts/validate-provider-capabilities.js
      - package.json
      - .github/workflows/validate-hetzner-pricing.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node -c Hetzner/hetzner-api.js
      - run: node -c index.js
      - run: node -c scripts/reconcile-hetzner-billing-amounts.js
      - run: node scripts/validate-hetzner-pricing.js
      - run: npm run validate:hetzner-purchase-architecture
      - run: npm run validate:provider-capabilities
      - run: npm run validate:hetzner-lifecycle
