name: Repair Srv HET 4b2569 SSH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-srv-het-4b2569-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-srv-het-4b2569
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
      TARGET_IP: 91.107.146.135
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Repair target through Hetzner rescue
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          TARGET_IP_B64="$(printf '%s' "$TARGET_IP" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "APP_PATH_B64='$APP_PATH_B64' TARGET_IP_B64='$TARGET_IP_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          TARGET_IP="$(printf '%s' "$TARGET_IP_B64" | base64 -d)"
          cd "$APP_PATH"
          node --check scripts/repair-hetzner-ssh.js
          node scripts/repair-hetzner-ssh.js "$TARGET_IP"
          REMOTE

      - name: Verify from runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying $TARGET_IP"
          for i in 1 2 3 4 5; do
            if nc -vz -w 5 "$TARGET_IP" 22; then
              echo "TCP22_OK"
              exit 0
            fi
            sleep 5
          done
          echo "TCP22_STILL_UNREACHABLE"
          exit 1
