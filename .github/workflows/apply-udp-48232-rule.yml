name: Apply UDP 48232 firewall rule

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Connect and apply narrowly scoped rule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const targetIp = '91.107.144.130';
          const sourceCidr = '185.235.196.74/32';
          const port = '48232';
          const token = process.env.HETZNER_API_TOKEN || process.env.HETZNER_TOKEN || process.env.HCLOUD_TOKEN;
          if (!token) throw new Error('HETZNER_TOKEN_MISSING');

          const api = async (path, options = {}) => {
            const response = await fetch('https://api.hetzner.cloud/v1' + path, {
              ...options,
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json();
            if (!response.ok) throw new Error(response.status + ': ' + JSON.stringify(body));
            return body;
          };
          async function all(path, key) {
            const values = [];
            for (let page = 1;; page += 1) {
              const data = await api(path + '?per_page=50&page=' + page);
              values.push(...data[key]);
              if (data[key].length < 50) return values;
            }
          }

          const matches = (await all('/servers', 'servers')).filter(s => s.public_net?.ipv4?.ip === targetIp);
          if (matches.length !== 1) throw new Error('TARGET_SERVER_MATCH_COUNT_' + matches.length);
          const server = matches[0];
          const attached = (await all('/firewalls', 'firewalls')).filter(f =>
            (f.applied_to || []).some(x => x.type === 'server' && String(x.server?.id) === String(server.id))
          );
          if (attached.length !== 1) throw new Error('ATTACHED_FIREWALL_COUNT_' + attached.length);
          const firewall = attached[0];
          const exists = (firewall.rules || []).some(r =>
            r.direction === 'in' && r.protocol === 'udp' && String(r.port) === port &&
            (r.source_ips || []).includes(sourceCidr)
          );
          if (!exists) {
            const data = await api('/firewalls/' + firewall.id + '/actions/set_rules', {
              method: 'POST',
              body: JSON.stringify({
                rules: [...firewall.rules, {
                  direction: 'in', protocol: 'udp', port, source_ips: [sourceCidr]
                }]
              })
            });
            console.log('ACTION_ID=' + data.action.id);
          }
          console.log(JSON.stringify({ result: exists ? 'already_present' : 'rule_added', server_id: server.id, firewall_id: firewall.id, targetIp, sourceCidr, port }));
          NODE
          REMOTE
