name: Inspect IP 91.107.156.1

on:
  push:
    paths:
      - '.github/workflows/inspect-ip-91-107-156-1.yml'
      - 'scripts/inspect-ip-91-107-156-1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Iran reachability
        run: node scripts/inspect-ip-91-107-156-1.js 91.107.156.1
