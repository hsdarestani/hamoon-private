name: Apply Hetzner Password Autorecovery V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hetzner-password-autorecovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch API and verify fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-hetzner-password-recovery-fix.py
          node --check customer-api.js
          node --check services/hetzner-lifecycle.js
          node --check cloud-api.js
          grep -q 'HETZNER_API_PASSWORD_PRESTORE_V1' customer-api.js
          grep -q 'HETZNER_PASSWORD_AUTORECOVERY_V2' services/hetzner-lifecycle.js
          grep -q "rootPassword = await cloud.resetServerPassword(dc, null, serverId)" customer-api.js
          grep -q "reason: 'password_recovery_failed'" services/hetzner-lifecycle.js

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add customer-api.js services/hetzner-lifecycle.js cloud-api.js index-core.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix(api): pre-store Hetzner delivery password'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node scripts/restore-server-secret-key.js .env
          node --check customer-api.js
          node --check services/hetzner-lifecycle.js
          grep -q 'HETZNER_API_PASSWORD_PRESTORE_V1' customer-api.js
          grep -q 'HETZNER_PASSWORD_AUTORECOVERY_V2' services/hetzner-lifecycle.js
          node scripts/recover-hetzner-password-missing.js
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = 'online'
          sleep 70
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async()=>{
            const c=await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
            const [[p]]=await c.execute(`SELECT server_id,status,delivered_at,public_ip,ip_quality_attempts FROM purchases WHERE server_id=? LIMIT 1`,['165539333']);
            const [[s]]=await c.execute(`SELECT COUNT(*) n FROM server_secrets WHERE server_id=? AND secret_type='root_password'`,['165539333']);
            const [[m]]=await c.execute(`SELECT COUNT(*) n FROM purchases p WHERE p.status='manual_review' AND p.delivered_at IS NULL AND (LOWER(p.datacenter)='hetzner' OR LOWER(p.datacenter) LIKE 'hetzner-%') AND NOT EXISTS (SELECT 1 FROM server_secrets ss WHERE ss.server_id=p.server_id AND ss.secret_type='root_password')`);
            console.log('TARGET_165539333='+JSON.stringify(p||null));
            console.log('TARGET_165539333_HAS_PASSWORD='+(Number(s?.n||0)>0?'yes':'no'));
            console.log('PASSWORDLESS_MANUAL_REVIEW_COUNT='+Number(m?.n||0));
            await c.end();
          })().catch(e=>{console.error('VERIFY_DB_FAILED='+e.message);process.exit(1)});
          NODE
          pm2 logs hamoonbot --lines 180 --nostream 2>/dev/null | grep -Ei '165539333|password_recovery_failed|password_missing|HETZNER_PROVISIONING_RECONCILE' | tail -n 100 || true
          REMOTE
