name: Repair user 5825867194 billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-user-5825867194-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Refund duplicates and settle current renewals
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const { settleServerRenewalAtomic } = require('./billing-settlement');
          const userId = '5825867194';

          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });

            let candidates = [];
            try {
              await c.beginTransaction();
              const [[user]] = await c.execute(
                'SELECT wallet FROM users WHERE telegram_id=? LIMIT 1 FOR UPDATE',
                [userId]
              );
              if (!user) throw new Error('USER_NOT_FOUND');

              const [purchases] = await c.execute(
                `SELECT server_id,server_name,datacenter,status,duration,amount,auto_renew,
                        last_billed_at,created_at
                 FROM purchases
                 WHERE telegram_id=? AND status NOT IN ('deleted','cancelled')
                 ORDER BY created_at`,
                [userId]
              );

              const [logs] = await c.execute(
                `SELECT id,amount,description,type,timestamp
                 FROM wallet_logs
                 WHERE telegram_id=? AND amount<0 AND type='billing'
                 ORDER BY timestamp,id`,
                [userId]
              );

              const seenIds = new Set();
              for (const p of purchases) {
                const sid = String(p.server_id || '');
                const name = String(p.server_name || '');
                const matching = logs.filter(l => {
                  const d = String(l.description || '');
                  return (sid && d.includes(sid)) || (name && d.includes(name));
                });
                let cluster = [];
                const flush = () => {
                  if (cluster.length > 1) {
                    for (const duplicate of cluster.slice(1)) {
                      if (!seenIds.has(Number(duplicate.id))) {
                        seenIds.add(Number(duplicate.id));
                        candidates.push({
                          logId:Number(duplicate.id),
                          amount:Math.abs(Number(duplicate.amount || 0)),
                          serverId:sid,
                          serverName:name,
                          timestamp:duplicate.timestamp
                        });
                      }
                    }
                  }
                  cluster = [];
                };
                for (const l of matching) {
                  if (!cluster.length) {
                    cluster = [l];
                    continue;
                  }
                  const gap = new Date(l.timestamp) - new Date(cluster[cluster.length - 1].timestamp);
                  if (gap >= 0 && gap < 10 * 60 * 1000) cluster.push(l);
                  else {
                    flush();
                    cluster = [l];
                  }
                }
                flush();
              }

              const applied = [];
              for (const item of candidates) {
                const marker = 'duplicate_log_id=' + item.logId;
                const [[existing]] = await c.execute(
                  `SELECT id FROM wallet_logs
                   WHERE telegram_id=? AND type='billing_duplicate_refund'
                     AND description LIKE ? LIMIT 1`,
                  [userId, '%' + marker + '%']
                );
                if (existing) continue;
                await c.execute(
                  `UPDATE users SET wallet=wallet+?,updated_at=CURRENT_TIMESTAMP
                   WHERE telegram_id=?`,
                  [item.amount,userId]
                );
                await c.execute(
                  `INSERT INTO wallet_logs (telegram_id,amount,description,type)
                   VALUES (?,?,?,?)`,
                  [
                    userId,
                    item.amount,
                    'بازگشت کسر تکراری سرور ' + (item.serverName || item.serverId) + '؛ ' + marker,
                    'billing_duplicate_refund'
                  ]
                );
                applied.push(item);
              }

              await c.commit();
              console.log('DUPLICATE_CANDIDATE_COUNT=' + candidates.length);
              console.log('REFUND_APPLIED_COUNT=' + applied.length);
              console.log('REFUND_APPLIED_TOMAN=' + applied.reduce((s,x)=>s+x.amount,0));
            } catch (e) {
              await c.rollback().catch(() => {});
              throw e;
            } finally {
              await c.end();
            }

            const c2 = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              const [due] = await c2.execute(
                `SELECT server_id,server_name,datacenter,status,duration,amount,auto_renew,
                        last_billed_at,created_at,last_billed_traffic_gb
                 FROM purchases
                 WHERE telegram_id=? AND status='active' AND COALESCE(auto_renew,1)=1
                 ORDER BY created_at`,
                [userId]
              );
              for (const p of due) {
                const result = await settleServerRenewalAtomic({
                  telegramId:userId,
                  serverId:p.server_id,
                  datacenter:p.datacenter,
                  serverName:p.server_name,
                  renewalAmount:Number(p.amount || 0),
                  trafficCost:0,
                  billableTrafficGb:Number(p.last_billed_traffic_gb || 0),
                  now:new Date()
                });
                console.log('SETTLEMENT=' + JSON.stringify({
                  server_id:String(p.server_id),
                  server_name:p.server_name,
                  status:result.status,
                  charged:Number(result.charged || 0),
                  newWallet:result.newWallet == null ? null : Number(result.newWallet)
                }));
              }
              const [[after]] = await c2.execute(
                'SELECT wallet FROM users WHERE telegram_id=? LIMIT 1',
                [userId]
              );
              console.log('FINAL_WALLET=' + Number(after?.wallet || 0));
            } finally {
              await c2.end();
            }
          })().catch(e => {
            console.error('REPAIR_FAILED=' + String(e.code || e.message));
            console.error('REPAIR_MESSAGE=' + String(e.sqlMessage || e.message || ''));
            process.exit(1);
          });
          NODE
          REMOTE
