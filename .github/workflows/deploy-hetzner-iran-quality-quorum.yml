name: Deploy Hetzner Iran quality quorum

on:
  push:
    branches: [main]
    paths:
      - 'runtime-bootstrap.js'
      - 'admin-free-test-bootstrap.js'
      - 'services/hetzner-clean-ip-change.js'
      - 'services/hetzner-lifecycle-safe-bootstrap.js'
      - 'services/hetzner-reconcile-policy.js'
      - 'services/hetzner-location-fallback.js'
      - 'services/hetzner-location-fallback-fast-bootstrap.js'
      - 'scripts/requeue-fsn-exhausted.js'
      - 'scripts/recover-failed-change-ip.js'
      - 'scripts/report-hetzner-ip-recovery.js'
      - 'scripts/validate-admin-free-test.js'
      - 'scripts/validate-clean-ip-runtime.js'
      - 'scripts/validate-quality-readiness.js'
      - 'scripts/validate-manual-change-ip-cap.js'
      - 'scripts/validate-hetzner-lifecycle.js'
      - 'scripts/validate-hetzner-location-fallback.js'
      - '.github/workflows/deploy-hetzner-iran-quality-quorum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate quality/runtime changes
        shell: bash
        run: |
          set -euo pipefail
          node -c runtime-bootstrap.js
          node -c admin-free-test-bootstrap.js
          node -c services/hetzner-clean-ip-change.js
          node -c services/hetzner-lifecycle-safe-bootstrap.js
          node -c services/hetzner-reconcile-policy.js
          node -c services/hetzner-location-fallback.js
          node -c services/hetzner-location-fallback-fast-bootstrap.js
          node -c scripts/requeue-fsn-exhausted.js
          node -c scripts/recover-failed-change-ip.js
          node -c scripts/report-hetzner-ip-recovery.js
          node -c scripts/validate-quality-readiness.js
          node scripts/validate-admin-free-test.js
          node scripts/validate-manual-change-ip-cap.js
          node scripts/validate-hetzner-location-fallback.js
          node scripts/validate-quality-readiness.js
          npm run validate:clean-ip-runtime
          npm run validate:hetzner-lifecycle
          grep -q "HETZNER_IP_QUALITY_IR_MIN_SUCCESS: '3'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_CLEAN_ATTEMPTS: '4'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_INCONCLUSIVE_CANDIDATES: '2'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_QUALITY_SETTLE_MS: '6000'" runtime-bootstrap.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy, recover incidents and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git pull --ff-only
          node scripts/restore-server-secret-key.js .env >/dev/null
          node -c runtime-bootstrap.js
          node -c admin-free-test-bootstrap.js
          node -c services/hetzner-clean-ip-change.js
          node -c services/hetzner-lifecycle-safe-bootstrap.js
          node -c services/hetzner-reconcile-policy.js
          node -c services/hetzner-location-fallback.js
          node -c services/hetzner-location-fallback-fast-bootstrap.js
          node -c scripts/requeue-fsn-exhausted.js
          node -c scripts/recover-failed-change-ip.js
          node -c scripts/report-hetzner-ip-recovery.js
          node -c scripts/validate-quality-readiness.js
          node scripts/validate-admin-free-test.js
          node scripts/validate-manual-change-ip-cap.js
          node scripts/validate-hetzner-location-fallback.js
          node scripts/validate-quality-readiness.js
          grep -q "HETZNER_IP_QUALITY_IR_MIN_SUCCESS: '3'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_CLEAN_ATTEMPTS: '4'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_INCONCLUSIVE_CANDIDATES: '2'" runtime-bootstrap.js
          grep -q "HETZNER_CHANGE_IP_QUALITY_SETTLE_MS: '6000'" runtime-bootstrap.js
          npm run validate:clean-ip-runtime
          npm run validate:hetzner-lifecycle
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 4
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = 'online'

          # Recover every recent undelivered Hetzner purchase that reached the
          # IP-quality stage and still has a stored root password. The running bot
          # reconciler validates a clean IP and sends the normal delivery message.
          node scripts/requeue-fsn-exhausted.js

          # Recover unresolved customer-initiated Change-IP incidents. Success is
          # sent directly to the customer by the bot; failed candidates roll back.
          timeout 1200 node scripts/recover-failed-change-ip.js

          echo '=== RECOVERY STATE IMMEDIATE ==='
          node scripts/report-hetzner-ip-recovery.js

          # Give the production reconcile cron enough time to process requeued
          # purchases and send normal delivery credentials through Telegram.
          sleep 180
          echo '=== RECOVERY STATE AFTER 180S ==='
          node scripts/report-hetzner-ip-recovery.js

          echo 'PRODUCTION_QUORUM_FIX=verified'
          echo 'PRODUCTION_FSN_FALLBACK=verified'
          echo 'PRODUCTION_FAST_CLEAN_IP_SEARCH=verified'
          echo 'PRODUCTION_MANUAL_CHANGE_IP_CAP=verified'
          echo 'PRODUCTION_QUALITY_READINESS_RECHECK=verified'
          echo 'PRODUCTION_IP_INCIDENT_RECOVERY=executed'
          echo 'PRODUCTION_ADMIN_FREE_TEST_UNLIMITED=verified'
          REMOTE
