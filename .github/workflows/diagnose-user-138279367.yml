name: Diagnose user 138279367 Hetzner state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-user-138279367.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production DB and Hetzner
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== LIVE APP ==='
          printf 'commit='; git rev-parse HEAD
          printf 'bot_status='; pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s);const x=a.find(v=>v.name==='hamoonbot');console.log(x?.pm2_env?.status||'missing')}catch{console.log('unknown')}})" || true

          node <<'NODE'
          const net = require('net');
          require('dotenv').config();
          const db = require('./db');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          const userId = '138279367';

          function tcp22(ip, timeout=4000) {
            return new Promise(resolve => {
              if (!ip) return resolve(false);
              const socket = net.createConnection({host: ip, port: 22});
              let done = false;
              const finish = v => { if (done) return; done = true; socket.destroy(); resolve(v); };
              socket.setTimeout(timeout);
              socket.once('connect', () => finish(true));
              socket.once('timeout', () => finish(false));
              socket.once('error', () => finish(false));
            });
          }
          const safeDate = v => v instanceof Date ? v.toISOString() : v;
          const safeErr = e => ({status:e?.status||e?.response?.status||null, code:e?.code||e?.data?.error?.code||e?.response?.data?.error?.code||null, message:String(e?.message||e).slice(0,180)});

          (async () => {
            const [rows] = await db.pool.execute(
              `SELECT server_id, telegram_id, datacenter, server_name, flavor_id, image_id, status, public_ip,
                      duration, amount, auto_renew, suspend_reason,
                      provider_action_id, lifecycle_error_code, ip_quality_attempts, ip_quality_summary,
                      created_at, updated_at, lifecycle_updated_at, delivered_at, deleted_at
                 FROM purchases
                WHERE telegram_id = ?
                ORDER BY created_at ASC`, [userId]
            );
            console.log('DB_PURCHASE_COUNT=' + rows.length);
            for (const r of rows) {
              const o = {};
              for (const [k,v] of Object.entries(r)) o[k] = safeDate(v);
              console.log('DB_PURCHASE ' + JSON.stringify(o));
            }

            const cfg = dcs.hetzner || Object.values(dcs).find(x => String(x?.provider||x?.apiType||'').toLowerCase()==='hetzner');
            if (!cfg) throw new Error('HETZNER_CONFIG_NOT_FOUND');

            let labeled = [];
            try {
              const q = encodeURIComponent(`user=${userId}`);
              const data = await hetzner.hetznerRequest(cfg, 'GET', `/servers?label_selector=${q}&per_page=50`);
              labeled = data?.servers || [];
            } catch (e) {
              console.log('LABEL_QUERY_ERROR ' + JSON.stringify(safeErr(e)));
            }
            console.log('PROVIDER_LABELED_COUNT=' + labeled.length);
            for (const s of labeled) {
              const ip = s?.public_net?.ipv4?.ip || null;
              console.log('PROVIDER_LABELED ' + JSON.stringify({
                id:String(s.id), name:s.name, status:s.status, ip,
                location:s?.datacenter?.location?.name || null,
                datacenter:s?.datacenter?.name || null,
                server_type:s?.server_type?.name || null,
                user_label:s?.labels?.user || null,
                tcp22:await tcp22(ip)
              }));
            }

            for (const r of rows) {
              const dc = dcs[r.datacenter] || cfg;
              if (String(dc?.provider||dc?.apiType||'').toLowerCase() !== 'hetzner') continue;
              try {
                const data = await hetzner.hetznerRequest(dc, 'GET', `/servers/${encodeURIComponent(String(r.server_id))}`);
                const s = data?.server;
                const ip = s?.public_net?.ipv4?.ip || null;
                console.log('PROVIDER_BY_PURCHASE ' + JSON.stringify({
                  db_server_id:String(r.server_id), provider_found:true,
                  id:String(s?.id||''), name:s?.name||null, status:s?.status||null, ip,
                  location:s?.datacenter?.location?.name||null,
                  datacenter:s?.datacenter?.name||null,
                  server_type:s?.server_type?.name||null,
                  user_label:s?.labels?.user||null,
                  tcp22:await tcp22(ip)
                }));
              } catch (e) {
                console.log('PROVIDER_BY_PURCHASE ' + JSON.stringify({db_server_id:String(r.server_id),provider_found:false,...safeErr(e)}));
              }
            }

            const dupIps = Object.entries(rows.reduce((m,r)=>{const ip=String(r.public_ip||'').trim(); if(ip)(m[ip]??=[]).push(String(r.server_id)); return m;},{})).filter(([,ids])=>ids.length>1);
            const dupNames = Object.entries(rows.reduce((m,r)=>{const n=String(r.server_name||'').trim(); if(n)(m[n]??=[]).push(String(r.server_id)); return m;},{})).filter(([,ids])=>ids.length>1);
            console.log('DB_DUP_IPS ' + JSON.stringify(dupIps));
            console.log('DB_DUP_NAMES ' + JSON.stringify(dupNames));
          })().then(async()=>{ try{await db.pool.end();}catch{} }).catch(async e=>{ console.error('DIAG_FATAL ' + JSON.stringify(safeErr(e))); try{await db.pool.end();}catch{} process.exitCode=1; });
          NODE

          echo '=== RECENT USER LOGS ==='
          pm2 logs hamoonbot --lines 1600 --nostream 2>/dev/null | grep -F '138279367' | tail -n 160 || true
          REMOTE
