name: Recover Parham Change IP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-parham-change-ip.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Recover target server IP
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=40 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git pull --ff-only
          node - <<'NODE'
          'use strict';
          require('dotenv').config();

          const TARGET_IP = '91.107.245.81';
          const runtime = require('./runtime-bootstrap');
          const { installStrictCheckHostFetch } = require('./services/check-host-strict-fetch');

          runtime.applyRuntimeSafetyDefaults();
          installStrictCheckHostFetch();
          runtime.installSafeLifecycleModule();
          runtime.installCleanIpChangeModule();

          const db = require('./db');
          const datacenters = require('./datacenters');
          const { changeHetznerPublicIp, userMessageForError } = require('./services/hetzner-change-ip');

          async function sendTelegram(chatId, text) {
            const token = process.env.TELEGRAM_BOT_TOKEN || process.env.BOT_TOKEN || '';
            if (!token || !chatId) return false;
            try {
              const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ chat_id: String(chatId), text: String(text) })
              });
              return response.ok;
            } catch (_) {
              return false;
            }
          }

          (async () => {
            const [rows] = await db.pool.query(
              `SELECT telegram_id, server_id, datacenter, public_ip, status, delivered_at
                 FROM purchases
                WHERE public_ip = ?
                  AND LOWER(datacenter) LIKE 'hetzner%'
                  AND LOWER(status) IN ('active','running','suspended','stopped','shutoff')
                LIMIT 3`,
              [TARGET_IP]
            );

            console.log('TARGET_MATCH_COUNT=' + rows.length);
            if (rows.length !== 1) {
              throw Object.assign(new Error('TARGET_PURCHASE_MATCH_COUNT_' + rows.length), { code: 'TARGET_MATCH_AMBIGUOUS' });
            }

            const row = rows[0];
            const dc = datacenters[row.datacenter];
            if (!dc) throw Object.assign(new Error('TARGET_DATACENTER_NOT_FOUND'), { code: 'TARGET_DATACENTER_NOT_FOUND' });

            console.log('TARGET_SERVER=' + JSON.stringify({
              server_id: String(row.server_id),
              datacenter: String(row.datacenter),
              status: String(row.status),
              old_ip: String(row.public_ip)
            }));

            try {
              const result = await changeHetznerPublicIp({
                db,
                dc,
                telegramId: row.telegram_id,
                serverId: row.server_id,
                datacenter: row.datacenter
              });

              const notified = await sendTelegram(
                row.telegram_id,
                `✅ مشکل تغییر IP برطرف شد و IP سرور شما با موفقیت تغییر کرد.\nIP قبلی: ${result.oldIp}\nIP جدید: ${result.newIp}\n\n✅ IP جدید از نظر دسترسی TCP/SSH از نودهای ایران بررسی و تأیید شده است.`
              );

              console.log('TARGET_RECOVERY_SUCCESS=' + JSON.stringify({
                server_id: String(row.server_id),
                old_ip: result.oldIp,
                new_ip: result.newIp,
                attempts: result.attempts,
                notified
              }));
            } catch (error) {
              const notified = await sendTelegram(
                row.telegram_id,
                `⏳ درخواست تغییر IP شما دوباره بررسی شد، اما IP جدید قابل تأیید پیدا نشد. IP فعلی برای جلوگیری از قطعی حفظ شده است.\n\n${userMessageForError(error)}`
              );
              console.log('TARGET_RECOVERY_FAILED=' + JSON.stringify({
                server_id: String(row.server_id),
                code: error?.code || null,
                message: userMessageForError(error),
                notified
              }));
              throw error;
            } finally {
              await new Promise(resolve => process.stdout.write('', resolve));
            }

            process.exit(0);
          })().catch(error => {
            console.error('TARGET_RECOVERY_FATAL=' + JSON.stringify({
              code: error?.code || null,
              message: error?.message || String(error)
            }));
            process.exit(1);
          });
          NODE
          REMOTE
