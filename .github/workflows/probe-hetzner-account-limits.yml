name: Probe Hetzner Account Limits API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-hetzner-account-limits.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Probe read-only endpoints
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const axios = require('axios');
          const datacenters = require('./datacenters');
          (async () => {
            const dc = datacenters.hetzner || Object.values(datacenters).find(x => String(x?.provider || x?.apiType || '').toLowerCase().includes('hetzner'));
            const token = dc.HETZNER_API_TOKEN || dc.HETZNER_TOKEN || dc.token || process.env.HETZNER_API_TOKEN || process.env.HETZNER_TOKEN || process.env.HCLOUD_TOKEN;
            const http = axios.create({
              baseURL:'https://api.hetzner.cloud/v1',
              headers:{Authorization:'Bearer '+token},
              timeout:15000,
              validateStatus:()=>true
            });
            for (const path of ['/account','/limits','/projects','/servers?per_page=1','/primary_ips?per_page=1','/floating_ips?per_page=1','/volumes?per_page=1','/networks?per_page=1','/firewalls?per_page=1','/load_balancers?per_page=1','/placement_groups?per_page=1','/ssh_keys?per_page=1']) {
              const r = await http.get(path);
              const body = JSON.stringify(r.data);
              console.log('PROBE', path, 'HTTP', r.status, 'RATE', {
                limit:r.headers['ratelimit-limit']||null,
                remaining:r.headers['ratelimit-remaining']||null,
                reset:r.headers['ratelimit-reset']||null
              }, 'BODY', body.slice(0,2500));
            }
          })().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
          REMOTE