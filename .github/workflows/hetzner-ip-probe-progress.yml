name: Hetzner IP Probe Progress
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Read probe progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          P="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          OUT="$(ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "P='$P' J='' bash -s" <<'REMOTE'
          cd "$(printf '%s' "$P" | base64 -d)"
          node -e "$(printf '%s' "$J" | base64 -d)"
          REMOTE
          )"
          echo "$OUT"
          { echo '## Probe progress'; echo; echo '```json'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
