name: Refund reported Hetzner traffic charges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refund-reported-traffic-charges-20260925.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refund:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Refund customer traffic charges
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');

          const serverNames = ['Srv-HET-c694b4','Srv-FIN-0938d2','Srv-HET-8493f1','Srv-HET-469ee3'];
          const marker = 'goodwill_refund_traffic_delay_20260925';

          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              await c.beginTransaction();

              const placeholders = serverNames.map(() => '?').join(',');
              const [purchases] = await c.execute(
                `SELECT telegram_id, server_name
                 FROM purchases
                 WHERE server_name IN (${placeholders})`,
                serverNames
              );
              if (!purchases.length) throw new Error('NO_TARGET_PURCHASES_FOUND');

              const ownerIds = [...new Set(purchases.map(p => String(p.telegram_id)))];
              if (ownerIds.length !== 1) {
                throw new Error('TARGET_SERVERS_HAVE_MULTIPLE_OWNERS:' + ownerIds.join(','));
              }
              const telegramId = ownerIds[0];

              const [already] = await c.execute(
                `SELECT id, amount, description, timestamp
                 FROM wallet_logs
                 WHERE telegram_id=? AND type='hetzner_traffic_refund' AND description LIKE ?
                 ORDER BY id DESC LIMIT 1`,
                [telegramId, '%' + marker + '%']
              );
              if (already.length) {
                const [[u]] = await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1', [telegramId]);
                console.log('REFUND_ALREADY_APPLIED=' + JSON.stringify({
                  telegramId,
                  amount:Number(already[0].amount || 0),
                  wallet:Number(u?.wallet || 0),
                  logId:already[0].id,
                  timestamp:already[0].timestamp
                }));
                await c.commit();
                return;
              }

              let total = 0;
              const breakdown = [];
              for (const serverName of serverNames) {
                const [rows] = await c.execute(
                  `SELECT amount, description, timestamp
                   FROM wallet_logs
                   WHERE telegram_id=? AND type='hetzner_traffic_overage'
                     AND description LIKE ?
                   ORDER BY id ASC`,
                  [telegramId, '%' + serverName + '%']
                );
                const charged = rows.reduce((sum, row) => sum + Math.abs(Math.min(0, Number(row.amount || 0))), 0);
                total += charged;
                breakdown.push({serverName, charged, entries:rows.length});
              }

              if (total !== 380950) {
                throw new Error('UNEXPECTED_REFUND_TOTAL:' + total);
              }

              const [userRows] = await c.execute(
                'SELECT wallet FROM users WHERE telegram_id=? LIMIT 1 FOR UPDATE',
                [telegramId]
              );
              if (!userRows.length) throw new Error('USER_NOT_FOUND');
              const before = Number(userRows[0].wallet || 0);

              await c.execute(
                'UPDATE users SET wallet = wallet + ?, updated_at = CURRENT_TIMESTAMP WHERE telegram_id=?',
                [total, telegramId]
              );
              const description =
                'بازگشت کامل هزینه ترافیک مازاد Hetzner بابت اصلاح تأخیر هشدار؛ ' +
                serverNames.join(', ') + '; ' + marker;
              const [logResult] = await c.execute(
                'INSERT INTO wallet_logs (telegram_id, amount, description, type) VALUES (?, ?, ?, ?)',
                [telegramId, total, description, 'hetzner_traffic_refund']
              );

              await c.commit();

              const [[u2]] = await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1', [telegramId]);
              console.log('REFUND_APPLIED=' + JSON.stringify({
                telegramId,
                amount:total,
                walletBefore:before,
                walletAfter:Number(u2?.wallet || 0),
                logId:logResult.insertId,
                breakdown
              }));
            } catch (e) {
              try { await c.rollback(); } catch (_) {}
              throw e;
            } finally {
              await c.end();
            }
          })().catch(e => {
            console.error('REFUND_FAILED=' + String(e.stack || e.message));
            process.exit(1);
          });
          NODE
          REMOTE
