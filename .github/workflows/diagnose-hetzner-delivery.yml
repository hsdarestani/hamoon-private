name: Diagnose Hetzner Delivery Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hetzner-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Current repository checks
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT PURCHASE FLOW ==='
          sed -n '2360,2455p' index-core.js
          echo '=== CURRENT LIFECYCLE ==='
          sed -n '1,90p' services/hetzner-lifecycle.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect historical production implementation
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          OLD_DIR="$(find /root -maxdepth 1 -type d -name 'hamoon-image-ip-stage-20260719_150056' | head -n1)"
          echo "OLD_DIR_FOUND=$([ -n "$OLD_DIR" ] && echo yes || echo no)"
          if [ -z "$OLD_DIR" ]; then exit 0; fi

          echo '=== OLD INDEX PURCHASE/DELIVERY FLOW ==='
          sed -n '3090,3265p' "$OLD_DIR/index.js"
          echo '=== OLD LIFECYCLE READINESS ==='
          sed -n '245,335p' "$OLD_DIR/services/hetzner-lifecycle.js"
          echo '=== OLD LIFECYCLE PROVISIONING/DELIVERY ==='
          sed -n '535,735p' "$OLD_DIR/services/hetzner-lifecycle.js"
          echo '=== OLD LIFECYCLE IP/REACHABILITY TERMS ==='
          grep -nEi "check.?host|ping|iran|probe|reachable|reachability|clean|block|blacklist|ssh|password|markDelivered|delivered_at|waitForReadiness" "$OLD_DIR/services/hetzner-lifecycle.js" | head -n 260 || true
          echo '=== OLD INDEX IP/REACHABILITY TERMS ==='
          grep -nEi "check.?host|ping|iran|probe|reachable|reachability|clean|block|blacklist|ssh|password|markDelivered|delivered_at|waitForReadiness" "$OLD_DIR/index.js" | tail -n 260 || true

          echo '=== LIVE RECENT PURCHASE LOGS ==='
          cd "$APP_PATH"
          pm2 logs hamoonbot --lines 450 --nostream 2>/dev/null | grep -Ei "HETZNER_CREATE|reset_password|pending_ssh|provision|deliver|readiness|ssh" | tail -n 180 || true
          REMOTE
