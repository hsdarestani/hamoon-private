name: Diagnose Hetzner Delivery Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hetzner-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect old reconcile and secret state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          OLD_DIR="$(find /root -maxdepth 1 -type d -name 'hamoon-image-ip-stage-20260719_150056' | head -n1)"
          echo "OLD_DIR_FOUND=$([ -n "$OLD_DIR" ] && echo yes || echo no)"
          if [ -n "$OLD_DIR" ]; then
            echo '=== OLD RECONCILE LIFECYCLE ==='
            sed -n '535,635p' "$OLD_DIR/services/hetzner-lifecycle.js"
            echo '=== OLD RECONCILE SCHEDULER ==='
            sed -n '4455,4535p' "$OLD_DIR/index.js"
          fi
          cd "$APP_PATH"
          echo '=== SERVER SECRET KEY STATE ==='
          if grep -q '^SERVER_SECRET_KEY=.' .env 2>/dev/null; then echo 'CURRENT_SECRET_KEY_PRESENT=yes'; else echo 'CURRENT_SECRET_KEY_PRESENT=no'; fi
          found_old=no
          while IFS= read -r -d '' f; do
            if grep -q '^SERVER_SECRET_KEY=.' "$f"; then found_old=yes; break; fi
          done < <(find /root -maxdepth 4 -type f \( -name '.env' -o -name '.env.*' \) -print0 2>/dev/null)
          echo "BACKUP_SECRET_KEY_PRESENT=$found_old"
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async()=>{
            const c=await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
            const [[s]]=await c.query('SELECT COUNT(*) n FROM server_secrets').catch(()=>[[{n:-1}]]);
            const [[p]]=await c.query("SELECT COUNT(*) n FROM purchases WHERE datacenter LIKE 'hetzner%' AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality')").catch(()=>[[{n:-1}]]);
            console.log('SERVER_SECRETS_ROWS='+s.n);
            console.log('HETZNER_PENDING_ROWS='+p.n);
            await c.end();
          })().catch(e=>{console.error('DB_DIAG_FAILED='+e.message);process.exitCode=1});
          NODE
          echo '=== CHECK-HOST IR NODES SAMPLE ==='
          curl -fsSL -H 'Accept: application/json' https://check-host.net/nodes/hosts | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=Object.entries(j.nodes||{}).filter(([,v])=>String(v.location?.[0]||'').toLowerCase()==='ir');console.log('IR_NODE_COUNT='+a.length);console.log(a.slice(0,8).map(([k,v])=>k+' '+(v.location||[]).join('/')).join('\n'))})"
          REMOTE
