name: Diagnose Hetzner Delivery Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hetzner-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Current repository checks
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT PURCHASE FLOW ==='
          sed -n '2360,2455p' index-core.js
          echo '=== CURRENT LIFECYCLE ==='
          sed -n '1,90p' services/hetzner-lifecycle.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect historical production implementation
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          OLD_DIR="$(find /root -maxdepth 1 -type d -name 'hamoon-image-ip-stage-20260719_150056' | head -n1)"
          echo "OLD_DIR_FOUND=$([ -n "$OLD_DIR" ] && echo yes || echo no)"
          if [ -n "$OLD_DIR" ]; then
            echo '=== OLD HETZNER CREATE RESPONSE HANDLING ==='
            grep -n -A55 -B15 "async function createServer" "$OLD_DIR/Hetzner/hetzner-api.js" | head -n 180 || true
            echo '=== OLD PURCHASE DELIVERY CORE MARKERS ==='
            sed -n '3035,3225p' "$OLD_DIR/index.js"
            echo '=== OLD LIFECYCLE READINESS ==='
            sed -n '265,325p' "$OLD_DIR/services/hetzner-lifecycle.js"
          fi

          echo '=== GLOBAL IP QUALITY / MULTI-REGION PROBE SEARCH ==='
          find /root -maxdepth 5 -type f -size -3M \
            ! -path '*/node_modules/*' ! -path '*/.git/objects/*' -print0 2>/dev/null \
            | xargs -0 -r grep -nEHi "check[-_. ]?host|checkhost|ping\.pe|ping[-_. ]?admin|icmp|iran|tehran|mci|mtn|irancell|mokhaberat|clean[-_. ]?ip|ip[-_. ]?(quality|health|clean|check)|blacklist|blocklist|multi[-_. ]?(region|location)|probe[-_. ]?(node|region|location)|reachab(le|ility).*iran" 2>/dev/null \
            | grep -vE '/node_modules/|package-lock\.json' \
            | head -n 500 || true

          echo '=== CRON/SYSTEMD POSSIBLE EXTERNAL PROBERS ==='
          (crontab -l 2>/dev/null || true)
          grep -RniE "check[-_. ]?host|ping\.pe|iran|clean[-_. ]?ip|blacklist|probe" /etc/cron* /etc/systemd/system 2>/dev/null | head -n 160 || true

          echo '=== LIVE RECENT PURCHASE LOGS ==='
          cd "$APP_PATH"
          pm2 logs hamoonbot --lines 500 --nostream 2>/dev/null | grep -Ei "HETZNER_CREATE|reset_password|pending_ssh|provision|deliver|readiness|ssh|ping|probe|iran|clean" | tail -n 220 || true
          REMOTE
