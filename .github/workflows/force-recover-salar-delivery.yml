name: Force Recover Salar Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-recover-salar-delivery.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Recover undelivered server
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node - <<'NODE'
          require('dotenv').config();
          const net=require('net');
          const TelegramBot=require('node-telegram-bot-api');
          const db=require('./db');
          const dcs=require('./datacenters');
          const cloud=require('./cloud-api');
          const api=require('./Hetzner/hetzner-api');
          const lifecycle=require('./services/hetzner-lifecycle');
          const change=require('./services/hetzner-change-ip');

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const tcp22=(ip,timeout=4000)=>new Promise(resolve=>{
            const s=new net.Socket(); let done=false;
            const finish=v=>{if(done)return;done=true;s.destroy();resolve(v)};
            s.setTimeout(timeout); s.once('connect',()=>finish(true)); s.once('timeout',()=>finish(false)); s.once('error',()=>finish(false)); s.connect(22,ip);
          });
          async function waitTcp(ip,totalMs=60000){
            const start=Date.now();
            while(Date.now()-start<totalMs){ if(await tcp22(ip)) return true; await sleep(3000); }
            return false;
          }
          async function waitAction(dc,a){const id=a?.id||a?.action?.id;if(id) return cloud.waitHetznerAction(dc,id,180000)}
          async function rawServer(dc,id){return (await api.hetznerRequest(dc,'GET','/servers/'+id)).server}
          async function safePowerOn(dc,id){try{const s=await rawServer(dc,id);if(String(s.status)!=='running')await waitAction(dc,await cloud.powerOnHetznerServer(dc,id));}catch(e){console.log('POWERON_FAIL='+JSON.stringify({m:e.message,data:e.data||null}))}}
          async function unassignWithRetry(dc,serverId,primaryId){
            let last=null;
            for(let i=1;i<=4;i++){
              try{
                const action=await cloud.unassignPrimaryIp(dc,null,primaryId);
                await waitAction(dc,action);
                console.log('UNASSIGN_OK attempt='+i+' primary='+primaryId);
                return true;
              }catch(e){
                last=e;
                const s=await rawServer(dc,serverId).catch(()=>null);
                const attached=String(s?.public_net?.ipv4?.id||'');
                console.log('UNASSIGN_FAIL='+JSON.stringify({attempt:i,status:e.status||e.response?.status||null,data:e.data||e.response?.data||null,attached}));
                if(attached!==String(primaryId)) return true;
                await sleep(3500);
              }
            }
            throw last||new Error('UNASSIGN_FAILED');
          }

          (async()=>{
            const [rows]=await db.pool.execute("SELECT * FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1");
            const p=rows[0]; if(!p) throw new Error('PURCHASE_NOT_FOUND');
            const dc=dcs[p.datacenter]||dcs[String(p.datacenter).split('__')[0]];
            let finalIp=null, finalQuality=null, finalPassword=await db.getServerSecret(p.server_id,'root_password').catch(()=>null);

            for(let round=1;round<=4;round++){
              let s=await rawServer(dc,p.server_id);
              const oldId=s?.public_net?.ipv4?.id;
              const oldIp=s?.public_net?.ipv4?.ip;
              const location=String(s?.location?.name||dc.HETZNER_LOCATION||'nbg1').toLowerCase();
              console.log('ROUND_START='+JSON.stringify({round,status:s.status,oldId,oldIp,location}));
              if(!oldId||!oldIp) throw new Error('CURRENT_PRIMARY_IP_MISSING');

              const candidate=await change.reserveUniquePrimaryIpv4(db,{
                dc,telegramId:p.telegram_id,datacenter:p.datacenter,serverId:p.server_id,location,oldIp
              });
              console.log('CANDIDATE='+JSON.stringify({round,id:candidate.id,ip:candidate.ip,range:change.ipv4Range24(candidate.ip)}));

              try{
                if(String(s.status)==='running') await waitAction(dc,await cloud.powerOffHetznerServer(dc,p.server_id));
                await unassignWithRetry(dc,p.server_id,oldId);
                await waitAction(dc,await cloud.assignPrimaryIp(dc,null,candidate.id,p.server_id));
                await cloud.deletePrimaryIp(dc,null,oldId).catch(e=>console.log('OLD_IP_DELETE_WARN='+e.message));
                await waitAction(dc,await cloud.powerOnHetznerServer(dc,p.server_id));
                await db.updatePublicIp(p.telegram_id,p.server_id,p.datacenter,candidate.ip);
                await db.updateScopedStatus(p.telegram_id,p.server_id,p.datacenter,'pending_ssh');
                await sleep(7000);

                const quality=await lifecycle.checkIpQuality(candidate.ip,{polls:10,pollDelayMs:1000});
                console.log('QUALITY='+JSON.stringify({round,ip:candidate.ip,summary:lifecycle.qualitySummary(quality),detail:quality}));
                if(!quality.ok){
                  await change.rememberBadRange(db,{location,ip:candidate.ip,reason:quality.reason||'failed_threshold'}).catch(()=>{});
                  continue;
                }

                let ssh=await waitTcp(candidate.ip,60000);
                console.log('SSH_AFTER_IP='+JSON.stringify({round,ip:candidate.ip,ssh}));
                if(!ssh){
                  console.log('SSH_STILL_DOWN=rebuild_same_image');
                  await db.updateScopedStatus(p.telegram_id,p.server_id,p.datacenter,'rebuilding');
                  const rebuilt=await cloud.rebuildServer(dc,null,p.server_id,p.os_label||'ubuntu-24.04');
                  if(rebuilt?.root_password){
                    finalPassword=rebuilt.root_password;
                    await db.upsertServerSecret({
                      telegramId:p.telegram_id,serverId:p.server_id,datacenter:p.datacenter,
                      secretType:'root_password',secretValue:rebuilt.root_password
                    });
                  }
                  const aid=rebuilt?.action?.id||rebuilt?.id;
                  if(aid) await cloud.waitHetznerAction(dc,aid,240000);
                  ssh=await waitTcp(candidate.ip,90000);
                  console.log('SSH_AFTER_REBUILD='+JSON.stringify({ip:candidate.ip,ssh}));
                }

                if(!ssh) continue;
                finalIp=candidate.ip;
                finalQuality=quality;
                break;
              }catch(e){
                console.log('ROUND_ERROR='+JSON.stringify({round,message:e.message,status:e.status||null,data:e.data||null}));
                await safePowerOn(dc,p.server_id);
                if(round===4) throw e;
              }
            }

            if(!finalIp) throw new Error('NO_READY_IP_AFTER_RECOVERY');
            await db.updateIpQualityResult?.(p.telegram_id,p.server_id,p.datacenter,lifecycle.qualitySummary(finalQuality),false).catch(()=>{});
            await db.markDelivered(p.telegram_id,p.server_id,p.datacenter,finalIp);
            const [after]=await db.pool.execute("SELECT status,public_ip,delivered_at FROM purchases WHERE server_id=?",[String(p.server_id)]);
            console.log('FINAL='+JSON.stringify(after[0]||null));

            if(!finalPassword) finalPassword=await db.getServerSecret(p.server_id,'root_password').catch(()=>null);
            const token=process.env.TELEGRAM_BOT_TOKEN;
            if(token){
              const bot=new TelegramBot(token,{polling:false});
              let msg='✅ سرور شما آماده و تحویل شد.\n\n🖥 '+p.server_name+'\n🌐 IP: '+finalIp+'\n👤 User: root';
              if(finalPassword) msg+='\n🔑 Password: '+finalPassword;
              msg+='\n\n✅ دسترسی SSH و دسترسی IP از ایران و نقاط خارجی بررسی شد.';
              const sent=await bot.sendMessage(String(p.telegram_id),msg);
              console.log('CUSTOMER_NOTIFY_SENT='+String(sent?.message_id||'yes'));
            }
            await db.pool.end();
          })().catch(async e=>{
            console.error('FORCE_RECOVERY_FAILED='+String(e?.message||e));
            console.error('FORCE_RECOVERY_DATA='+JSON.stringify(e?.data||e?.response?.data||null));
            try{await db.pool.end()}catch{}
            process.exit(1);
          });
          NODE
          REMOTE
