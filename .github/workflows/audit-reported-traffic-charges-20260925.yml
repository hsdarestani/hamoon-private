name: Audit reported Hetzner traffic charges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-reported-traffic-charges-20260925.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Audit reported traffic charges
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const names = ['Srv-HET-c694b4','Srv-FIN-0938d2','Srv-HET-8493f1','Srv-HET-469ee3'];
          const TB = 1_000_000_000_000;
          const toTb = v => Number((Number(v || 0) / TB).toFixed(4));
          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              for (const serverName of names) {
                const [purchases] = await c.execute(
                  `SELECT telegram_id, server_id, server_name, datacenter, status, created_at
                   FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 3`,
                  [serverName]
                );
                if (!purchases.length) {
                  console.log('AUDIT=' + JSON.stringify({serverName, found:false}));
                  continue;
                }
                for (const p of purchases) {
                  const [trafficRows] = await c.execute(
                    `SELECT period_start,billed_overage_bytes,billed_amount_toman,last_outgoing_bytes,included_traffic_bytes,price_per_tb,created_at,updated_at
                     FROM hetzner_traffic_billing WHERE server_id=? ORDER BY period_start DESC LIMIT 3`,
                    [String(p.server_id)]
                  );
                  const [logs] = await c.execute(
                    `SELECT amount,description,type,timestamp
                     FROM wallet_logs
                     WHERE telegram_id=? AND type='hetzner_traffic_overage' AND description LIKE ?
                     ORDER BY timestamp DESC LIMIT 20`,
                    [String(p.telegram_id), '%' + serverName + '%']
                  );
                  const [alerts] = await c.execute(
                    `SELECT period_start,allowance_bytes,outgoing_bytes,notified_at
                     FROM hetzner_traffic_alerts WHERE server_id=? ORDER BY notified_at DESC LIMIT 10`,
                    [String(p.server_id)]
                  ).catch(() => [[]]);
                  const [events] = await c.execute(
                    `SELECT amount_toman,period_start,period_end,metadata,created_at
                     FROM billing_events WHERE server_id=? AND event_type='hetzner_traffic_overage'
                     ORDER BY created_at DESC LIMIT 20`,
                    [String(p.server_id)]
                  );
                  const summary = {
                    serverName,
                    found:true,
                    serverId:String(p.server_id),
                    datacenter:p.datacenter,
                    status:p.status,
                    traffic:trafficRows.map(x=>({
                      period_start:x.period_start,
                      billed_overage_tb:toTb(x.billed_overage_bytes),
                      billed_amount_toman:Number(x.billed_amount_toman || 0),
                      outgoing_tb:toTb(x.last_outgoing_bytes),
                      included_tb:toTb(x.included_traffic_bytes),
                      price_per_tb:Number(x.price_per_tb || 0),
                      updated_at:x.updated_at
                    })),
                    wallet_logs:logs.map(x=>({
                      amount:Number(x.amount || 0),
                      description:x.description,
                      timestamp:x.timestamp
                    })),
                    alerts:alerts.map(x=>({
                      period_start:x.period_start,
                      allowance_tb:toTb(x.allowance_bytes),
                      outgoing_tb:toTb(x.outgoing_bytes),
                      notified_at:x.notified_at
                    })),
                    events:events.map(x=>({
                      amount_toman:Number(x.amount_toman || 0),
                      period_start:x.period_start,
                      created_at:x.created_at,
                      metadata:x.metadata
                    }))
                  };
                  console.log('AUDIT=' + JSON.stringify(summary));
                }
              }
            } finally {
              await c.end();
            }
          })().catch(e => { console.error('AUDIT_FAILED=' + String(e.stack || e.message)); process.exit(1); });
          NODE
          REMOTE
