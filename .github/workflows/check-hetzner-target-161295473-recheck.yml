name: Recheck Hetzner Target 161295473

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hetzner-target-161295473-recheck.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - shell: bash
        run: |
          set +e
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE' > "$RUNNER_TEMP/recheck.log" 2>&1
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH" || exit 0
          node - <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          (async()=>{
            const c=await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
            const [r]=await c.query(`SELECT server_id,datacenter,status,IF(delivered_at IS NULL,'no','yes') delivered,ip_quality_attempts,COALESCE(ip_quality_summary,'') ip_quality_summary,EXISTS(SELECT 1 FROM server_secrets s WHERE s.server_id=purchases.server_id AND s.secret_type='root_password') has_password_secret FROM purchases WHERE server_id=? LIMIT 1`,['161295473']);
            console.log('TARGET_RECHECK='+(r[0]?JSON.stringify(r[0]):'not_found'));
            await c.end();
          })().catch(e=>console.log('TARGET_RECHECK=failed:'+String(e.message||e).replace(/\s+/g,'_').slice(0,100)));
          NODE
          REMOTE
          exit 0
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ops/target-161295473-recheck.txt
          grep '^TARGET_RECHECK=' "$RUNNER_TEMP/recheck.log" >> ops/target-161295473-recheck.txt || true
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add ops/target-161295473-recheck.txt
          git commit -m 'ops(hetzner): record target recheck'
          git push origin HEAD:main
