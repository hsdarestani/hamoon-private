name: Read-only missing server audit
on:
  push:
    branches: ['diagnostics/read-only-missing-server-20261010']
    paths: ['.github/workflows/diagnose-missing-server-20261010.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect matching records without modifications
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const dcs=require('./datacenters');
          const cloud=require('./cloud-api');
          const targetName='Srv-NBG-0df200';
          const targetIp='91.107.243.122';
          const safeDate=x=>x?new Date(x).toISOString().slice(0,10):null;
          const errCode=e=>String(e?.response?.status||e?.status||e?.statusCode||e?.code||'unknown').slice(0,40);
          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let rows=[];
            try{
              await conn.query('START TRANSACTION READ ONLY');
              const [main]=await conn.execute('SELECT server_id,telegram_id,datacenter,server_name,public_ip,duration,status,auto_renew,created_at,last_billed_at,delivered_at,deleted_at,updated_at,lifecycle_error_code,renewal_stopped_at,suspend_reason FROM purchases WHERE server_name = ? OR public_ip = ? OR server_name LIKE ? ORDER BY created_at DESC LIMIT 30',[targetName,targetIp,'%0df200%']);
              rows=main;
              const [t]=await conn.execute("SELECT COUNT(*) AS c FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='server_display_names'");
              if(Number(t[0]?.c||0)){
                const [alias]=await conn.execute('SELECT p.server_id,p.telegram_id,p.datacenter,p.server_name,p.public_ip,p.duration,p.status,p.auto_renew,p.created_at,p.last_billed_at,p.delivered_at,p.deleted_at,p.updated_at,p.lifecycle_error_code,p.renewal_stopped_at,p.suspend_reason FROM server_display_names n INNER JOIN purchases p ON n.telegram_id=p.telegram_id AND n.datacenter=p.datacenter AND n.server_id=p.server_id WHERE n.display_name=? LIMIT 10',[targetName]);
                const seen=new Set(rows.map(r=>String(r.datacenter)+':'+String(r.server_id)));
                for(const r of alias){const k=String(r.datacenter)+':'+String(r.server_id);if(!seen.has(k)){rows.push(r);seen.add(k)}}
              }
              console.log('AUDIT_MATCH_COUNT='+rows.length);
              for(const r of rows){
                const item={
                  server_name_match:String(r.server_name||'')===targetName,
                  ip_match:String(r.public_ip||'')===targetIp,
                  datacenter:String(r.datacenter||''),status:String(r.status||''),
                  duration:r.duration,auto_renew:Number(r.auto_renew??0),
                  created_date:safeDate(r.created_at),last_billed_date:safeDate(r.last_billed_at),
                  delivered:Boolean(r.delivered_at),deleted:Boolean(r.deleted_at),
                  deleted_date:safeDate(r.deleted_at),updated_date:safeDate(r.updated_at),
                  lifecycle_error_code:r.lifecycle_error_code||null,
                  renewal_stopped:Boolean(r.renewal_stopped_at),
                  suspend_reason:r.suspend_reason||null
                };
                console.log('PURCHASE_SUMMARY='+JSON.stringify(item));
              const iso=x=>x?new Date(x).toISOString():null;
              console.log('LIFECYCLE_TIMES='+JSON.stringify({created:iso(r.created_at),delivered:iso(r.delivered_at),last_billed:iso(r.last_billed_at),renewal_stopped:iso(r.renewal_stopped_at),deleted:iso(r.deleted_at),updated:iso(r.updated_at)}));
              const [walletSummary]=await conn.execute("SELECT type,COUNT(*) AS n,MIN(timestamp) AS first_log,MAX(timestamp) AS last_log,SUM(CASE WHEN amount<0 THEN 1 ELSE 0 END) AS debits,SUM(CASE WHEN amount>0 THEN 1 ELSE 0 END) AS credits FROM wallet_logs WHERE telegram_id=? AND (description LIKE ? OR description LIKE ?) GROUP BY type ORDER BY type",[String(r.telegram_id),'%'+String(r.server_id)+'%','%'+targetName+'%']);
              console.log('WALLET_SUMMARY='+JSON.stringify(walletSummary.map(x=>({type:x.type,count:Number(x.n),debits:Number(x.debits),credits:Number(x.credits),first:safeDate(x.first_log),last:safeDate(x.last_log)}))));
              try {
                const [ev]=await conn.execute('SELECT event_type,COUNT(*) AS n FROM billing_events WHERE server_id=? AND telegram_id=? GROUP BY event_type',[String(r.server_id),String(r.telegram_id)]);
                console.log('BILLING_EVENTS='+JSON.stringify(ev.map(x=>({type:x.event_type,count:Number(x.n)}))));
              }catch(e){console.log('BILLING_EVENTS_QUERY_ERROR='+errCode(e))}

                const [logs]=await conn.execute('SELECT type,timestamp FROM wallet_logs WHERE telegram_id=? AND (description LIKE ? OR description LIKE ?) ORDER BY timestamp DESC LIMIT 5',[String(r.telegram_id),'%'+String(r.server_id)+'%','%'+targetName+'%']);
                console.log('MATCHED_WALLET_LOGS='+JSON.stringify({count:logs.length,events:logs.map(x=>({type:String(x.type||''),date:safeDate(x.timestamp)}))}));
              }
              await conn.query('ROLLBACK');
            }finally{await conn.end()}
            for(const r of rows){
              const dc=dcs[String(r.datacenter)]||dcs[String(r.datacenter||'').split('__')[0]];
              if(!dc){console.log('PROVIDER_BY_DB=DATACENTER_CONFIG_MISSING');continue}
              try {
                const s=await cloud.getServer(dc,null,String(r.server_id));
                const ip=s?.public_net?.ipv4?.ip||s?.public_ip||null;
                console.log('PROVIDER_BY_DB='+JSON.stringify({found:true,status:s?.status||s?.state||null,name_match:String(s?.name||'')===targetName,ip_match:ip===targetIp}));
              }catch(e){console.log('PROVIDER_BY_DB='+JSON.stringify({found:false,error:errCode(e)}))}
            }
            if(rows.length===0){
              const hetzners=Object.entries(dcs).filter(([k,c])=>String(c?.provider||c?.apiType||'').toLowerCase()==='hetzner');
              console.log('HETZNER_CONFIGS='+hetzners.length);
              for(const [key,dc] of hetzners){
                try{
                  const list=await cloud.listServers(dc,null);
                  const matching=(list||[]).filter(s=>s.name===targetName||(s?.public_net?.ipv4?.ip||s?.public_ip||null)===targetIp);
                  console.log('PROVIDER_SEARCH='+JSON.stringify({datacenter:key,matched:matching.length,items:matching.map(s=>({name_match:s.name===targetName,ip_match:(s?.public_net?.ipv4?.ip||s?.public_ip||null)===targetIp,status:s.status||s.state||null}))}));
                }catch(e){console.log('PROVIDER_SEARCH='+JSON.stringify({datacenter:key,error:errCode(e)}))}
              }
            }
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e?.code||e?.message||e).slice(0,120));process.exitCode=1});
          NODE
          node <<'PRIVATE_AUDIT'
          require('dotenv').config();
          const fs=require('fs');
          const crypto=require('crypto');
          const mysql=require('mysql2/promise');
          const pem="-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7D5jbdqP65wHwiZtEl1d\n11COC0kCMIub19t/xoIlGcVc36CJRSrmVmMx6/PM8TaFRAROwNkjksbt0bAmZRwP\nlSk4WFDYIm+5Tc/5hIPn5qd/v9Y4ygVaCdc3ZPuYMECuJtRFlHzsFNCbU8+V4lcz\ntzH6Od1839T09386t3VCo0p7ZHKRFmZghXbMrKdzWceP0e8ZLn9NLz7ABr9LpZfx\n3MObjH8VeLzYMB/atcXedthloQv4uqrWKX6Tbkv0hY1F+6vgusOOpH02KbbkKP1M\n8la/ATEJ6afwO4vlk1mhVWOfSKS1yzNsLztho/aQahCmEKhDlYY1mCXl+ma6rvh3\nTQIDAQAB\n-----END PUBLIC KEY-----\n";
          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let report;
            try{
              await conn.query('START TRANSACTION READ ONLY');
              const [rows]=await conn.execute('SELECT server_id,telegram_id,server_name,public_ip,duration,status,amount,pricing_mode,monthly_basis_price,auto_renew_disabled_at,renewal_stopped_at,deleted_at,delivered_at,created_at,last_billed_at FROM purchases WHERE server_name=? OR public_ip=? ORDER BY created_at DESC LIMIT 3',['Srv-NBG-0df200','91.107.243.122']);
              report={purchases:[]};
              for(const p of rows){
                const [wallet]=await conn.execute('SELECT type,amount,timestamp,description FROM wallet_logs WHERE telegram_id=? AND (description LIKE ? OR description LIKE ?) ORDER BY timestamp ASC LIMIT 100',[String(p.telegram_id),'%'+String(p.server_id)+'%','%Srv-NBG-0df200%']);
                let events=[];
                try{
                  const [x]=await conn.execute('SELECT event_type,amount_toman,period_start,period_end,metadata FROM billing_events WHERE server_id=? AND telegram_id=? ORDER BY period_start ASC LIMIT 100',[String(p.server_id),String(p.telegram_id)]);
                  events=x;
                }catch(e){events=[{query_error:String(e.code||'failed')}]}
                const logEvents=[];
                try{
                  const f='server_events.log';
                  if(fs.existsSync(f)&&fs.statSync(f).size<30000000){
                    for(const line of fs.readFileSync(f,'utf8').split('\n')){
                      if(!line.includes(String(p.server_id)))continue;
                      const j=line.indexOf('{');
                      if(j<0)continue;
                      try{
                        const e=JSON.parse(line.slice(j));
                        if(String(e.server_id||'')!==String(p.server_id))continue;
                        logEvents.push({at:line.slice(0,j).trim(),type:String(e.type||''),status:e.status||null,code:e.code||null});
                      }catch(_){}
                    }
                  }
                }catch(e){logEvents.push({error:String(e.code||'unavailable')})}
                report.purchases.push({server_name:p.server_name,duration:p.duration,status:p.status,amount:p.amount,pricing_mode:p.pricing_mode,monthly_basis_price:p.monthly_basis_price,auto_renew_disabled_at:p.auto_renew_disabled_at,renewal_stopped_at:p.renewal_stopped_at,deleted_at:p.deleted_at,created_at:p.created_at,delivered_at:p.delivered_at,last_billed_at:p.last_billed_at,wallet,events,logEvents});
              }
              await conn.query('ROLLBACK');
            }finally{await conn.end()}
            const key=crypto.randomBytes(32);
            const iv=crypto.randomBytes(12);
            const c=crypto.createCipheriv('aes-256-gcm',key,iv);
            const minimal=report.purchases.map(p=>{
              const walletByType={};
              for(const x of p.wallet){const type=String(x.type||'unknown');(walletByType[type]??={count:0,total:0,first:null,last:null}).count++; walletByType[type].total+=Number(x.amount||0); walletByType[type].first ||= x.timestamp;walletByType[type].last=x.timestamp}
              const eventsByType={};
              for(const x of p.events){const type=String(x.event_type||'unknown');(eventsByType[type]??={count:0,total:0}).count++;eventsByType[type].total+=Number(x.amount_toman||0)}
              const auditLogByType={};
              for(const x of p.logEvents){const type=String(x.type||'unknown');(auditLogByType[type]??={count:0,first:null,last:null}).count++;auditLogByType[type].first ||= x.at;auditLogByType[type].last=x.at}
              return {server_name:p.server_name,duration:p.duration,status:p.status,amount:p.amount,pricing_mode:p.pricing_mode,monthly_basis_price:p.monthly_basis_price,auto_renew_disabled_at:p.auto_renew_disabled_at,renewal_stopped_at:p.renewal_stopped_at,deleted_at:p.deleted_at,created_at:p.created_at,delivered_at:p.delivered_at,last_billed_at:p.last_billed_at,walletByType,eventsByType,auditLogByType};
            });
            const msg=Buffer.from(JSON.stringify({purchases:minimal}),'utf8');
            const data=Buffer.concat([c.update(msg),c.final()]);
            const encryptedKey=crypto.publicEncrypt({key:pem,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
            console.log('PRIVATE_AUDIT_B64='+JSON.stringify({key:encryptedKey.toString('base64'),iv:iv.toString('base64'),tag:c.getAuthTag().toString('base64'),data:data.toString('base64').match(/.{1,3}/g).join('.')}));
          })().catch(e=>{console.error('PRIVATE_AUDIT_FAILED='+String(e.code||e.message).slice(0,100));process.exitCode=1});
          PRIVATE_AUDIT
          REMOTE
