name: Audit user 5825867194 billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-user-5825867194-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read-only production billing audit
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const userId = '5825867194';
          const HOURS = {hourly:1,daily:24,weekly:168,monthly:720};
          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              const [[u]] = await c.execute(
                'SELECT telegram_id,wallet,updated_at FROM users WHERE telegram_id=? LIMIT 1',
                [userId]
              );
              console.log('USER_FOUND=' + (u ? 'yes' : 'no'));
              if (!u) return;
              console.log('WALLET=' + Number(u.wallet || 0));
              console.log('USER_UPDATED_AT=' + (u.updated_at ? new Date(u.updated_at).toISOString() : 'none'));

              const [purchases] = await c.execute(
                `SELECT server_id,server_name,datacenter,status,duration,amount,auto_renew,last_billed_at,created_at,
                        renewal_stopped_at,suspend_reason,updated_at
                 FROM purchases
                 WHERE telegram_id=? AND status NOT IN ('deleted','cancelled')
                 ORDER BY created_at`,
                [userId]
              );
              console.log('PURCHASE_COUNT=' + purchases.length);
              const now = new Date();
              for (const p of purchases) {
                const base = new Date(p.last_billed_at || p.created_at || now);
                const hours = HOURS[String(p.duration || '')] || 0;
                const due = hours ? new Date(base.getTime() + hours * 3600000) : null;
                console.log('PURCHASE=' + JSON.stringify({
                  server_id:String(p.server_id || ''),
                  server_name:p.server_name,
                  datacenter:p.datacenter,
                  status:p.status,
                  duration:p.duration,
                  amount:Number(p.amount || 0),
                  auto_renew:Number(p.auto_renew ?? 1),
                  last_billed_at:p.last_billed_at ? new Date(p.last_billed_at).toISOString() : null,
                  created_at:p.created_at ? new Date(p.created_at).toISOString() : null,
                  due_at:due && !Number.isNaN(due.getTime()) ? due.toISOString() : null,
                  overdue_hours:due ? Math.round(((now-due)/3600000)*100)/100 : null,
                  renewal_stopped_at:p.renewal_stopped_at ? new Date(p.renewal_stopped_at).toISOString() : null,
                  suspend_reason:p.suspend_reason,
                  updated_at:p.updated_at ? new Date(p.updated_at).toISOString() : null
                }));
              }

              const [logs] = await c.execute(
                `SELECT id,amount,type,description,timestamp
                 FROM wallet_logs WHERE telegram_id=?
                 ORDER BY timestamp DESC,id DESC LIMIT 30`,
                [userId]
              );
              console.log('RECENT_LOG_COUNT=' + logs.length);
              for (const l of logs) console.log('WALLET_LOG=' + JSON.stringify({
                id:l.id, amount:Number(l.amount||0), type:l.type,
                description:l.description,
                timestamp:l.timestamp ? new Date(l.timestamp).toISOString() : null
              }));

              const [events] = await c.execute(
                `SELECT event_key,server_id,datacenter,event_type,amount_toman,period_start,period_end,created_at
                 FROM billing_events WHERE telegram_id=?
                 ORDER BY created_at DESC LIMIT 20`,
                [userId]
              ).catch(e => e.code === 'ER_NO_SUCH_TABLE' ? [[]] : Promise.reject(e));
              console.log('BILLING_EVENT_COUNT=' + events.length);
              for (const e of events) console.log('BILLING_EVENT=' + JSON.stringify(e));
            } finally {
              await c.end();
            }
          })().catch(e => { console.error('AUDIT_FAILED=' + String(e.code || e.message)); console.error('AUDIT_MESSAGE=' + String(e.sqlMessage || e.message || '')); process.exit(1); });
          NODE

          echo "PM2_STATUS_BEGIN"
          pm2 describe hamoonbot 2>/dev/null | grep -E 'status|uptime|restarts|script path' | head -n 12 || true
          echo "PM2_STATUS_END"
          echo "RECENT_BILLING_RUNTIME_BEGIN"
          timeout 20s pm2 logs hamoonbot --lines 2500 --nostream 2>/dev/null |
            grep -E '5825867194|\[CRON\]|ATOMIC_RENEWAL|Billing Error|skipping missing datacenter' |
            tail -n 250 || true
          echo "RECENT_BILLING_RUNTIME_END"
          REMOTE
