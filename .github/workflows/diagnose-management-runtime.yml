name: Diagnose Management Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-management-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect runtime
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          echo '=== RUNTIME MARKERS ==='
          timeout 20 node - <<'NODE'
          const fs=require('fs');
          const {applyPatches}=require('./runtime-bootstrap');
          const src=applyPatches(fs.readFileSync('index-core.js','utf8'));
          for(const n of [
            "bot.on('callback_query'",
            "[CALLBACK_QUERY_IN]",
            "[MANAGE_CALLBACK_RECEIVED]",
            "[MANAGE_PLAIN_TEXT_SEND]",
            "makeDirectManageCb(payload)",
            "parseDirectManageCb(data)",
            "[HETZNER_TRAFFIC_MONITOR_SERVER_FAILED]"
          ]) console.log(JSON.stringify({needle:n,count:src.split(n).length-1}));
          const trafficIdx=src.indexOf("[HETZNER_TRAFFIC_MONITOR_SERVER_FAILED]");
          if(trafficIdx>=0){
            console.log('--- TRAFFIC MONITOR RUNTIME CONTEXT ---');
            console.log(src.slice(Math.max(0,trafficIdx-7000),trafficIdx+9000));
          }
          const i=src.indexOf("bot.on('callback_query'");
          console.log('--- CALLBACK HANDLER ---');
          console.log(src.slice(i,i+3200));
          const all=[...src.matchAll(/callback_data:\s*makeShortCb\([^\n]+action:\s*'M'[^\n]+/g)].map(m=>m[0]);
          console.log('--- M BUTTON EXPRESSIONS ---');
          console.log(all.slice(0,20).join('\n'));
          process.exit(0);
          NODE

          echo '=== BOT IDENTITY ==='
          TOKEN="$(node -e "require('dotenv').config(); process.stdout.write(process.env.TELEGRAM_BOT_TOKEN||'')")"
          if [ -z "$TOKEN" ]; then
            echo TOKEN_MISSING
          else
            timeout 15 curl -fsS "https://api.telegram.org/bot${TOKEN}/getMe" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const m=j.result||{};console.log(JSON.stringify({ok:j.ok,id:m.id,username:m.username,first_name:m.first_name},null,2));})"
          fi
          unset TOKEN

          echo '=== NEW CALLBACK TRACE ONLY ==='
          pm2 logs hamoonbot --nostream --lines 3000 2>&1 | grep -E "CALLBACK_QUERY_IN|MANAGE_CALLBACK_RECEIVED|MANAGE_PLAIN_TEXT_SEND|CALLBACK_ACK_FAILED|STALE_CALLBACK" | tail -300 || true

          echo '=== PRODUCTION HEAD ==='
          git rev-parse HEAD
          echo '=== LIVE HETZNER RATE LIMIT ==='
          node - <<'NODE'
          require('dotenv').config();
          const axios=require('axios');
          const dcs=require('./datacenters');
          const dc=Object.values(dcs).find(x => String(x?.provider || x?.apiType || '').toLowerCase()==='hetzner');
          const token=dc?.HETZNER_API_TOKEN || dc?.HETZNER_TOKEN || dc?.apiToken || dc?.token || process.env.HETZNER_API_TOKEN || process.env.HETZNER_TOKEN || process.env.HCLOUD_TOKEN;
          (async()=>{
            if(!token){ console.log('RATE_CHECK=no_token'); return; }
            const res=await axios.get('https://api.hetzner.cloud/v1/servers?per_page=1',{
              headers:{Authorization:'Bearer '+token},
              timeout:10000,
              validateStatus:()=>true
            });
            console.log(JSON.stringify({
              status:res.status,
              remaining:res.headers['ratelimit-remaining'] ?? null,
              limit:res.headers['ratelimit-limit'] ?? null,
              reset:res.headers['ratelimit-reset'] ?? null,
              retry_after:res.headers['retry-after'] ?? null
            }));
          })().catch(e=>console.log('RATE_CHECK_ERROR='+(e?.code||e?.message||e)));
          NODE
          echo '=== RECENT HETZNER 429 COUNT ==='
          RECENT_LOGS="$(pm2 logs hamoonbot --nostream --lines 800 2>&1)"
          printf '%s\n' "$RECENT_LOGS" | grep -c "status: 429" || true
          echo '=== ADDITIONAL IP STATE ==='
          timeout 25 node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          const dcs=require('./datacenters');
          const api=require('./Hetzner/hetzner-api');
          (async()=>{
            try {
              const [billed] = await db.pool.query(
                "SELECT floating_ip_id,server_id,telegram_id,datacenter,status,created_at,updated_at FROM hetzner_additional_ip_billing ORDER BY created_at DESC LIMIT 12"
              ).catch(()=>[[]]);
              const [wallet] = await db.pool.query(
                "SELECT telegram_id,amount,type,created_at FROM wallet_logs WHERE type IN ('hetzner_additional_ip','hetzner_additional_ip_renewal') ORDER BY created_at DESC LIMIT 12"
              ).catch(()=>[[]]);
              const dc=Object.values(dcs).find(x => String(x?.provider || x?.apiType || '').toLowerCase()==='hetzner');
              let provider=[];
              if(dc){
                const data=await api.hetznerRequest(dc,'GET','/floating_ips?per_page=50').catch(e=>({__error:e?.code||e?.message}));
                provider=(data?.floating_ips||[]).map(x=>({id:String(x.id),server:x.server??null,server_id:String(x.server?.id||x.server||''),home_location:x.home_location?.name||x.home_location||null,description:x.description||null,created:x.created||null,keys:Object.keys(x||{})}));
                if(data?.__error) provider=[{error:data.__error}];
              }
              console.log(JSON.stringify({billed,wallet,provider},null,2));
            } finally {
              await db.pool.end().catch(()=>{});
            }
          })().catch(e=>{ console.error(e); process.exitCode=1; });
          NODE
          echo '=== ADDITIONAL IP TRACE ==='
          LOGS="$(pm2 logs hamoonbot --nostream --lines 8000 2>&1)"
          printf '%s\n' "$LOGS" | grep -E "HETZNER_ADDITIONAL_IP|ADDITIONAL_IP_SEARCH_TIMEOUT|SSH_(AUTH|TIMEOUT|CONNECTION|COMMAND)|SERVER_PASSWORD_SECRET_REFRESHED|HETZNER_RATE|FLOATING_IP" | tail -500 || true
          echo '=== HETZNER RETRY CONTEXT ==='
          printf '%s\n' "$LOGS" | grep -A 7 -B 1 "\[HETZNER_API_RETRY\]" | tail -500 || true

          echo '=== ONE-OFF RESCUE INSPECTION 2 ==='
          timeout 360 node - <<'NODE'
          require('dotenv').config();
          const {Client}=require('ssh2');
          const dcs=require('./datacenters');
          const api=require('./Hetzner/hetzner-api');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targetId='144775241';
          const expectedIp='91.107.154.177';
          const expectedName='Srv-HET-8a3198';

          function sshRun(host,password,command,timeoutMs=15000){
            return new Promise((resolve,reject)=>{
              const c=new Client();
              let done=false,out='',err='',timer=null;
              const finish=(e,v)=>{
                if(done)return;
                done=true;
                if(timer)clearTimeout(timer);
                try{c.end();}catch(_){}
                try{c.destroy();}catch(_){}
                e?reject(e):resolve(v);
              };
              timer=setTimeout(()=>finish(Object.assign(new Error('SSH_TIMEOUT'),{code:'SSH_TIMEOUT',out,err})),timeoutMs);
              c.on('ready',()=>c.exec(command,(e,stream)=>{
                if(e)return finish(Object.assign(new Error('SSH_EXEC_START_FAILED'),{code:'SSH_EXEC_START_FAILED',cause:e}));
                stream.on('data',d=>out+=String(d));
                stream.stderr.on('data',d=>err+=String(d));
                stream.on('error',e=>finish(Object.assign(new Error('SSH_STREAM_FAILED'),{code:'SSH_STREAM_FAILED',cause:e,out,err})));
                stream.on('close',code=>{
                  if(Number(code)===0)finish(null,{out,err,code:Number(code)});
                  else finish(Object.assign(new Error('SSH_COMMAND_FAILED'),{code:'SSH_COMMAND_FAILED',exitCode:Number(code),out,err}));
                });
              }));
              c.on('error',e=>finish(Object.assign(new Error('SSH_CONNECT_FAILED'),{code:'SSH_CONNECT_FAILED',cause:e,out,err})));
              c.connect({host,port:22,username:'root',password,readyTimeout:10000,tryKeyboard:false});
            });
          }

          async function waitSsh(password){
            let last;
            for(let i=1;i<=20;i++){
              try{await sshRun(expectedIp,password,'echo READY',8000);console.log('RESCUE_SSH_ATTEMPT='+i);return;}
              catch(e){last=e;await sleep(3000);}
            }
            throw last||new Error('RESCUE_SSH_UNAVAILABLE');
          }

          async function exitRescue(dc){
            await api.hetznerRequest(dc,'POST','/servers/'+targetId+'/actions/disable_rescue',{}).catch(()=>{});
            const back=await api.hetznerRequest(dc,'POST','/servers/'+targetId+'/actions/reboot',{}).catch(()=>null);
            if(back?.action?.id) await api.waitHetznerAction(dc,back.action.id,120000).catch(()=>{});
            console.log('EXIT_RESCUE_ATTEMPTED=1');
          }

          (async()=>{
            const dc=Object.values(dcs).find(x=>String(x?.provider||x?.apiType||'').toLowerCase()==='hetzner');
            if(!dc) throw new Error('HETZNER_DC_NOT_FOUND');
            let rescueActive=false;
            try{
              const before=await api.hetznerRequest(dc,'GET','/servers/'+targetId);
              const srv=before?.server||{};
              const actual={id:String(srv.id||''),name:String(srv.name||''),ip:String(srv?.public_net?.ipv4?.ip||''),status:String(srv.status||'')};
              console.log('VERIFY='+JSON.stringify(actual));
              if(actual.id!==targetId||actual.name!==expectedName||actual.ip!==expectedIp) throw new Error('TARGET_MISMATCH');

              const rescue=await api.hetznerRequest(dc,'POST','/servers/'+targetId+'/actions/enable_rescue',{type:'linux64'});
              const rescuePassword=String(rescue?.root_password||'');
              if(!rescuePassword) throw new Error('RESCUE_PASSWORD_MISSING');
              rescueActive=true;
              console.log('RESCUE_ENABLED=1');

              const reboot=await api.hetznerRequest(dc,'POST','/servers/'+targetId+'/actions/reboot',{});
              if(reboot?.action?.id) await api.waitHetznerAction(dc,reboot.action.id,120000).catch(()=>{});
              await waitSsh(rescuePassword);
              console.log('RESCUE_SSH_READY=1');

              const inspect=[
                'set -e',
                'mkdir -p /mnt/hamoon-target',
                'umount /mnt/hamoon-target >/dev/null 2>&1 || true',
                'ROOT=""',
                'for dev in $(blkid -o device 2>/dev/null); do',
                '  umount /mnt/hamoon-target >/dev/null 2>&1 || true',
                '  if mount -o ro "$dev" /mnt/hamoon-target >/dev/null 2>&1; then',
                '    if [ -f /mnt/hamoon-target/etc/os-release ] && grep -qi ubuntu /mnt/hamoon-target/etc/os-release; then ROOT="$dev"; break; fi',
                '  fi',
                'done',
                'echo ROOT_DEVICE="$ROOT"',
                '[ -n "$ROOT" ] || exit 20',
                'echo SECTION_OS',
                'grep -E "^(NAME|VERSION|ID)=" /mnt/hamoon-target/etc/os-release || true',
                'echo SECTION_SSH_CONFIG',
                'grep -RhsE "^[[:space:]]*(Port|ListenAddress|PermitRootLogin|PasswordAuthentication|PubkeyAuthentication)[[:space:]]+" /mnt/hamoon-target/etc/ssh/sshd_config /mnt/hamoon-target/etc/ssh/sshd_config.d 2>/dev/null || true',
                'echo SECTION_SSH_SERVICE',
                'ls -l /mnt/hamoon-target/etc/systemd/system/multi-user.target.wants/ssh.service /mnt/hamoon-target/etc/systemd/system/sshd.service 2>/dev/null || true',
                'echo SECTION_UFW',
                'cat /mnt/hamoon-target/etc/ufw/ufw.conf 2>/dev/null | head -40 || true',
                'grep -RhsE "22(/tcp)?|dport 22|--dport 22" /mnt/hamoon-target/etc/ufw /mnt/hamoon-target/etc/iptables /mnt/hamoon-target/etc/nftables.conf 2>/dev/null | head -120 || true',
                'echo SECTION_FAIL2BAN',
                'grep -RhsE "^[[:space:]]*(enabled|port|bantime|maxretry)[[:space:]]*=" /mnt/hamoon-target/etc/fail2ban/jail.local /mnt/hamoon-target/etc/fail2ban/jail.d 2>/dev/null | head -120 || true',
                'echo SECTION_AUTH_LOG',
                'tail -120 /mnt/hamoon-target/var/log/auth.log 2>/dev/null | grep -Ei "sshd|fail2ban|ban|block" | tail -80 || true',
                'umount /mnt/hamoon-target >/dev/null 2>&1 || true'
              ].join('\n');

              const result=await sshRun(expectedIp,rescuePassword,inspect,45000);
              console.log('INSPECT_OUT_BEGIN');
              console.log(result.out);
              console.log('INSPECT_OUT_END');
            }catch(e){
              console.error('RESCUE_INSPECT_ERROR='+(e?.code||e?.message||String(e)));
              if(e?.out) console.error('RESCUE_INSPECT_STDOUT='+String(e.out).slice(-12000));
              if(e?.err) console.error('RESCUE_INSPECT_STDERR='+String(e.err).slice(-12000));
              process.exitCode=1;
            }finally{
              if(rescueActive) await exitRescue(dc);
            }
          })();
          NODE

          REMOTE
