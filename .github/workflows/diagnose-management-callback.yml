name: Diagnose Management Callback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-management-callback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect production callback runtime
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -u
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          echo '=== GIT ==='
          git rev-parse HEAD
          git status --short | head -50 || true

          echo '=== PM2 ==='
          pm2 jlist | node - <<'NODE'
          let s='';
          process.stdin.on('data',d=>s+=d).on('end',()=>{
            const a=JSON.parse(s||'[]');
            for (const p of a) {
              if (p.name === 'hamoonbot') {
                console.log(JSON.stringify({
                  name:p.name,
                  pid:p.pid,
                  status:p.pm2_env?.status,
                  exec_mode:p.pm2_env?.exec_mode,
                  instances:p.pm2_env?.instances,
                  pm_id:p.pm_id,
                  restart_time:p.pm2_env?.restart_time,
                  node_version:p.pm2_env?.node_version,
                  cwd:p.pm2_env?.pm_cwd,
                  script:p.pm2_env?.pm_exec_path
                }, null, 2));
              }
            }
          });
          NODE

          echo '=== SOURCE MARKERS ==='
          grep -n "function makeDirectManageCb\|function parseDirectManageCb\|directManagePayload\|STALE_CALLBACK" index-core.js || true

          echo '=== COMPOSED VALIDATION ==='
          node scripts/validate-hetzner-management-buttons.js || true
          node - <<'NODE'
          const fs=require('fs');
          const {applyPatches}=require('./runtime-bootstrap');
          const s=applyPatches(fs.readFileSync('index-core.js','utf8'));
          const markers=[
            'function makeDirectManageCb(payload)',
            'function parseDirectManageCb(data)',
            'const directManagePayload = parseDirectManageCb(data);',
            "case 'M':"
          ];
          for (const m of markers) console.log(m, s.includes(m));
          const i=s.indexOf('function makeDirectManageCb(payload)');
          console.log(s.slice(i, i+1800));
          const j=s.indexOf('const data = q.data;');
          console.log(s.slice(j, j+1300));
          NODE

          echo '=== RECENT HAMOONBOT ERRORS / CALLBACKS ==='
          pm2 logs hamoonbot --nostream --lines 700 2>&1 | grep -E -i "callback|stale|manage|servermanagement|typeerror|referenceerror|unhandled|uncaught|error|invalid|telegram" | tail -300 || true

          echo '=== RECENT RAW TAIL ==='
          pm2 logs hamoonbot --nostream --lines 180 2>&1 | tail -180 || true
          REMOTE
