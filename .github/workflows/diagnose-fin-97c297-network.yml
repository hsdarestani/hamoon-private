name: Diagnose Srv-FIN-97c297 network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-fin-97c297-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Read provider network state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const dcs=require('./datacenters');
          const hz=require('./Hetzner/hetzner-api');
          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let p, hist=[];
            try {
              [[p]]=await conn.execute(`SELECT server_id,telegram_id,datacenter,server_name,public_ip,status FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,['Srv-FIN-97c297']);
              if (p) {
                try { [hist]=await conn.execute(`SELECT ip_address,first_seen_at,last_seen_at,seen_count,last_event FROM server_ip_history WHERE datacenter=? AND server_id=? ORDER BY last_seen_at DESC LIMIT 20`,[p.datacenter,String(p.server_id)]); } catch {}
              }
            } finally { await conn.end(); }
            if(!p) throw new Error('TARGET_NOT_FOUND');
            const dc=dcs[p.datacenter];
            const raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
            const ipv4=raw?.public_net?.ipv4||null;
            const ipv6=raw?.public_net?.ipv6||null;
            console.log('SERVER_RAW='+JSON.stringify({id:String(raw?.id||p.server_id),name:raw?.name||null,status:raw?.status||null,locked:!!raw?.locked,datacenter:raw?.datacenter?.name||null,location:raw?.datacenter?.location?.name||null,ipv4:ipv4?{id:ipv4.id,ip:ipv4.ip,blocked:ipv4.blocked,dns_ptr:ipv4.dns_ptr}:null,ipv6:ipv6?{ip:ipv6.ip,blocked:ipv6.blocked}:null}));
            console.log('IP_HISTORY='+JSON.stringify((hist||[]).map(x=>({ip:x.ip_address,first:x.first_seen_at,last:x.last_seen_at,count:Number(x.seen_count),event:x.last_event}))));
            if(ipv4?.id){
              const pri=(await hz.hetznerRequest(dc,'GET',`/primary_ips/${ipv4.id}`)).primary_ip;
              console.log('PRIMARY_IP='+JSON.stringify({id:String(pri?.id||ipv4.id),ip:pri?.ip||null,blocked:!!pri?.blocked,assignee_id:pri?.assignee_id==null?null:String(pri.assignee_id),assignee_type:pri?.assignee_type||null,auto_delete:!!pri?.auto_delete,location:pri?.datacenter?.location?.name||pri?.location?.name||null}));
            }
            const fwData=await hz.hetznerRequest(dc,'GET','/firewalls?per_page=100');
            const applied=(fwData.firewalls||[]).filter(f=>(f.applied_to||[]).some(a=>String(a?.server?.id||a?.id||'')===String(p.server_id)));
            console.log('FIREWALLS='+JSON.stringify(applied.map(f=>({id:String(f.id),name:f.name,rule_count:(f.rules||[]).length,rules:(f.rules||[]).map(r=>({direction:r.direction,protocol:r.protocol,port:r.port||null,source_ips:r.source_ips||[],destination_ips:r.destination_ips||[]}))}))));
          })().catch(e=>{console.error('DIAG_FATAL='+String(e?.message||e));process.exitCode=1;});
          NODE
          REMOTE
