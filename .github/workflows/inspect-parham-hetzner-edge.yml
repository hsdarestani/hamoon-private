name: Inspect Parham Hetzner Edge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-parham-hetzner-edge.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect provider edge
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          git pull --ff-only
          node - <<'NODE'
          'use strict';
          require('dotenv').config();
          const dcs = require('./datacenters');
          const h = require('./Hetzner/hetzner-api');
          const dc = dcs.hetzner;
          const serverId = '166290719';
          const ip = '91.107.245.81';

          function selectorMatches(labels, selector) {
            const s = String(selector || '').trim();
            if (!s) return false;
            const parts = s.split(',').map(x => x.trim()).filter(Boolean);
            return parts.every(part => {
              const m = part.match(/^([A-Za-z0-9_.\/-]+)\s*(=|==|!=)\s*(.+)$/);
              if (m) {
                const [, key, op, value] = m;
                const actual = String(labels?.[key] ?? '');
                return op === '!=' ? actual !== value : actual === value;
              }
              return Object.prototype.hasOwnProperty.call(labels || {}, part);
            });
          }

          (async () => {
            const server = await h.hetznerRequest(dc, 'GET', '/servers/' + serverId);
            const srv = server?.server || server;
            const fwData = await h.hetznerRequest(dc, 'GET', '/firewalls?per_page=50');
            const primaryData = await h.hetznerRequest(dc, 'GET', '/primary_ips?ip=' + encodeURIComponent(ip) + '&per_page=20');

            const labels = srv?.labels || {};
            const relevant = (fwData?.firewalls || []).filter(fw => {
              return (fw.applied_to || []).some(a => {
                if (a?.type === 'server') return String(a?.server?.id || a?.server_id || '') === serverId;
                if (a?.type === 'label_selector') return selectorMatches(labels, a?.label_selector?.selector);
                return false;
              });
            }).map(fw => ({
              id: fw.id,
              name: fw.name,
              applied_to: fw.applied_to,
              inbound: (fw.rules || []).filter(r => r.direction === 'in').map(r => ({
                protocol:r.protocol, port:r.port, source_ips:r.source_ips
              })),
              outbound: (fw.rules || []).filter(r => r.direction === 'out').map(r => ({
                protocol:r.protocol, port:r.port, destination_ips:r.destination_ips
              }))
            }));

            console.log('EDGE_SERVER=' + JSON.stringify({
              id: srv?.id,
              status: srv?.status,
              locked: srv?.locked,
              rescue_enabled: srv?.rescue_enabled,
              labels,
              ipv4: srv?.public_net?.ipv4 || null,
              ipv6: srv?.public_net?.ipv6 || null
            }));
            console.log('EDGE_PRIMARY=' + JSON.stringify((primaryData?.primary_ips || []).map(p => ({
              id:p.id, ip:p.ip, type:p.type, assignee_id:p.assignee_id,
              assignee_type:p.assignee_type, datacenter:p.datacenter?.name || null,
              auto_delete:p.auto_delete, blocked:p.blocked
            }))));
            console.log('EDGE_RELEVANT_FIREWALLS=' + JSON.stringify(relevant));
            process.exit(0);
          })().catch(e => {
            console.error('EDGE_INSPECT_FAILED=' + JSON.stringify({
              status:e?.status || e?.response?.status || null,
              code:e?.code || e?.response?.data?.error?.code || null,
              message:String(e?.message || e).slice(0,200)
            }));
            process.exit(1);
          });
          NODE
          REMOTE
