name: Safe reboot Srv-FIN-97c297

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reboot-fin-97c297-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reboot:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Graceful provider reboot and verify network
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const dcs = require('./datacenters');
          const cloud = require('./cloud-api');
          const hetzner = require('./Hetzner/hetzner-api');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            const conn = await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let p;
            try {
              [[p]] = await conn.execute(`SELECT server_id,datacenter,server_name,status,public_ip,deleted_at FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`, ['Srv-FIN-97c297']);
            } finally { await conn.end(); }
            if (!p || p.deleted_at) throw new Error('TARGET_PURCHASE_NOT_ACTIVE');
            const dc = dcs[p.datacenter];
            if (!dc) throw new Error('DATACENTER_CONFIG_NOT_FOUND');
            const before = await cloud.getServer(dc, null, p.server_id);
            console.log('BEFORE=' + JSON.stringify({id:String(p.server_id),name:p.server_name,provider_status:before?.status||before?.state||null,ip:p.public_ip}));
            // Graceful Hetzner reboot only. No rebuild/reset/reinstall/disk operation.
            const data = await hetzner.hetznerRequest(dc, 'POST', `/servers/${p.server_id}/actions/reboot`, {});
            const action = data?.action;
            console.log('REBOOT_ACTION=' + JSON.stringify({id:action?.id||null,status:action?.status||null}));
            if (action?.id) await cloud.waitHetznerAction(dc, action.id, 180000);
            for (let i=0;i<24;i++) {
              await sleep(5000);
              const s = await cloud.getServer(dc, null, p.server_id);
              const st = String(s?.status||s?.state||'').toLowerCase();
              console.log('STATUS_POLL=' + JSON.stringify({attempt:i+1,status:st}));
              if (st === 'running' && i >= 1) break;
            }
            const after = await cloud.getServer(dc, null, p.server_id);
            const st = String(after?.status||after?.state||'').toLowerCase();
            console.log('AFTER=' + JSON.stringify({provider_status:st,ip:p.public_ip}));
            if (st !== 'running') throw new Error('SERVER_NOT_RUNNING_AFTER_REBOOT');
          })().catch(e=>{console.error('REBOOT_FATAL='+String(e?.message||e));process.exitCode=1;});
          NODE

          echo '=== WAIT FOR GUEST NETWORK ==='
          ok=0
          for i in $(seq 1 18); do
            if timeout 4 bash -c '</dev/tcp/65.109.192.5/22' 2>/dev/null; then
              echo "SSH_POLL_${i}=open"
              ok=1
              break
            fi
            echo "SSH_POLL_${i}=closed_or_filtered"
            sleep 5
          done
          for port in 80 443; do
            if timeout 4 bash -c "</dev/tcp/65.109.192.5/$port" 2>/dev/null; then echo "TCP_${port}=open"; else echo "TCP_${port}=closed_or_filtered"; fi
          done
          echo "SSH_FINAL=$ok"
          REMOTE
