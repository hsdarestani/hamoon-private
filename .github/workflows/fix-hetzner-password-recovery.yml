name: Fix Hetzner Password Recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-hetzner-password-recovery-fix.py'
      - 'scripts/recover-hetzner-password-missing.js'
      - '.github/workflows/fix-hetzner-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-recover:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-hetzner-password-recovery-fix.py
          node --check cloud-api.js
          node --check index-core.js
          node --check services/hetzner-lifecycle.js
          node --check scripts/recover-hetzner-password-missing.js
          node - <<'NODE'
          const fs = require('fs');
          const { patchLifecycleSource } = require('./services/hetzner-lifecycle-safe-bootstrap');
          const src = fs.readFileSync('services/hetzner-lifecycle.js', 'utf8');
          patchLifecycleSource(src);
          console.log('SAFE_LIFECYCLE_BOOTSTRAP_COMPAT=yes');
          NODE
          grep -q 'HETZNER_PASSWORD_PRESTORE_V1' index-core.js
          grep -q "callWithHetznerLockedRetry(dc, 'reset_password', call)" cloud-api.js
          grep -q "reason = secretCode === 'SERVER_SECRET_KEY_MISSING'" services/hetzner-lifecycle.js

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add cloud-api.js index-core.js services/hetzner-lifecycle.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix(hetzner): recover and pre-store delivery passwords'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy, restore key, and recover stuck password deliveries
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          echo '=== UPDATE SOURCE ==='
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          echo '=== RESTORE / VERIFY SECRET KEY ==='
          node scripts/restore-server-secret-key.js .env

          echo '=== VALIDATE ==='
          node --check cloud-api.js
          node --check index-core.js
          node --check services/hetzner-lifecycle.js
          node --check scripts/recover-hetzner-password-missing.js
          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          setTimeout(async () => {
            try {
              const [rows] = await db.pool.query("SELECT server_id FROM server_secrets WHERE secret_type='root_password' ORDER BY id DESC LIMIT 1");
              if (rows.length) {
                const value = await db.getServerSecret(rows[0].server_id, 'root_password');
                if (!value) throw new Error('empty decrypted secret');
                console.log('SERVER_SECRET_DECRYPT_TEST=pass');
              } else {
                if (!process.env.SERVER_SECRET_KEY) throw new Error('SERVER_SECRET_KEY missing');
                console.log('SERVER_SECRET_DECRYPT_TEST=pass_no_rows');
              }
              await db.pool.end();
              process.exit(0);
            } catch (error) {
              console.error('SERVER_SECRET_DECRYPT_TEST=fail:' + error.message);
              process.exit(1);
            }
          }, 1000);
          NODE

          echo '=== RECOVER PASSWORD_MISSING MANUAL REVIEWS ==='
          node scripts/recover-hetzner-password-missing.js

          echo '=== RESTART BOT ==='
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = 'online'

          echo '=== IMMEDIATE READ-BACK ==='
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || 'localhost',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || '',
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            const [rows] = await c.query(`
              SELECT p.server_id, p.datacenter, p.status, p.delivered_at, p.ip_quality_attempts,
                     EXISTS(SELECT 1 FROM server_secrets s WHERE s.server_id=p.server_id AND s.secret_type='root_password') AS has_password_secret
              FROM purchases p
              WHERE (LOWER(p.datacenter)='hetzner' OR LOWER(p.datacenter) LIKE 'hetzner-%')
                AND p.delivered_at IS NULL
              ORDER BY p.created_at DESC
              LIMIT 20
            `);
            console.log('HETZNER_UNDELIVERED_STATE=' + JSON.stringify(rows));
            const target = rows.find(r => String(r.server_id) === '161295473');
            if (target) console.log('TARGET_161295473=' + JSON.stringify(target));
            await c.end();
          })().catch(e => { console.error('READBACK_FAILED=' + e.message); process.exit(1); });
          NODE

          echo '=== RECENT PASSWORD / RECONCILE LOGS ==='
          pm2 logs hamoonbot --lines 120 --nostream 2>/dev/null \
            | grep -Ei 'password_missing|secret_key_missing|secret_decrypt_failed|HETZNER_PROVISIONING_RECONCILE|reset_password|manual review' \
            | tail -n 80 || true
          REMOTE
