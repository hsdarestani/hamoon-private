name: Restore DB runtime helpers

on:
  push:
    branches:
      - fix/restore-production-db-2
    paths:
      - .github/workflows/restore-db-runtime.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-production-db-2

      - name: Restore missing DB helpers and validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('db.js')
          s = p.read_text(encoding='utf-8')
          marker = 'module.exports = {'
          if marker not in s:
              raise SystemExit('module.exports marker missing')

          helpers = r'''
          async function getAllActivePurchases() {
              const conn = await pool.getConnection();
              try {
                  const [rows] = await conn.execute(
                      `SELECT * FROM purchases
                       WHERE status = 'active'
                       ORDER BY created_at DESC`
                  );
                  return rows;
              } finally {
                  conn.release();
              }
          }

          async function updatePurchaseTrafficBilled(serverId, lastBilledTrafficGb, lastBilledAt = undefined) {
              const conn = await pool.getConnection();
              try {
                  let sql = 'UPDATE purchases SET last_billed_traffic_gb = ?, updated_at = CURRENT_TIMESTAMP';
                  const params = [Number(lastBilledTrafficGb || 0)];
                  if (lastBilledAt !== undefined && lastBilledAt !== null) {
                      const formattedDate = lastBilledAt instanceof Date
                          ? lastBilledAt.toISOString().slice(0, 19).replace('T', ' ')
                          : lastBilledAt;
                      sql += ', last_billed_at = ?';
                      params.push(formattedDate);
                  }
                  sql += ' WHERE server_id = ?';
                  params.push(String(serverId));
                  const [res] = await conn.execute(sql, params);
                  return res.affectedRows > 0;
              } finally {
                  conn.release();
              }
          }

          async function adminUpdateBilling(serverId, updates = {}) {
              const conn = await pool.getConnection();
              try {
                  const fields = [];
                  const params = [];
                  if (Object.prototype.hasOwnProperty.call(updates, 'price_per_gb')) {
                      fields.push('price_per_gb = ?');
                      params.push(Number(updates.price_per_gb || 0));
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'pricePerGb')) {
                      fields.push('price_per_gb = ?');
                      params.push(Number(updates.pricePerGb || 0));
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'download_only')) {
                      fields.push('download_only = ?');
                      params.push(updates.download_only ? 1 : 0);
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'downloadOnly')) {
                      fields.push('download_only = ?');
                      params.push(updates.downloadOnly ? 1 : 0);
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'duration')) {
                      fields.push('duration = ?');
                      params.push(String(updates.duration));
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'amount')) {
                      fields.push('amount = ?');
                      params.push(Number(updates.amount || 0));
                  }
                  if (Object.prototype.hasOwnProperty.call(updates, 'auto_renew')) {
                      fields.push('auto_renew = ?');
                      params.push(updates.auto_renew ? 1 : 0);
                  }
                  if (!fields.length) return false;
                  fields.push('updated_at = CURRENT_TIMESTAMP');
                  params.push(String(serverId));
                  const [res] = await conn.execute(
                      `UPDATE purchases SET ${fields.join(', ')} WHERE server_id = ?`,
                      params
                  );
                  return res.affectedRows > 0;
              } finally {
                  conn.release();
              }
          }

          '''

          for name in ('getAllActivePurchases', 'updatePurchaseTrafficBilled', 'adminUpdateBilling'):
              if f'async function {name}(' not in s:
                  pass
              else:
                  helpers = helpers.replace(f'async function {name}(', f'/* already-defined:{name} */ async function {name}(', 1)

          # Current broken main is missing all three helpers; fail closed if that assumption changes.
          if any(f'async function {name}(' in s for name in ('getAllActivePurchases', 'updatePurchaseTrafficBilled', 'adminUpdateBilling')):
              raise SystemExit('DB helper state changed; refusing blind patch')

          s = s.replace(marker, helpers + marker, 1)
          p.write_text(s, encoding='utf-8')

          validator = r'''#!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const source = fs.readFileSync('db.js', 'utf8');
          const m = source.match(/module\.exports\s*=\s*\{([\s\S]*?)\}\s*;?\s*$/);
          if (!m) { console.error('FAIL module.exports not found'); process.exit(1); }
          const exported = m[1].split('\n').map(x => x.replace(/\/\/.*$/, '').trim().replace(/,$/, '')).filter(x => /^[A-Za-z_$][\w$]*$/.test(x));
          const missing = exported.filter(name => {
            const e = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return ![
              new RegExp('\\basync\\s+function\\s+' + e + '\\s*\\('),
              new RegExp('\\bfunction\\s+' + e + '\\s*\\('),
              new RegExp('\\b(?:const|let|var)\\s+' + e + '\\b'),
              new RegExp('\\bclass\\s+' + e + '\\b')
            ].some(re => re.test(source));
          });
          if (missing.length) { console.error('FAIL undeclared db exports:', missing.join(', ')); process.exit(1); }
          console.log('OK all db exports are declared:', exported.length);
          '''
          Path('scripts/validate-db-exports.js').write_text(validator, encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          scripts = pkg.setdefault('scripts', {})
          scripts['validate:db-exports'] = 'node scripts/validate-db-exports.js'
          test = scripts.get('test', '')
          if 'npm run validate:db-exports' not in test:
              parts = test.split(' && ') if test else []
              parts.insert(1 if parts else 0, 'npm run validate:db-exports')
              scripts['test'] = ' && '.join(parts)
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node -c db.js
          node scripts/validate-db-exports.js

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/restore-db-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restore missing database runtime helpers"
          git push origin HEAD:fix/restore-production-db-2
