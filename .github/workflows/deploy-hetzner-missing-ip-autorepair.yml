name: Deploy Hetzner Missing IP Autorepair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hetzner-missing-ip-autorepair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate autorepair
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-hetzner-missing-ip-autorepair.js
          node --check services/hetzner-lifecycle.js
          grep -q "missing_primary_ip_repaired" services/hetzner-lifecycle.js
          grep -q "missing_primary_ip_repair_failed" services/hetzner-lifecycle.js

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add services/hetzner-lifecycle.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(hetzner): auto-repair missing provisioning IPv4'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node --check services/hetzner-lifecycle.js
          grep -q "missing_primary_ip_repaired" services/hetzner-lifecycle.js
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 6
          STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$STATUS"
          test "$STATUS" = online
          node - <<'NODE'
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.execute(`SELECT server_id,status FROM purchases WHERE delivered_at IS NULL AND (LOWER(datacenter)='hetzner' OR LOWER(datacenter) LIKE 'hetzner-%') AND status IN ('provisioning','pending_ip','pending_ssh','pending_ip_quality','manual_review')`);
            console.log('UNDELIVERED_COUNT='+rows.length);
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          REMOTE
