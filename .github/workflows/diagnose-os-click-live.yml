name: Diagnose OS Click Live

on:
  push:
    branches: [diag/os-click-live-20260904]
    paths:
      - '.github/workflows/diagnose-os-click-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_diag_key
          chmod 600 ~/.ssh/hamoon_diag_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read live bot diagnostics without restart
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_diag_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== HEAD ==='
          git rev-parse --short HEAD
          echo '=== PM2 ==='
          pm2 describe hamoonbot | grep -E 'status|uptime|restarts|script path|exec cwd' | head -n 20 || true
          echo '=== RECENT PURCHASE/CALLBACK LOGS ==='
          pm2 logs hamoonbot --lines 700 --nostream 2>/dev/null \
            | grep -Ei 'handleImageSelection|handleFlavorSelection|SELECT_IMAGE|IMAGE_MENU|No image|HETZNER_IMAGE|HETZNER_INVALID_IMAGE_ARCH|Telegram|callback|snapshot|system.*image|image.*selection|TypeError|ReferenceError' \
            | tail -n 240 || true
          echo '=== DONE ==='
          REMOTE
