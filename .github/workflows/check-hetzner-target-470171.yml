name: Check Hetzner Target Srv-HET-470171

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-hetzner-target-470171.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read target state without exposing credentials or IP
        shell: bash
        run: |
          set +e
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE' > "$RUNNER_TEMP/target.log" 2>&1
          set +e
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH" || { echo 'TARGET_QUERY=app_path_failed'; exit 0; }
          node - <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const net = require('net');
          const db = require('./db');
          const dcs = require('./datacenters');
          const cloud = require('./cloud-api');
          const { installStrictCheckHostFetch } = require('./services/check-host-strict-fetch');

          process.env.HETZNER_IP_QUALITY_IR_NODES = '6';
          process.env.HETZNER_IP_QUALITY_IR_MIN_SUCCESS = '4';
          process.env.HETZNER_IP_QUALITY_GLOBAL_NODES = '6';
          process.env.HETZNER_IP_QUALITY_GLOBAL_MIN_RATIO = '0.67';
          try { installStrictCheckHostFetch(); } catch (_) {}
          const lifecycle = require('./services/hetzner-lifecycle');

          function tcp22(ip, timeoutMs = 5000) {
            return new Promise(resolve => {
              const s = net.createConnection({ host: ip, port: 22 });
              let done = false;
              const finish = ok => { if (done) return; done = true; s.destroy(); resolve(ok); };
              s.setTimeout(timeoutMs);
              s.once('connect', () => finish(true));
              s.once('timeout', () => finish(false));
              s.once('error', () => finish(false));
            });
          }

          (async()=>{
            const c=await mysql.createConnection({
              host:process.env.DB_HOST||'localhost',
              user:process.env.DB_USER||'root',
              password:process.env.DB_PASSWORD||'',
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            const [rows]=await c.query(`
              SELECT p.server_id,p.datacenter,p.status,p.public_ip,
                     IF(p.delivered_at IS NULL,'no','yes') delivered,
                     p.ip_quality_attempts,p.ip_quality_summary,
                     IF(p.ip_quality_checked_at IS NULL,'no','yes') quality_checked_before,
                     EXISTS(SELECT 1 FROM server_secrets s WHERE s.server_id=p.server_id AND s.secret_type='root_password') has_password_secret
              FROM purchases p
              LEFT JOIN server_display_names n
                ON n.telegram_id=p.telegram_id AND n.datacenter=p.datacenter AND n.server_id=p.server_id
              WHERE p.server_name=? OR n.display_name=?
              ORDER BY p.updated_at DESC
              LIMIT 1
            `,['Srv-HET-470171','Srv-HET-470171']);
            const row=rows[0]||null;
            console.log('TARGET_FOUND='+(row?'yes':'no'));
            if (!row) {
              console.log('TARGET_QUERY=not_found_by_display_name');
              await c.end();
              await db.pool.end().catch(()=>{});
              return;
            }

            console.log('TARGET_DC='+String(row.datacenter||'unknown').replace(/[^a-zA-Z0-9_-]/g,''));
            console.log('TARGET_DB_STATUS='+String(row.status||'unknown').replace(/[^a-zA-Z0-9_:-]/g,''));
            console.log('TARGET_DELIVERED='+row.delivered);
            console.log('TARGET_IP_PRESENT='+(row.public_ip?'yes':'no'));
            console.log('TARGET_QUALITY_ATTEMPTS='+Number(row.ip_quality_attempts||0));
            console.log('TARGET_QUALITY_CHECKED_BEFORE='+row.quality_checked_before);
            console.log('TARGET_PASSWORD_SECRET='+(Number(row.has_password_secret||0)===1?'present':'missing'));

            if (Number(row.has_password_secret||0)===1) {
              try {
                const pw=await db.getServerSecret(row.server_id,'root_password');
                console.log('TARGET_SECRET_DECRYPT='+(pw?'pass':'empty'));
              } catch(e) {
                console.log('TARGET_SECRET_DECRYPT=fail:'+String(e.code||e.message||'unknown').replace(/\s+/g,'_').slice(0,80));
              }
            } else {
              console.log('TARGET_SECRET_DECRYPT=no_secret_row');
            }

            const dc=dcs[row.datacenter] ? { ...dcs[row.datacenter], key: row.datacenter } : null;
            if (!dc) {
              console.log('TARGET_PROVIDER_STATE=missing_datacenter');
              await c.end();
              await db.pool.end().catch(()=>{});
              return;
            }

            try {
              const srv=await cloud.getServer(dc,null,row.server_id);
              const providerState=String(srv?.status||srv?.state||'unknown').toLowerCase();
              const ip=srv?.public_net?.ipv4?.ip || srv?.public_ip || row.public_ip || null;
              console.log('TARGET_PROVIDER_STATE='+providerState.replace(/[^a-z0-9_-]/g,''));
              console.log('TARGET_PROVIDER_IP_PRESENT='+(ip?'yes':'no'));
              if (!ip) {
                console.log('TARGET_LOCAL_SSH=not_checked');
                console.log('TARGET_QUALITY=not_checked_no_ip');
              } else {
                const ssh=await tcp22(ip,5000);
                console.log('TARGET_LOCAL_SSH='+(ssh?'pass':'fail'));
                const quality=await lifecycle.checkIpQuality(ip);
                console.log('TARGET_QUALITY_OK='+(quality?.ok?'yes':'no'));
                console.log('TARGET_QUALITY_CHECKED='+(quality?.checked?'yes':'no'));
                console.log('TARGET_QUALITY_DEFINITIVE='+(quality?.definitive?'yes':'no'));
                console.log('TARGET_QUALITY_REASON='+String(quality?.reason||'unknown').replace(/\s+/g,'_').slice(0,100));
                console.log('TARGET_QUALITY_IR='+Number(quality?.iran?.success||0)+'/'+Number(quality?.iran?.selected||0));
                console.log('TARGET_QUALITY_GLOBAL='+Number(quality?.global?.success||0)+'/'+Number(quality?.global?.selected||0));
                if (providerState === 'running' && ssh && quality?.ok && Number(row.has_password_secret||0)===1) {
                  console.log('TARGET_DIAGNOSIS=ready_but_db_not_delivered');
                } else if (providerState !== 'running') {
                  console.log('TARGET_DIAGNOSIS=provider_not_running');
                } else if (!ssh) {
                  console.log('TARGET_DIAGNOSIS=ssh_unreachable');
                } else if (!quality?.checked || !quality?.definitive) {
                  console.log('TARGET_DIAGNOSIS=quality_probe_inconclusive');
                } else if (!quality?.ok) {
                  console.log('TARGET_DIAGNOSIS=ip_failed_quality_gate');
                } else if (Number(row.has_password_secret||0)!==1) {
                  console.log('TARGET_DIAGNOSIS=password_secret_missing');
                } else {
                  console.log('TARGET_DIAGNOSIS=unknown');
                }
              }
            } catch(e) {
              console.log('TARGET_PROVIDER_STATE=lookup_failed:'+String(e.status||e.code||e.message||'unknown').replace(/\s+/g,'_').slice(0,80));
            }
            await c.end();
            await db.pool.end().catch(()=>{});
          })().catch(async e=>{
            console.log('TARGET_QUERY=failed:'+String(e.message||e).replace(/\s+/g,'_').slice(0,100));
            try{await db.pool.end()}catch(_){}
          });
          NODE
          REMOTE
          echo "SSH_EXIT=$?" >> "$RUNNER_TEMP/target.log"
          exit 0

      - name: Commit sanitized target report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          {
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E '^(TARGET_FOUND|TARGET_DC|TARGET_DB_STATUS|TARGET_DELIVERED|TARGET_IP_PRESENT|TARGET_QUALITY_ATTEMPTS|TARGET_QUALITY_CHECKED_BEFORE|TARGET_PASSWORD_SECRET|TARGET_SECRET_DECRYPT|TARGET_PROVIDER_STATE|TARGET_PROVIDER_IP_PRESENT|TARGET_LOCAL_SSH|TARGET_QUALITY_OK|TARGET_QUALITY_CHECKED|TARGET_QUALITY_DEFINITIVE|TARGET_QUALITY_REASON|TARGET_QUALITY_IR|TARGET_QUALITY_GLOBAL|TARGET_DIAGNOSIS|TARGET_QUERY|SSH_EXIT)=' "$RUNNER_TEMP/target.log" || true
          } > ops/target-Srv-HET-470171.txt
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add ops/target-Srv-HET-470171.txt
          git commit -m 'ops(hetzner): record sanitized Srv-HET-470171 state'
          git push origin HEAD:main
