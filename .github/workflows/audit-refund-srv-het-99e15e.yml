name: Audit refund Srv-HET-99e15e

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-refund-srv-het-99e15e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Audit target server billing
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const serverName = 'Srv-HET-99e15e';
          (async () => {
            const c = await mysql.createConnection({
              host: process.env.DB_HOST || '127.0.0.1',
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME || 'hamooncloud_db'
            });
            try {
              const [purchases] = await c.execute(
                `SELECT telegram_id, server_id, server_name, datacenter, status, amount, duration, auto_renew, created_at, last_billed_at
                 FROM purchases
                 WHERE server_name = ?
                 ORDER BY created_at DESC`,
                [serverName]
              );
              console.log('PURCHASE_COUNT=' + purchases.length);
              if (!purchases.length) throw new Error('TARGET_SERVER_NOT_FOUND');

              for (const [idx,p] of purchases.entries()) {
                const telegramId = String(p.telegram_id);
                const serverId = String(p.server_id);
                const [[u]] = await c.execute('SELECT wallet FROM users WHERE telegram_id=? LIMIT 1',[telegramId]);
                const [traffic] = await c.execute(
                  `SELECT server_id, period_start, billed_overage_bytes, billed_amount_toman, last_outgoing_bytes, included_traffic_bytes, price_per_tb, created_at, updated_at
                   FROM hetzner_traffic_billing
                   WHERE server_id=?
                   ORDER BY period_start DESC LIMIT 6`,
                  [serverId]
                );
                const [logs] = await c.execute(
                  `SELECT id, amount, description, type, timestamp
                   FROM wallet_logs
                   WHERE telegram_id=? AND (type='hetzner_traffic_overage' OR description LIKE ?)
                   ORDER BY timestamp DESC, id DESC LIMIT 30`,
                  [telegramId, `%${serverName}%`]
                );
                const [events] = await c.execute(
                  `SELECT id,event_key,event_type,amount_toman,period_start,period_end,metadata,created_at
                   FROM billing_events
                   WHERE server_id=? AND event_type='hetzner_traffic_overage'
                   ORDER BY created_at DESC LIMIT 30`,
                  [serverId]
                );
                const [refunds] = await c.execute(
                  `SELECT id,amount,description,type,timestamp
                   FROM wallet_logs
                   WHERE telegram_id=? AND type IN ('hetzner_traffic_refund','admin_refund','refund') AND description LIKE ?
                   ORDER BY timestamp DESC,id DESC LIMIT 20`,
                  [telegramId, `%${serverName}%`]
                );

                console.log(`TARGET_${idx+1}_SERVER_ID=${serverId}`);
                console.log(`TARGET_${idx+1}_STATUS=${p.status}`);
                console.log(`TARGET_${idx+1}_DATACENTER=${p.datacenter}`);
                console.log(`TARGET_${idx+1}_CYCLE=${p.duration}`);
                console.log(`TARGET_${idx+1}_BASE_AMOUNT=${Number(p.amount||0)}`);
                console.log(`TARGET_${idx+1}_WALLET=${Number(u?.wallet||0)}`);
                console.log(`TARGET_${idx+1}_TRAFFIC_ROWS=${JSON.stringify(traffic)}`);
                console.log(`TARGET_${idx+1}_OVERAGE_LOGS=${JSON.stringify(logs)}`);
                console.log(`TARGET_${idx+1}_OVERAGE_EVENTS=${JSON.stringify(events)}`);
                console.log(`TARGET_${idx+1}_EXISTING_REFUNDS=${JSON.stringify(refunds)}`);
              }
            } finally {
              await c.end();
            }
          })().catch(e => { console.error('AUDIT_FAILED=' + String(e.code || e.message)); process.exit(1); });
          NODE
          REMOTE

      - name: Audit completed
        run: echo 'Production refund audit completed.'
