name: Safe clean-IP rotate Srv-FIN-97c297

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rotate-fin-97c297-clean-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Transactional clean IPv4 rotation
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const dcs = require('./datacenters');
          const cloud = require('./cloud-api');
          const hz = require('./Hetzner/hetzner-api');
          const db = require('./db');
          const lifecycle = require('./services/hetzner-lifecycle');
          const base = require('./services/hetzner-change-ip');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const TARGET = 'Srv-FIN-97c297';
          const MAX = 12;

          async function waitAction(dc, action) {
            const id = action?.id || action?.action?.id;
            if (id) await cloud.waitHetznerAction(dc, id, 180000);
          }
          async function rawServer(dc, id) {
            return (await hz.hetznerRequest(dc, 'GET', `/servers/${id}`)).server;
          }
          async function gracefulOff(dc, id) {
            let s = await rawServer(dc, id);
            if (String(s?.status || '').toLowerCase() === 'off') return;
            const out = await hz.hetznerRequest(dc, 'POST', `/servers/${id}/actions/shutdown`, {});
            await waitAction(dc, out?.action);
            for (let i=0; i<30; i++) {
              await sleep(2500);
              s = await rawServer(dc, id);
              if (String(s?.status || '').toLowerCase() === 'off') return;
            }
            throw new Error('SAFE_SHUTDOWN_TIMEOUT');
          }
          async function powerOn(dc, id) {
            const a = await cloud.powerOnHetznerServer(dc, id);
            await waitAction(dc, a);
          }
          async function waitReady(dc, id, expectedIp) {
            for (let i=0; i<40; i++) {
              await sleep(2500);
              const s = await rawServer(dc, id);
              const ip = s?.public_net?.ipv4?.ip || null;
              if (String(s?.status || '').toLowerCase() === 'running' && String(ip || '') === String(expectedIp)) {
                const ok = await lifecycle.waitTcp22(expectedIp, 45000);
                if (ok) return s;
              }
            }
            throw new Error('CANDIDATE_NOT_SSH_READY');
          }
          async function probe(ip) {
            let last = null;
            for (let n=1; n<=3; n++) {
              last = await lifecycle.checkIpQuality(ip);
              console.log('QUALITY=' + JSON.stringify({ip, probe:n, ok:!!last?.ok, definitive:!!last?.definitive, summary:lifecycle.qualitySummary(last)}));
              if (last?.ok || last?.definitive) return last;
              await sleep(1800);
            }
            return last;
          }
          async function restoreOld(dc, id, oldPrimaryId, oldIp, candidate) {
            console.log('ROLLBACK_START=' + JSON.stringify({old_ip:oldIp,candidate_ip:candidate?.ip||null}));
            await gracefulOff(dc, id);
            if (candidate?.id) await waitAction(dc, await cloud.unassignPrimaryIp(dc, null, candidate.id)).catch(() => {});
            await waitAction(dc, await cloud.assignPrimaryIp(dc, null, oldPrimaryId, id));
            await powerOn(dc, id);
            await waitReady(dc, id, oldIp);
            if (candidate?.id) await cloud.deletePrimaryIp(dc, null, candidate.id).catch(() => {});
            console.log('ROLLBACK_OK=' + oldIp);
          }

          (async()=>{
            const conn = await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let p;
            try {
              [[p]] = await conn.execute(`SELECT server_id,telegram_id,datacenter,server_name,public_ip,status,deleted_at FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`, [TARGET]);
            } finally { await conn.end(); }
            if (!p || p.deleted_at) throw new Error('TARGET_NOT_ACTIVE');
            const dc = dcs[p.datacenter];
            if (!dc) throw new Error('DATACENTER_NOT_FOUND');

            let current = await rawServer(dc, p.server_id);
            let oldPrimaryId = current?.public_net?.ipv4?.id ? String(current.public_net.ipv4.id) : null;
            let oldIp = current?.public_net?.ipv4?.ip || p.public_ip || null;
            if (!oldPrimaryId || !oldIp) throw new Error('CURRENT_IPV4_MISSING');
            console.log('START=' + JSON.stringify({server_id:String(p.server_id),old_primary_id:oldPrimaryId,old_ip:oldIp,status:current?.status||null}));

            const location = current?.datacenter?.location?.name || current?.location?.name || dc.HETZNER_LOCATION || dc.location || null;
            for (let attempt=1; attempt<=MAX; attempt++) {
              let candidate = null;
              try {
                candidate = await base.reserveUniquePrimaryIpv4(db, {dc, telegramId:String(p.telegram_id), datacenter:String(p.datacenter), serverId:String(p.server_id), location, oldIp});
                console.log('CANDIDATE=' + JSON.stringify({attempt,id:String(candidate.id),ip:candidate.ip}));

                await gracefulOff(dc, p.server_id);
                await waitAction(dc, await cloud.unassignPrimaryIp(dc, null, oldPrimaryId));
                await waitAction(dc, await cloud.assignPrimaryIp(dc, null, candidate.id, p.server_id));
                await powerOn(dc, p.server_id);
                await waitReady(dc, p.server_id, candidate.ip);

                const quality = await probe(candidate.ip);
                if (quality?.ok) {
                  await db.updatePublicIp(String(p.telegram_id), String(p.server_id), String(p.datacenter), String(candidate.ip));
                  await base.rememberIp(db, {telegramId:String(p.telegram_id),datacenter:String(p.datacenter),serverId:String(p.server_id),ip:String(candidate.ip),event:'clean_ip_verified'}).catch(()=>{});
                  await cloud.deletePrimaryIp(dc, null, oldPrimaryId);
                  console.log('CLEAN_SUCCESS=' + JSON.stringify({attempt,old_ip:oldIp,new_ip:candidate.ip,quality:lifecycle.qualitySummary(quality)}));
                  return;
                }

                await base.rememberIp(db, {telegramId:String(p.telegram_id),datacenter:String(p.datacenter),serverId:String(p.server_id),ip:String(candidate.ip),event:quality?.definitive?'clean_ip_rejected':'clean_ip_unverified'}).catch(()=>{});
                await restoreOld(dc, p.server_id, oldPrimaryId, oldIp, candidate);
                if (!quality?.definitive) throw Object.assign(new Error('IP_QUALITY_CHECK_UNAVAILABLE'), {code:'IP_QUALITY_CHECK_UNAVAILABLE'});
              } catch (e) {
                const now = await rawServer(dc, p.server_id).catch(()=>null);
                const nowIp = now?.public_net?.ipv4?.ip || null;
                if (nowIp !== oldIp && candidate?.id) {
                  try { await restoreOld(dc, p.server_id, oldPrimaryId, oldIp, candidate); } catch (rb) { console.error('ROLLBACK_FATAL=' + String(rb?.message||rb)); throw rb; }
                } else if (candidate?.id && nowIp === oldIp) {
                  await cloud.deletePrimaryIp(dc, null, candidate.id).catch(()=>{});
                }
                if (e?.code === 'IP_QUALITY_CHECK_UNAVAILABLE') throw e;
                console.log('ATTEMPT_FAILED=' + JSON.stringify({attempt,error:String(e?.message||e)}));
              }
            }
            throw new Error('NO_CLEAN_IPV4_AVAILABLE');
          })().catch(e=>{ console.error('ROTATE_FATAL=' + String(e?.code||e?.message||e)); process.exitCode=1; }).finally(async()=>{try{await db.pool.end();}catch{}});
          NODE
          REMOTE
