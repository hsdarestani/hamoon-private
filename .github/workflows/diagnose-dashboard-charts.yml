name: Diagnose Dashboard Charts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-dashboard-charts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Audit production dashboard configuration
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== VERSION ==='
          git rev-parse --short HEAD
          node <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const datacenters = require('./datacenters');
          (async () => {
            console.log('SERVER_SECRET_KEY_CONFIGURED', Boolean(process.env.SERVER_SECRET_KEY));
            const [exists] = await db.pool.query("SELECT COUNT(*) count FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='server_secrets'");
            let secretRows = 0;
            if (Number(exists[0]?.count || 0) > 0) {
              const [rows] = await db.pool.query('SELECT COUNT(*) count FROM server_secrets');
              secretRows = Number(rows[0]?.count || 0);
            }
            console.log('SERVER_SECRETS_ROWS', secretRows);
            const traffic = Object.values(datacenters).filter(dc => dc && dc.key).map(dc => ({ key: dc.key, configured: Boolean(dc.TRAFFIC_API_BASE_URL) }));
            console.log('TRAFFIC_SUPPORT', JSON.stringify(traffic));
            await db.pool.end();
          })().catch(error => { console.error(error.code || error.message); process.exit(1); });
          NODE
          REMOTE
