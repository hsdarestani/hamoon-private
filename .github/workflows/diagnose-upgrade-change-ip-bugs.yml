name: Diagnose Upgrade and Change IP Bugs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-upgrade-change-ip-bugs.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect exact incidents
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          OUT="$HOME/.pm2/logs/hamoonbot-out.log"
          ERR="$HOME/.pm2/logs/hamoonbot-error.log"
          echo '=== UPGRADE FAILURE CONTEXT ==='
          for f in "$OUT" "$ERR"; do
            [ -f "$f" ] || continue
            grep -n -B 3 -A 12 "\[HETZNER_UPGRADE\]" "$f" | tail -n 450 || true
          done
          echo '=== REPORTED IP CONTEXT 5.75.195.244 ==='
          for f in "$OUT" "$ERR" server_events.log; do
            [ -f "$f" ] || continue
            grep -n -B 12 -A 18 '5\.75\.195\.244' "$f" | tail -n 300 || true
          done
          echo '=== RECENT CHANGE IP ERRORS WITH IDs ==='
          for f in "$OUT" "$ERR"; do
            [ -f "$f" ] || continue
            grep -n -B 2 -A 14 -E 'HETZNER_CHANGE_IP\]|HETZNER_CHANGE_IP_ROLLBACK_FAILED|IP_QUALITY_CHECK_UNAVAILABLE' "$f" | tail -n 500 || true
          done
          echo '=== PURCHASE MATCH FOR REPORTED IP ==='
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          (async()=>{const c=await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
          const [r]=await c.execute("SELECT telegram_id,server_id,server_name,datacenter,flavor_id,status,public_ip,updated_at FROM purchases WHERE public_ip=? ORDER BY updated_at DESC",['5.75.195.244']);
          r.forEach(x=>console.log(JSON.stringify(x)));
          await c.end();})().catch(e=>{console.error('DB',e.code||e.message);process.exitCode=1});
          NODE
          REMOTE
