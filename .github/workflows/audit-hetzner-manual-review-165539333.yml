name: Audit Hetzner manual review 165539333

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-hetzner-manual-review-165539333.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect production state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const db = require('./db');
          (async()=>{
            const c=await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
            try {
              const [rows]=await c.execute(`SELECT telegram_id,server_id,server_name,datacenter,status,delivered_at,ip_quality_attempts,public_ip,created_at,updated_at FROM purchases WHERE telegram_id=? AND server_id=? LIMIT 1`,['7293732698','165539333']);
              console.log('PURCHASE='+JSON.stringify(rows[0]||null));
              const [secrets]=await c.execute(`SELECT id,secret_type,created_at,updated_at FROM server_secrets WHERE server_id=?`,['165539333']);
              console.log('SECRET_ROWS='+JSON.stringify(secrets));
              let decrypt='none';
              if(secrets.some(s=>s.secret_type==='root_password')){
                try { const v=await db.getServerSecret('165539333','root_password'); decrypt=v?'ok':'empty'; } catch(e){ decrypt='error:'+String(e.code||e.message).slice(0,80); }
              }
              console.log('ROOT_PASSWORD_DECRYPT='+decrypt);
              const [events]=await c.execute(`SELECT id,event_type,amount_toman,created_at,metadata FROM billing_events WHERE server_id=? ORDER BY created_at DESC LIMIT 10`,['165539333']);
              console.log('EVENTS='+JSON.stringify(events));
            } finally { await c.end(); await db.pool.end().catch(()=>{}); }
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e.code||e.message));process.exit(1)});
          NODE
          REMOTE
      - name: Done
        run: echo 'audit done'
