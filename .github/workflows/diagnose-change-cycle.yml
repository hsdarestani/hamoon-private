name: Diagnose Billing Cycle Change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-change-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect live Telegram and cycle errors
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== LIVE COMMIT ==='
          git rev-parse HEAD
          git log -1 --oneline
          echo '=== BILLING FAILURE CONTEXT ==='
          pm2 logs hamoonbot --lines 5000 --nostream 2>/dev/null \
            | grep -A 8 -B 1 -E "\[BILLING_CYCLE_CHANGE_FAILED\]|\[BILLING_CYCLE_LIVE_PRICE_FALLBACK\]" \
            | tail -n 320 || true
          echo '=== RELATED TELEGRAM ERRORS ==='
          pm2 logs hamoonbot --lines 2500 --nostream 2>/dev/null \
            | grep -Ei "Error sending message|Telegram API Error Body|parse entities|reserved|can't parse|cannot parse" \
            | tail -n 120 || true
          echo '=== END ==='
          REMOTE
