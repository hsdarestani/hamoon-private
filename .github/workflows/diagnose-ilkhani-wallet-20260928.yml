name: Diagnose Ilkhani Wallet 2026-09-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ilkhani-wallet-20260928.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect reported payments
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          (async()=>{
            const conn=await db.pool.getConnection();
            try{
              const [z]=await conn.query(
                "SELECT track_id,order_id,telegram_id,amount_toman,paid_rial,credited,created_at,updated_at FROM zibal_payments WHERE track_id IN ('4814456091','4814436321') ORDER BY created_at"
              );
              console.log('ZIBAL='+JSON.stringify(z));
              const tids=[...new Set(z.map(x=>String(x.telegram_id)))];
              for(const tid of tids){
                const [[u]]=await conn.query("SELECT telegram_id,wallet,created_at,updated_at FROM users WHERE telegram_id=?",[tid]);
                const [logs]=await conn.query("SELECT id,amount,type,description,timestamp FROM wallet_logs WHERE telegram_id=? ORDER BY timestamp DESC,id DESC LIMIT 20",[tid]);
                const [p]=await conn.query("SELECT server_id,server_name,datacenter,status,duration,amount,created_at,updated_at FROM purchases WHERE telegram_id=? ORDER BY created_at DESC LIMIT 20",[tid]);
                let refunds=[];
                try{ [refunds]=await conn.query("SELECT * FROM zibal_rounding_refunds WHERE telegram_id=? OR track_id IN ('4814456091','4814436321') ORDER BY created_at",[tid]); }catch(e){}
                console.log('USER='+JSON.stringify(u||null));
                console.log('LOGS='+JSON.stringify(logs));
                console.log('PURCHASES='+JSON.stringify(p));
                console.log('REFUNDS='+JSON.stringify(refunds));
              }
            }finally{conn.release();await db.pool.end();}
          })().catch(async e=>{console.error('DIAG='+JSON.stringify({message:e.message,code:e.code}));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
