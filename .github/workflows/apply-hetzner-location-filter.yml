name: Apply Hetzner Location Filter

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-hetzner-location-filter.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Hetzner catalog filtering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('Hetzner/hetzner-api.js')
          text = api.read_text()

          old = '''function firstPrice(serverType, config = {}) {
            const prices = Array.isArray(serverType?.prices) ? serverType.prices : [];
            const usable = prices.filter(p => p?.price_hourly || p?.price_monthly);
            for (const location of configuredPriceLocations(config)) {
              const match = usable.find(p => normalizeLocation(p?.location) === location);
              if (match) return match;
            }
            return usable[0] || prices[0] || {};
          }
          '''
          new = '''function hasConfiguredLocationPrice(serverType, config = {}) {
            const locations = configuredPriceLocations(config);
            if (!locations.length) return true;
            const prices = Array.isArray(serverType?.prices) ? serverType.prices : [];
            return prices.some(p =>
              (p?.price_hourly || p?.price_monthly) &&
              locations.includes(normalizeLocation(p?.location))
            );
          }

          function firstPrice(serverType, config = {}) {
            const prices = Array.isArray(serverType?.prices) ? serverType.prices : [];
            const usable = prices.filter(p => p?.price_hourly || p?.price_monthly);
            const locations = configuredPriceLocations(config);
            for (const location of locations) {
              const match = usable.find(p => normalizeLocation(p?.location) === location);
              if (match) return match;
            }
            // A location-scoped catalog must never borrow the price of a different region.
            if (locations.length) return {};
            return usable[0] || prices[0] || {};
          }
          '''
          if old not in text:
              raise SystemExit('firstPrice source block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          old_filter = ".filter(st => st && st.name && !st.deprecated && st.deprecation === null)"
          new_filter = ".filter(st => st && st.name && !st.deprecated && st.deprecation === null && hasConfiguredLocationPrice(st, config))"
          if old_filter not in text:
              raise SystemExit('normalize filter source not found; refusing unsafe patch')
          text = text.replace(old_filter, new_filter, 1)
          api.write_text(text)

          test = Path('scripts/validate-hetzner-pricing.js')
          t = test.read_text()
          needle = "assert.notStrictEqual(\n  api.hetznerPlanCacheKey({ key: 'hetzner', HETZNER_LOCATION: 'nbg1' }),\n  api.hetznerPlanCacheKey({ key: 'hetzner-finland', HETZNER_LOCATION: 'hel1' })\n);\n"
          addition = needle + "\nconst regionalAvailabilitySample = [\n  {\n    name: 'cpx11', cores: 2, memory: 2, disk: 40, deprecated: false, deprecation: null,\n    prices: [{ location: 'ash', price_hourly: { gross: '0.0100' }, price_monthly: { gross: '5.00' } }],\n  },\n  {\n    name: 'cpx12', cores: 2, memory: 2, disk: 40, deprecated: false, deprecation: null,\n    prices: [{ location: 'hel1', price_hourly: { gross: '0.0120' }, price_monthly: { gross: '6.00' } }],\n  },\n];\nconst finlandAvailable = api.normalizeHetznerServerTypes(regionalAvailabilitySample, { key: 'hetzner-finland', HETZNER_LOCATION: 'hel1' });\nassert(!finlandAvailable.some(p => p.id === 'cpx11'), 'CPX11 without HEL1 pricing must not be offered in Finland');\nassert(finlandAvailable.some(p => p.id === 'cpx12'), 'CPX12 with HEL1 pricing should remain available in Finland');\n"
          if needle not in t:
              raise SystemExit('pricing validator insertion point not found')
          t = t.replace(needle, addition, 1)
          test.write_text(t)
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node -c Hetzner/hetzner-api.js
          npm run validate:hetzner-pricing

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Hetzner/hetzner-api.js scripts/validate-hetzner-pricing.js
          if git diff --cached --quiet; then
            echo 'Patch already present; nothing to commit.'
          else
            git commit -m 'fix(hetzner): filter plans by selected location'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git pull --ff-only origin main
          node -c Hetzner/hetzner-api.js
          npm run validate:hetzner-pricing
          pm2 restart hamoonbot --update-env
          sleep 3
          pm2 show hamoonbot --no-color | sed -n '1,35p'
          echo '=== LIVE FINLAND CATALOG CHECK ==='
          node - <<'NODE'
          const dcs = require('./datacenters');
          const api = require('./Hetzner/hetzner-api');
          (async () => {
            const plans = await api.getHetznerSellablePlans(dcs['hetzner-finland']);
            const ids = plans.map(p => p.id);
            console.log('CPX11_VISIBLE=' + ids.includes('cpx11'));
            console.log('CPX12_VISIBLE=' + ids.includes('cpx12'));
            console.log('FIRST_PLANS=' + ids.slice(0, 20).join(','));
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE
          REMOTE
