name: Deploy Minute Renewal Tick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-minute-renewal-tick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate source patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-minute-renewal-tick.js
          node --check billing-renewal-tick-bootstrap.js
          node --check runtime-bootstrap.js
          node - <<'NODE'
          const fs=require('fs');
          const runtime=require('./runtime-bootstrap');
          const out=runtime.applyPatches(fs.readFileSync('index-core.js','utf8'));
          if (!out.includes('HAMOON_MINUTE_RENEWAL_TICK_V1')) throw new Error('minute renewal patch not present in compiled core');
          if (!out.includes('settleServerRenewalAtomic')) throw new Error('atomic renewal binding missing');
          console.log('MINUTE_RENEWAL_PATCH_OK');
          NODE

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add runtime-bootstrap.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(billing): renew due servers every minute'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          node --check billing-renewal-tick-bootstrap.js
          node --check runtime-bootstrap.js
          node - <<'NODE'
          const fs=require('fs');
          const runtime=require('./runtime-bootstrap');
          const out=runtime.applyPatches(fs.readFileSync('index-core.js','utf8'));
          if (!out.includes('HAMOON_MINUTE_RENEWAL_TICK_V1')) throw new Error('production compiled core missing minute renewal tick');
          console.log('PROD_MINUTE_RENEWAL_PATCH_OK');
          NODE
          pm2 restart hamoonbot --update-env >/dev/null
          sleep 6
          STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$STATUS"
          test "$STATUS" = online

          echo '=== TARGETS BEFORE TICK ==='
          node - <<'NODE'
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.execute(`SELECT server_id,server_name,status,duration,amount,auto_renew,last_billed_at,DATE_ADD(last_billed_at, INTERVAL 1 HOUR) AS hourly_due_at FROM purchases WHERE server_name IN ('camcam','Vestaland') ORDER BY server_name`);
            for(const r of rows) console.log(JSON.stringify(r));
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          # Let the new minute cron cross at least one minute boundary.
          sleep 75

          echo '=== TARGETS AFTER TICK ==='
          node - <<'NODE'
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.execute(`SELECT server_id,server_name,status,duration,amount,auto_renew,last_billed_at,DATE_ADD(last_billed_at, INTERVAL 1 HOUR) AS hourly_due_at FROM purchases WHERE server_name IN ('camcam','Vestaland') ORDER BY server_name`);
            for(const r of rows) console.log(JSON.stringify(r));
            const [events]=await db.pool.execute(`SELECT server_id,event_type,amount_toman,period_start,period_end,created_at FROM billing_events WHERE server_id IN (SELECT server_id FROM purchases WHERE server_name IN ('camcam','Vestaland')) AND event_type='renewal' ORDER BY created_at DESC LIMIT 6`);
            console.log('RECENT_RENEWAL_EVENTS='+JSON.stringify(events));
            process.exit(0);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          echo '=== MINUTE RENEWAL LOGS ==='
          pm2 logs hamoonbot --lines 250 --nostream 2>&1 | grep -E 'MINUTE_RENEWAL|ATOMIC_RENEWAL' | tail -n 100 || true
          REMOTE
