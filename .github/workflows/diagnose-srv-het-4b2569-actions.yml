name: Diagnose Srv HET 4b2569 Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-srv-het-4b2569-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect provider action history and billing history
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          const SERVER_ID='166087176';
          const USER_ID='7293732698';
          (async()=>{
            const dc={...dcs.hetzner,key:'hetzner'};
            const data=await hetzner.hetznerRequest(dc,'GET',`/servers/${SERVER_ID}/actions?sort=id:desc&per_page=50`);
            const actions=(data.actions||[]).map(a=>({
              id:a.id,
              command:a.command,
              status:a.status,
              started:a.started,
              finished:a.finished,
              error:a.error||null
            }));
            console.log('ACTIONS='+JSON.stringify(actions));

            const [wallet]=await db.pool.query(
              `SELECT amount,description,type,created_at
                 FROM wallet_logs
                WHERE telegram_id=?
                  AND (description LIKE '%Srv-HET-4b2569%' OR description LIKE '%166087176%')
                ORDER BY created_at DESC
                LIMIT 50`,
              [USER_ID]
            );
            console.log('WALLET_LOGS='+JSON.stringify(wallet));

            const [audit]=await db.pool.query(
              `SELECT actor,action,target_type,target_id,result,metadata,created_at
                 FROM admin_audit_logs
                WHERE target_id=? OR metadata LIKE ?
                ORDER BY created_at DESC
                LIMIT 50`,
              [SERVER_ID,'%166087176%']
            ).catch(()=>[[]]);
            console.log('ADMIN_AUDIT='+JSON.stringify(audit));

            const [p]=await db.pool.query(
              `SELECT server_id,server_name,status,provider_status,duration,amount,auto_renew,
                      auto_renew_disabled_at,renewal_stopped_at,suspend_reason,
                      last_billed_at,updated_at,lifecycle_updated_at
                 FROM purchases WHERE server_id=? LIMIT 1`,
              [SERVER_ID]
            );
            console.log('PURCHASE_NOW='+JSON.stringify(p[0]||null));
            await db.pool.end();
          })().catch(async e=>{console.error('DIAG_FAILED='+String(e?.stack||e));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
