name: Deploy Hamoon Loyalty Club

on:
  push:
    branches: [main]
    paths:
      - 'services/loyalty-club.js'
      - 'loyalty-club-bootstrap.js'
      - 'loyalty-history-bootstrap.js'
      - 'runtime-bootstrap.js'
      - 'server-power-controls-bootstrap.js'
      - 'server-deletion-consistency-bootstrap.js'
      - 'scripts/ops-server-by-owner-ip.js'
      - 'server.js'
      - 'public/club/**'
      - '.env.example'
      - '.github/workflows/deploy-loyalty-club.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-loyalty-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate loyalty source, bot patch and public guide
        shell: bash
        run: |
          set -euo pipefail
          node --check services/loyalty-club.js
          node --check loyalty-club-bootstrap.js
          node --check loyalty-history-bootstrap.js
          node --check server-power-controls-bootstrap.js
          node --check server-deletion-consistency-bootstrap.js
          node --check scripts/ops-server-by-owner-ip.js
          node --check runtime-bootstrap.js
          node --check server.js
          grep -q 'باشگاه هامون' public/club/index.html
          grep -q '۱٬۰۰۰ تومان' public/club/index.html
          grep -q '۳۰٪' public/club/index.html
          node <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const output = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          const required = [
            "require('./services/loyalty-club')",
            "'🏆 باشگاه هامون'",
            "case '🏆 باشگاه هامون'",
            "case 'LOYALTY_REFRESH'",
            "getRedemptionPreview(userId, finalPrice)",
            "consumeCredit({",
            "recordEligibleSpend({",
            "eventKey: `renewal:",
            "syncHistory(userId)",
            "ℹ️ قوانین و نحوه کار",
            "text: '▶️ روشن کردن'",
            "text: '🔄 ریبوت سرور'",
            "case 'REBOOT':"
          ];
          for (const marker of required) {
            if (!output.includes(marker)) throw new Error('Missing runtime marker: ' + marker);
          }
          new Function('require', 'module', 'exports', '__filename', '__dirname', output);
          console.log('loyalty_runtime_patch_ok=true');
          NODE

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production bot and repair reported incidents
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=50 "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          ENV_BACKUP="$(mktemp)"
          if [ -f .env ]; then cp .env "$ENV_BACKUP"; fi
          cleanup() { rm -f "$ENV_BACKUP"; }
          trap cleanup EXIT

          git checkout -- .env .env.save 2>/dev/null || true
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -s "$ENV_BACKUP" ]; then cp "$ENV_BACKUP" .env; chmod 600 .env || true; fi

          node --check services/loyalty-club.js
          node --check loyalty-club-bootstrap.js
          node --check loyalty-history-bootstrap.js
          node --check server-power-controls-bootstrap.js
          node --check server-deletion-consistency-bootstrap.js
          node --check scripts/ops-server-by-owner-ip.js
          node --check runtime-bootstrap.js
          node --check server.js
          grep -q 'باشگاه هامون' public/club/index.html
          node <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const output = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          for (const marker of [
            "'🏆 باشگاه هامون'",
            "case 'LOYALTY_REFRESH'",
            "getRedemptionPreview(userId, finalPrice)",
            "consumeCredit({",
            "eventKey: `renewal:",
            "syncHistory(userId)",
            "text: '▶️ روشن کردن'",
            "text: '🔄 ریبوت سرور'",
            "case 'REBOOT':"
          ]) {
            if (!output.includes(marker)) throw new Error('Production runtime patch missing: ' + marker);
          }
          new Function('require', 'module', 'exports', '__filename', '__dirname', output);
          console.log('production_runtime_patch_ok=true');
          NODE

          pm2 restart hamoonbot --update-env
          pm2 restart dashboard-server --update-env
          sleep 5

          pm2 pid hamoonbot | grep -Eq '^[1-9][0-9]*$'
          pm2 pid dashboard-server | grep -Eq '^[1-9][0-9]*$'
          curl -fsS --max-time 10 http://127.0.0.1:3000/health | grep -q '"ok":true'

          echo '=== REPORTED INCIDENT: POWER ON 1144186664 / 5.75.202.189 ==='
          node scripts/ops-server-by-owner-ip.js power-on 1144186664 5.75.202.189

          echo '=== REPORTED INCIDENT: CHANGE IP 1301377458 / 91.107.149.82 ==='
          if timeout 1500 node scripts/ops-server-by-owner-ip.js change-ip 1301377458 91.107.149.82; then
            echo 'REPORTED_CHANGE_IP_RETRY=success'
          else
            echo 'REPORTED_CHANGE_IP_RETRY=not_resolved'
          fi

          public_club_code="$(curl -kLsS --max-time 15 -o /tmp/hamoon-club-public -w '%{http_code}' https://pay.hamooncloud.ir/club || true)"
          echo "public /club -> HTTP ${public_club_code:-000}"
          test "$public_club_code" = '200'
          grep -q 'باشگاه هامون' /tmp/hamoon-club-public
          rm -f /tmp/hamoon-club-public

          echo 'incident_repair_deploy_ok=true'
          REMOTE