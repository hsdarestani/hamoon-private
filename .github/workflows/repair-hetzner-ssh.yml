name: Repair Hetzner SSH

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-hetzner-ssh.js'
      - 'scripts/notify-ssh-repair.js'
      - '.github/workflows/repair-hetzner-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-repair-hetzner-ssh
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
      TARGET_IP: 91.107.245.81
    steps:
      - uses: actions/checkout@v4

      - name: Validate repair utilities
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/repair-hetzner-ssh.js
          node --check scripts/notify-ssh-repair.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Repair target server SSH and notify customer
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          TARGET_IP_B64="$(printf '%s' "$TARGET_IP" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' TARGET_IP_B64='$TARGET_IP_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          TARGET_IP="$(printf '%s' "$TARGET_IP_B64" | base64 -d)"
          cd "$APP_PATH"

          ENV_BACKUP="$(mktemp)"
          if [ -f .env ]; then cp .env "$ENV_BACKUP"; fi
          cleanup() { rm -f "$ENV_BACKUP"; }
          trap cleanup EXIT

          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -s "$ENV_BACKUP" ]; then
            cp "$ENV_BACKUP" .env
            chmod 600 .env || true
          fi

          node --check scripts/repair-hetzner-ssh.js
          node --check scripts/notify-ssh-repair.js
          node scripts/repair-hetzner-ssh.js "$TARGET_IP"
          node scripts/notify-ssh-repair.js "$TARGET_IP"
          REMOTE
