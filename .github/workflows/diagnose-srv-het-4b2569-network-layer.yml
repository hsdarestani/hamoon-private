name: Diagnose Srv HET 4b2569 Network Layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-srv-het-4b2569-network-layer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect Hetzner network layer
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const dcs=require('./datacenters');
          const h=require('./Hetzner/hetzner-api');
          const sid='166087176';
          (async()=>{
            const dc={...dcs.hetzner,key:'hetzner'};
            const raw=await h.hetznerRequest(dc,'GET',`/servers/${sid}`);
            const s=raw.server||{};
            console.log('SERVER='+JSON.stringify({
              id:s.id,name:s.name,status:s.status,locked:s.locked,rescue_enabled:s.rescue_enabled,
              datacenter:s.datacenter,public_net:s.public_net,private_net:s.private_net,
              protection:s.protection
            }));

            const primaryId=s?.public_net?.ipv4?.id;
            if(primaryId){
              const p=await h.hetznerRequest(dc,'GET',`/primary_ips/${primaryId}`);
              console.log('PRIMARY_IP='+JSON.stringify(p.primary_ip||null));
            }

            const fw=await h.hetznerRequest(dc,'GET','/firewalls?per_page=200');
            const linked=(fw.firewalls||[]).filter(f =>
              (f.applied_to||[]).some(a =>
                String(a?.server?.id||a?.applied_to_resources?.[0]?.server?.id||'')===sid
              )
            );
            console.log('LINKED_FIREWALLS='+JSON.stringify(linked.map(f=>({
              id:f.id,name:f.name,rules:f.rules,applied_to:f.applied_to
            }))));

            const nets=await h.hetznerRequest(dc,'GET','/networks?per_page=200');
            const linkedNetworks=(nets.networks||[]).filter(n =>
              (n.servers||[]).map(String).includes(sid)
            );
            console.log('LINKED_NETWORKS='+JSON.stringify(linkedNetworks.map(n=>({
              id:n.id,name:n.name,ip_range:n.ip_range,subnets:n.subnets,routes:n.routes
            }))));
          })().catch(e=>{console.error('DIAG_FAILED='+String(e?.stack||e));process.exit(1)});
          NODE
          REMOTE
