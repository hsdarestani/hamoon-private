name: Restore IPv4 Srv-FIN-97c297 safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-fin-97c297-ipv4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Create and attach missing IPv4 without touching disk
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const dcs=require('./datacenters');
          const cloud=require('./cloud-api');
          const hz=require('./Hetzner/hetzner-api');
          const db=require('./db');
          const { rememberIp }=require('./services/hetzner-change-ip');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let p;
            try {
              [[p]]=await conn.execute(`SELECT server_id,telegram_id,datacenter,server_name,public_ip,status,deleted_at FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,['Srv-FIN-97c297']);
            } finally { await conn.end(); }
            if(!p||p.deleted_at) throw new Error('TARGET_PURCHASE_NOT_ACTIVE');
            const dc=dcs[p.datacenter];
            if(!dc) throw new Error('DATACENTER_CONFIG_NOT_FOUND');
            let raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
            console.log('BEFORE='+JSON.stringify({server_id:String(p.server_id),status:raw?.status||null,ipv4:raw?.public_net?.ipv4?.ip||null,db_ip:p.public_ip||null}));

            if(raw?.public_net?.ipv4?.ip){
              const ip=String(raw.public_net.ipv4.ip);
              await db.updatePublicIp(String(p.telegram_id),String(p.server_id),String(p.datacenter),ip);
              console.log('RESULT=ipv4_already_present synced_db='+ip);
              return;
            }

            // Graceful shutdown first; no rebuild/reset/reinstall/delete-disk action.
            if(String(raw?.status||'').toLowerCase()==='running'){
              const shut=await hz.hetznerRequest(dc,'POST',`/servers/${p.server_id}/actions/shutdown`,{});
              if(shut?.action?.id) await cloud.waitHetznerAction(dc,shut.action.id,180000);
              for(let i=0;i<24;i++){
                await sleep(3000);
                raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
                const st=String(raw?.status||'').toLowerCase();
                console.log('SHUTDOWN_POLL='+JSON.stringify({attempt:i+1,status:st}));
                if(st==='off') break;
              }
            }

            raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
            if(String(raw?.status||'').toLowerCase()!=='off') throw new Error('SAFE_SHUTDOWN_DID_NOT_REACH_OFF');

            let created=null;
            try {
              created=await cloud.createPrimaryIpv4(dc,null,dc.HETZNER_LOCATION||dc.location||null);
              if(!created?.id||!created?.ip) throw new Error('NEW_PRIMARY_IPV4_INVALID');
              console.log('NEW_PRIMARY='+JSON.stringify({id:String(created.id),ip:String(created.ip)}));
              const assign=await cloud.assignPrimaryIp(dc,null,created.id,p.server_id);
              const actionId=assign?.id||assign?.action?.id||null;
              if(actionId) await cloud.waitHetznerAction(dc,actionId,180000);

              const power=await cloud.powerOnHetznerServer(dc,p.server_id);
              if(power?.id) await cloud.waitHetznerAction(dc,power.id,180000);
              for(let i=0;i<30;i++){
                await sleep(3000);
                raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
                const st=String(raw?.status||'').toLowerCase();
                const ip=raw?.public_net?.ipv4?.ip||null;
                console.log('POWERON_POLL='+JSON.stringify({attempt:i+1,status:st,ipv4:ip}));
                if(st==='running'&&String(ip||'')===String(created.ip)) break;
              }

              raw=(await hz.hetznerRequest(dc,'GET',`/servers/${p.server_id}`)).server;
              const finalIp=raw?.public_net?.ipv4?.ip||null;
              if(String(raw?.status||'').toLowerCase()!=='running'||String(finalIp||'')!==String(created.ip)) throw new Error('PROVIDER_IPV4_ATTACH_VERIFY_FAILED');
              await db.updatePublicIp(String(p.telegram_id),String(p.server_id),String(p.datacenter),String(finalIp));
              await rememberIp(db,{telegramId:String(p.telegram_id),datacenter:String(p.datacenter),serverId:String(p.server_id),ip:String(finalIp),event:'manual_recovery_attached'}).catch(()=>{});
              console.log('RESULT=restored provider_running ipv4='+finalIp);
            } catch(e){
              console.error('RESTORE_STAGE_ERROR='+String(e?.message||e));
              // Do not delete an IP that may already be attached; preserve recovery state for manual follow-up.
              throw e;
            }
          })().catch(e=>{console.error('RESTORE_FATAL='+String(e?.message||e));process.exitCode=1;}).finally(async()=>{try{await db.pool.end();}catch{}});
          NODE

          # Read-only reachability verification.
          NEW_IP=$(node - <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          (async()=>{const c=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});const [[p]]=await c.execute(`SELECT public_ip FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,['Srv-FIN-97c297']);await c.end();process.stdout.write(String(p?.public_ip||''));})().catch(()=>process.exit(1));
          NODE
          )
          echo "VERIFY_IP=$NEW_IP"
          ok=0
          for i in $(seq 1 20); do
            if timeout 4 bash -c "</dev/tcp/$NEW_IP/22" 2>/dev/null; then echo "SSH_POLL_${i}=open"; ok=1; break; fi
            echo "SSH_POLL_${i}=closed_or_filtered"
            sleep 5
          done
          echo "SSH_FINAL=$ok"
          REMOTE
