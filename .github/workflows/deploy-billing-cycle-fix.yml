name: Deploy Billing Cycle Fix

on:
  push:
    branches: [main]
    paths:
      - 'billing-cycle-bootstrap.js'
      - 'billing-renewal-guard-bootstrap.js'
      - 'billing-settlement.js'
      - 'billing-settlement-bootstrap.js'
      - 'billing-settlement-recovery.js'
      - 'resume-transactional-bootstrap.js'
      - 'scripts/recover-suspended-server.js'
      - 'hetzner-traffic.js'
      - 'reseller-billing-grace-bootstrap.js'
      - 'rebuild-bootstrap.js'
      - 'runtime-bootstrap.js'
      - 'zibal-referer-bootstrap.js'
      - 'provider-visibility.js'
      - 'provider-visibility-bootstrap.js'
      - 'user_projects.js'
      - 'hetzner-purchase-images.js'
      - 'hetzner-purchase-architecture-bootstrap.js'
      - 'hetzner-management-scope-bootstrap.js'
      - 'hetzner-pending-delivery-recovery-bootstrap.js'
      - 'services/check-host-strict-fetch.js'
      - 'services/hetzner-reconcile-policy.js'
      - 'services/hetzner-clean-ip-change.js'
      - 'services/hetzner-lifecycle-safe-bootstrap.js'
      - 'services/hetzner-lifecycle.js'
      - 'services/hetzner-change-ip.js'
      - 'scripts/validate-clean-ip-runtime.js'
      - 'scripts/validate-hetzner-purchase-architecture.js'
      - 'scripts/validate-hetzner-management-buttons.js'
      - 'scripts/validate-billing-cycle-change.js'
      - 'scripts/validate-billing-renewal-guard.js'
      - 'scripts/validate-reseller-billing-grace.js'
      - 'scripts/validate-provider-visibility.js'
      - '.github/workflows/deploy-billing-cycle-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamoon-production-billing-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-cycle-bootstrap.js
          node --check billing-renewal-guard-bootstrap.js
          node --check billing-settlement.js
          node --check billing-settlement-bootstrap.js
          node --check billing-settlement-recovery.js
          node --check resume-transactional-bootstrap.js
          node --check scripts/recover-suspended-server.js
          node --check hetzner-traffic.js
          node --check reseller-billing-grace-bootstrap.js
          node --check rebuild-bootstrap.js
          node --check zibal-referer-bootstrap.js
          node --check user_projects.js
          node --check hetzner-purchase-images.js
          node --check hetzner-purchase-architecture-bootstrap.js
          node --check hetzner-management-scope-bootstrap.js
          node --check hetzner-pending-delivery-recovery-bootstrap.js
          node --check runtime-bootstrap.js
          node --check provider-visibility.js
          node --check provider-visibility-bootstrap.js
          node --check services/check-host-strict-fetch.js
          node --check services/hetzner-reconcile-policy.js
          node --check services/hetzner-clean-ip-change.js
          node --check services/hetzner-lifecycle-safe-bootstrap.js
          node --check services/hetzner-lifecycle.js
          node --check services/hetzner-change-ip.js
          node --check scripts/validate-reseller-billing-grace.js
          node - <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const composed = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          const required = [
            "require('./billing-settlement')",
            "require('./billing-settlement-recovery')",
            'settleServerRenewalAtomic({',
            'rollbackServerRenewalAtomic({',
            'PROVIDER_POWER_ON_NOT_CONFIRMED',
            'settleHetznerTrafficOverage({',
            '[ATOMIC_RENEWAL_DUPLICATE_SKIPPED]',
            '[HETZNER_TRAFFIC_BILLED]'
          ];
          for (const marker of required) if (!composed.includes(marker)) throw new Error('BILLING_SETTLEMENT_MARKER_MISSING:' + marker);
          if (!composed.includes('const payUrl = `https://pay.hamooncloud.ir/payment/start/${trackId}`;')) throw new Error('ZIBAL_INTERMEDIARY_URL_MISSING');
          if (composed.includes('const payUrl = `https://gateway.zibal.ir/start/${trackId}`;')) throw new Error('ZIBAL_DIRECT_URL_STILL_ACTIVE');
          console.log('validate-atomic-billing-runtime: ok');
          NODE
          node scripts/validate-billing-cycle-change.js
          node scripts/validate-billing-renewal-guard.js
          node scripts/validate-reseller-billing-grace.js
          node scripts/validate-provider-visibility.js
          node scripts/validate-hetzner-management-buttons.js
          node scripts/validate-hetzner-purchase-architecture.js
          node scripts/validate-clean-ip-runtime.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== BEFORE ==='
          git rev-parse --short HEAD
          fetched=0
          for attempt in 1 2 3 4 5 6; do
            if git fetch origin main; then fetched=1; break; fi
            echo "git fetch collision; retry $attempt/6"
            sleep 3
          done
          test "$fetched" = 1
          git checkout main
          git merge --ff-only origin/main
          echo '=== VALIDATE PRODUCTION SOURCE ==='
          node --check billing-cycle-bootstrap.js
          node --check billing-renewal-guard-bootstrap.js
          node --check billing-settlement.js
          node --check billing-settlement-bootstrap.js
          node --check billing-settlement-recovery.js
          node --check resume-transactional-bootstrap.js
          node --check scripts/recover-suspended-server.js
          node --check hetzner-traffic.js
          node --check reseller-billing-grace-bootstrap.js
          node --check rebuild-bootstrap.js
          node --check zibal-referer-bootstrap.js
          node --check user_projects.js
          node --check hetzner-purchase-images.js
          node --check hetzner-purchase-architecture-bootstrap.js
          node --check hetzner-management-scope-bootstrap.js
          node --check hetzner-pending-delivery-recovery-bootstrap.js
          node --check runtime-bootstrap.js
          node --check provider-visibility.js
          node --check provider-visibility-bootstrap.js
          node --check services/check-host-strict-fetch.js
          node --check services/hetzner-reconcile-policy.js
          node --check services/hetzner-clean-ip-change.js
          node --check services/hetzner-lifecycle-safe-bootstrap.js
          node --check services/hetzner-lifecycle.js
          node --check services/hetzner-change-ip.js
          node --check scripts/validate-reseller-billing-grace.js
          node - <<'NODE'
          const fs = require('fs');
          const { applyPatches } = require('./runtime-bootstrap');
          const composed = applyPatches(fs.readFileSync('index-core.js', 'utf8'));
          const required = [
            "require('./billing-settlement')",
            "require('./billing-settlement-recovery')",
            'settleServerRenewalAtomic({',
            'rollbackServerRenewalAtomic({',
            'PROVIDER_POWER_ON_NOT_CONFIRMED',
            'settleHetznerTrafficOverage({',
            '[ATOMIC_RENEWAL_DUPLICATE_SKIPPED]',
            '[HETZNER_TRAFFIC_BILLED]'
          ];
          for (const marker of required) if (!composed.includes(marker)) throw new Error('BILLING_SETTLEMENT_MARKER_MISSING:' + marker);
          if (!composed.includes('const payUrl = `https://pay.hamooncloud.ir/payment/start/${trackId}`;')) throw new Error('ZIBAL_INTERMEDIARY_URL_MISSING');
          if (composed.includes('const payUrl = `https://gateway.zibal.ir/start/${trackId}`;')) throw new Error('ZIBAL_DIRECT_URL_STILL_ACTIVE');
          console.log('validate-atomic-billing-runtime: ok');
          NODE
          node scripts/validate-billing-cycle-change.js
          node scripts/validate-billing-renewal-guard.js
          node scripts/validate-reseller-billing-grace.js
          node scripts/validate-provider-visibility.js
          node scripts/validate-hetzner-management-buttons.js
          node scripts/validate-hetzner-purchase-architecture.js
          node scripts/validate-clean-ip-runtime.js
          echo '=== RESTART ==='
          pm2 restart hamoonbot --update-env
          sleep 4
          pm2 describe hamoonbot | grep -E 'status|restarts|uptime' | head -n 12 || true
          echo '=== TARGETED RECOVERY ==='
          node scripts/recover-suspended-server.js Srv-FIN-7b24a5
          echo '=== RECENT STARTUP ERRORS ==='
          pm2 logs hamoonbot --lines 220 --nostream 2>/dev/null | grep -Ei 'SyntaxError|ReferenceError|TypeError|ATOMIC_RENEWAL_FAILED|HETZNER_TRAFFIC_BILLING_ERROR|BILLING_SETTLEMENT|ZIBAL_REFERER|strict-check|check-host|reconcile-policy|clean-ip|safe-lifecycle|pending-recovery|IP_QUALITY|HETZNER_PROVISIONING_IP|HETZNER_PENDING_RECOVERY|provider-visibility|billing-cycle-bootstrap|BILLING_RENEWAL_GUARD|BILLING_GRACE|reseller-billing-grace|rebuild-bootstrap|hetzner-purchase-architecture|HETZNER_MANAGEMENT_SCOPE|HETZNER_INVALID_IMAGE_ARCH|REBUILD|BILLING_CYCLE_CHANGE_FAILED|RESUME_BILLING_GUARD_FAILED|OPS_RECOVERY' | tail -n 120 || true
          echo '=== AFTER ==='
          git rev-parse --short HEAD
          REMOTE
