name: Find detached IPv4 for Srv-FIN-97c297

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-fin-97c297-primary-ip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect Primary IP pool
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const dcs=require('./datacenters');
          const hz=require('./Hetzner/hetzner-api');
          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let p,h=[];
            try {
              [[p]]=await conn.execute(`SELECT server_id,datacenter,server_name,public_ip FROM purchases WHERE server_name=? ORDER BY created_at DESC LIMIT 1`,['Srv-FIN-97c297']);
              [h]=await conn.execute(`SELECT ip_address,last_seen_at,last_event FROM server_ip_history WHERE datacenter=? AND server_id=? ORDER BY last_seen_at DESC LIMIT 30`,[p.datacenter,String(p.server_id)]);
            } finally { await conn.end(); }
            const dc=dcs[p.datacenter];
            const data=await hz.hetznerRequest(dc,'GET','/primary_ips?per_page=200');
            const wanted=new Set([p.public_ip,...h.map(x=>String(x.ip_address||''))]);
            const relevant=(data.primary_ips||[]).filter(x=>x.type==='ipv4' && (wanted.has(String(x.ip)) || String(x.assignee_id||'')===String(p.server_id)));
            console.log('PURCHASE='+JSON.stringify({server_id:String(p.server_id),public_ip:p.public_ip,datacenter:p.datacenter}));
            console.log('RELEVANT_PRIMARY_IPS='+JSON.stringify(relevant.map(x=>({id:String(x.id),ip:x.ip,assignee_id:x.assignee_id==null?null:String(x.assignee_id),assignee_type:x.assignee_type||null,blocked:!!x.blocked,auto_delete:!!x.auto_delete,name:x.name||null,location:x.datacenter?.location?.name||x.location?.name||null}))));
          })().catch(e=>{console.error('FIND_FATAL='+String(e?.message||e));process.exitCode=1;});
          NODE
          REMOTE
