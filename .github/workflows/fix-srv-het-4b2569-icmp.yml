name: Diagnose and fix ICMP for Srv-HET-4b2569

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-srv-het-4b2569-icmp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
      TARGET_IP: 91.107.146.135
      TARGET_SERVER_ID: 166087176
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose and fix target ICMP
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' TARGET_IP='$TARGET_IP' TARGET_SERVER_ID='$TARGET_SERVER_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const { Client } = require('ssh2');
          const db = require('./db');

          const host = process.env.TARGET_IP;
          const serverId = process.env.TARGET_SERVER_ID;

          function exec(conn, cmd) {
            return new Promise((resolve, reject) => {
              conn.exec(cmd, (err, stream) => {
                if (err) return reject(err);
                let out = '', errOut = '';
                stream.on('close', (code) => resolve({ code, out, errOut }))
                  .on('data', d => out += d.toString());
                stream.stderr.on('data', d => errOut += d.toString());
              });
            });
          }

          (async () => {
            const password = await db.getServerSecret(serverId, 'root_password');
            if (!password) throw new Error('ROOT_PASSWORD_NOT_FOUND');

            const conn = new Client();
            await new Promise((resolve, reject) => {
              conn.on('ready', resolve).on('error', reject).connect({
                host,
                port: 22,
                username: 'root',
                password,
                readyTimeout: 15000,
                tryKeyboard: false
              });
            });

            const diag = await exec(conn, [
              "echo '=== SYSCTL ==='",
              "sysctl net.ipv4.icmp_echo_ignore_all || true",
              "echo '=== UFW ==='",
              "ufw status verbose 2>&1 || true",
              "echo '=== IPTABLES INPUT ==='",
              "iptables -S INPUT 2>&1 || true",
              "echo '=== IPTABLES ICMP ==='",
              "iptables -S 2>&1 | grep -i icmp || true",
              "echo '=== NFT ICMP ==='",
              "nft list ruleset 2>/dev/null | grep -i -C 2 icmp || true"
            ].join('; '));
            console.log(diag.out);
            if (diag.errOut) console.error(diag.errOut);

            const fix = await exec(conn, [
              "set -e",
              "sysctl -w net.ipv4.icmp_echo_ignore_all=0",
              "printf '%s\n' 'net.ipv4.icmp_echo_ignore_all = 0' > /etc/sysctl.d/99-hamoon-icmp.conf",
              "if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then " +
                "if ! grep -Eq 'ufw-before-input.*icmp.*echo-request.*ACCEPT' /etc/ufw/before.rules 2>/dev/null; then " +
                  "cp /etc/ufw/before.rules /etc/ufw/before.rules.hamoon-backup-$(date +%Y%m%d%H%M%S); " +
                  "awk 'BEGIN{added=0} { if (!added && $0 ~ /^COMMIT$/) { print "-A ufw-before-input -p icmp --icmp-type echo-request -j ACCEPT"; added=1 } print }' /etc/ufw/before.rules > /etc/ufw/before.rules.hamoon.tmp; " +
                  "mv /etc/ufw/before.rules.hamoon.tmp /etc/ufw/before.rules; " +
                  "ufw reload; " +
                "fi; " +
              "fi",
              "if command -v iptables >/dev/null 2>&1; then iptables -C INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p icmp --icmp-type echo-request -j ACCEPT; fi",
              "echo '=== AFTER ==='",
              "sysctl net.ipv4.icmp_echo_ignore_all",
              "iptables -S INPUT 2>&1 | head -n 30 || true"
            ].join('; '));
            console.log(fix.out);
            if (fix.errOut) console.error(fix.errOut);
            if (fix.code !== 0) throw new Error('ICMP_FIX_COMMAND_FAILED');

            conn.end();
            await db.pool.end();
          })().catch(async e => {
            console.error('ICMP_FIX_FAILED=' + String(e?.stack || e));
            try { await db.pool.end(); } catch {}
            process.exit(1);
          });
          NODE
          REMOTE

      - name: Verify public ping and SSH
        shell: bash
        run: |
          set -euo pipefail
          ping -c 4 -W 3 "$TARGET_IP"
          nc -vz -w 8 "$TARGET_IP" 22
          echo "ICMP_PUBLIC_OK=1"
          echo "SSH_PUBLIC_OK=1"
