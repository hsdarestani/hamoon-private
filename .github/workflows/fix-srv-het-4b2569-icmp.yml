name: Repair ICMP for Srv-HET-4b2569

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-srv-het-4b2569-icmp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
      TARGET_IP: 91.107.146.135
    steps:
      - name: Prepare management SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Repair ICMP through Hetzner Rescue
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' TARGET_IP='$TARGET_IP' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          TMP_SCRIPT="scripts/.tmp-repair-hetzner-icmp.js"
          trap 'rm -f "$TMP_SCRIPT"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/hsdarestani/hamoon-private/main/scripts/repair-hetzner-icmp.js" -o "$TMP_SCRIPT"
          node "$TMP_SCRIPT" "$TARGET_IP"
          REMOTE

      - name: Verify public ping and SSH
        shell: bash
        run: |
          set -euo pipefail
          ping -c 4 -W 3 "$TARGET_IP"
          nc -vz -w 8 "$TARGET_IP" 22
          echo "ICMP_PUBLIC_OK=1"
          echo "SSH_PUBLIC_OK=1"
