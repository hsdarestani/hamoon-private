name: Diagnose Hetzner 422 Purchase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-rebuild.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect recent 422 purchases
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== REV / PM2 ==='
          git rev-parse --short HEAD
          pm2 describe hamoonbot | grep -E 'status|restarts|uptime' | head -n 12 || true
          echo '=== RECENT 422 / PURCHASE CONTEXT ==='
          pm2 logs hamoonbot --lines 9000 --nostream 2>/dev/null | grep -A 14 -B 6 -Ei 'status code 422|Hetzner createServer error|image has wrong architecture|\[PURCHASE\]|HETZNER_CREATE_ATTEMPT' | tail -n 1200 || true
          REMOTE
