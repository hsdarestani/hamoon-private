name: Apply Server Deletion Refunds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-server-deletion-refund.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deletion refund patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-server-deletion-refund.js
          node --check server-deletion-refund.js
          node --check services/hetzner-lifecycle.js
          node --check customer-api.js
          node --check index-core.js
          node scripts/validate-server-deletion-refund.js

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hossein Darestani"
          git config user.email "45485005+hsdarestani@users.noreply.github.com"
          git add services/hetzner-lifecycle.js customer-api.js index-core.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat(billing): refund unused cycle on server deletion'
            git push origin HEAD:main
          fi

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          test -n "$SSH_KEY"
          test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          node --check server-deletion-refund.js
          node --check services/hetzner-lifecycle.js
          node --check customer-api.js
          node --check index-core.js
          node scripts/validate-server-deletion-refund.js
          grep -q 'refundUnusedServerCycle' services/hetzner-lifecycle.js
          grep -q 'chargeApiInitialCycle' customer-api.js
          grep -q 'server-deletion-refund' index-core.js

          pm2 restart hamoonbot --update-env >/dev/null
          sleep 5
          PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);const p=a.find(x=>x.name==='hamoonbot');process.stdout.write(p?.pm2_env?.status||'missing')})")"
          echo "PM2_STATUS=$PM2_STATUS"
          test "$PM2_STATUS" = 'online'

          node - <<'NODE'
          const r = require('./server-deletion-refund');
          const start = new Date('2026-09-11T00:00:00Z');
          const out = r.calculateUnusedCycleRefund({ amount: 240000, cycle: 'daily', lastBilledAt: start, now: new Date(start.getTime()+12*3600000) });
          console.log('PROD_REFUND_CALC=' + JSON.stringify(out));
          if (out.refundToman !== 120000) process.exit(1);
          NODE
          REMOTE
