name: Fix reseller API request limits

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-reseller-location-catalog.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separate reseller read and write rate-limit buckets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('customer-api.js')
          s = p.read_text()
          old = "    if (!checkRate(client.key_prefix, ['POST', 'PUT', 'PATCH', 'DELETE'].includes(req.method) ? 10 : 60)) {"
          new = "    const isWriteRequest = ['POST', 'PUT', 'PATCH', 'DELETE'].includes(req.method);\n    const rateScope = isWriteRequest ? 'write' : 'read';\n    const rateLimit = isWriteRequest\n      ? Math.max(10, Number(process.env.RESELLER_API_WRITE_RPM || 30))\n      : Math.max(60, Number(process.env.RESELLER_API_READ_RPM || 180));\n    if (!checkRate(`${client.key_prefix}:${rateScope}`, rateLimit)) {"
          if old in s:
              s = s.replace(old, new, 1)
          elif "if (!checkRate(`${client.key_prefix}:${rateScope}`, rateLimit)) {" not in s:
              raise SystemExit('customer API rate-limit marker not found')
          p.write_text(s)

          p = Path('reseller-api-extensions.js')
          s = p.read_text()
          old = "    if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(req.method) && !allowWrite(client.key_prefix || client.id)) {"
          new = "    const isWriteRequest = ['POST', 'PUT', 'PATCH', 'DELETE'].includes(req.method);\n    const writeLimit = Math.max(20, Number(process.env.RESELLER_API_EXTENSION_WRITE_RPM || 30));\n    if (isWriteRequest && !allowWrite(`${client.key_prefix || client.id}:write`, writeLimit)) {"
          if old in s:
              s = s.replace(old, new, 1)
          elif "if (isWriteRequest && !allowWrite(`${client.key_prefix || client.id}:write`, writeLimit)) {" not in s:
              raise SystemExit('reseller extension rate-limit marker not found')
          p.write_text(s)
          PY

          node -c customer-api.js
          node -c reseller-api-extensions.js
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-api.js reseller-api-extensions.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(api): separate reseller read and write rate limits'
            git push origin HEAD:main
          fi

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git pull --ff-only origin main
          node -c customer-api.js
          node -c reseller-api-extensions.js
          pm2 restart hamoonbot --update-env
          sleep 3
          pm2 show hamoonbot --no-color | sed -n '1,18p'
          REMOTE
