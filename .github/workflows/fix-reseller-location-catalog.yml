name: Fix reseller location-aware catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-reseller-location-catalog.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch customer API location-aware pricing and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('customer-api.js')
          s = p.read_text()

          old_prices = """  router.get('/prices', async (_req, res, next) => {
    try { res.json({ ok: true, plans: await getHetznerSellablePlans(datacenters.hetzner) }); }
    catch (e) { next(e); }
  });"""
          new_prices = """  router.get('/prices', async (req, res, next) => {
    try {
      const location = String(req.query.location || '').trim().toLowerCase();
      if (location && !isAllowed(req.apiClient.allowed_locations, location)) {
        return apiError(res, 403, 'NOT_ALLOWED', 'این لوکیشن برای این کلاینت مجاز نیست.');
      }
      const baseDc = datacenters.hetzner;
      const locationDc = location
        ? { ...baseDc, HETZNER_LOCATION: location, HETZNER_LOCATION_FALLBACKS: '' }
        : baseDc;
      res.json({ ok: true, location: location || null, plans: await getHetznerSellablePlans(locationDc) });
    } catch (e) { next(e); }
  });"""
          if old_prices in s:
              s = s.replace(old_prices, new_prices, 1)
          elif new_prices not in s:
              raise SystemExit('prices route marker not found')

          old_create = """      const plans = await getHetznerSellablePlans(dc);
      const requestedType = String(input.server_type || '').trim().toLowerCase();
      const plan = plans.find(p => String(p.id || '').toLowerCase() === requestedType || String(p.hetzner_type || '').toLowerCase() === requestedType);
      if (!plan || plan.available === false) return apiError(res, 400, 'INVALID_PLAN', 'پلن انتخاب‌شده معتبر نیست.');

      const image = String(input.image || 'ubuntu-24.04').trim();
      const location = String(input.location || dc.HETZNER_LOCATION || 'nbg1').trim().toLowerCase();
      if (!isAllowed(client.allowed_datacenters, dcKey) || !isAllowed(client.allowed_plans, plan.id) || !isAllowed(client.allowed_images, image) || !isAllowed(client.allowed_locations, location)) {
        return apiError(res, 403, 'NOT_ALLOWED', 'این پلن، ایمیج یا لوکیشن برای این کلاینت مجاز نیست.');
      }
      const pricing = createApiPricingSnapshot(client, plan, duration);"""
          new_create = """      const requestedType = String(input.server_type || '').trim().toLowerCase();
      const image = String(input.image || 'ubuntu-24.04').trim();
      const location = String(input.location || dc.HETZNER_LOCATION || 'nbg1').trim().toLowerCase();
      if (!isAllowed(client.allowed_datacenters, dcKey) || !isAllowed(client.allowed_plans, requestedType) || !isAllowed(client.allowed_images, image) || !isAllowed(client.allowed_locations, location)) {
        return apiError(res, 403, 'NOT_ALLOWED', 'این پلن، ایمیج یا لوکیشن برای این کلاینت مجاز نیست.');
      }

      // Build the catalog for the exact target location. Hetzner exposes
      // per-location availability and pricing on server types; using the
      // generic/default catalog here can expose ARM/regional plans in regions
      // where they cannot actually be created.
      const locationDc = { ...dc, HETZNER_LOCATION: location, HETZNER_LOCATION_FALLBACKS: '' };
      const plans = await getHetznerSellablePlans(locationDc);
      const plan = plans.find(p => String(p.id || '').toLowerCase() === requestedType || String(p.hetzner_type || '').toLowerCase() === requestedType);
      if (!plan || plan.available === false) {
        return apiError(res, 400, 'UNSUPPORTED_LOCATION', 'این پلن در لوکیشن انتخابی قابل ارائه نیست. لطفاً پلن دیگری انتخاب کنید.');
      }
      const pricing = createApiPricingSnapshot(client, plan, duration);"""
          if old_create in s:
              s = s.replace(old_create, new_create, 1)
          elif new_create not in s:
              raise SystemExit('server create catalog marker not found')

          p.write_text(s)
          PY

          node -c customer-api.js
          git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-api.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(api): scope reseller plans and pricing by location'
            git push origin HEAD:main
          fi

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          git fetch origin main
          git pull --ff-only origin main
          node -c customer-api.js
          node -c Hetzner/hetzner-api.js
          pm2 restart hamoonbot --update-env
          sleep 3
          pm2 show hamoonbot --no-color | sed -n '1,18p'
          REMOTE
