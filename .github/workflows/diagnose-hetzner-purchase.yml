name: Diagnose Hetzner Purchase Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hetzner-purchase.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect recent Hetzner purchase activity
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo '=== REV / PM2 ==='
          git rev-parse --short HEAD
          pm2 describe hamoonbot | grep -E 'status|restarts|uptime' | head -n 12 || true

          echo '=== RECENT PURCHASE / HETZNER LOGS ==='
          pm2 logs hamoonbot --lines 5000 --nostream 2>/dev/null \
            | grep -Ei '\[PURCHASE\]|HETZNER|provision|pending_ssh|pending_ip|manual_review|health|create server|createServer|SERVER_SECRET|purchase|timeout|ETIMEDOUT|ECONN|429|rate.limit|insufficient|quota|unavailable' \
            | tail -n 700 || true

          echo '=== RECENT HETZNER PURCHASES (LAST 3H) ==='
          node <<'NODE'
          const db = require('./db');
          (async () => {
            try {
              const rows = await db.getAllPurchases();
              const now = Date.now();
              const recent = (rows || []).filter(p => {
                const dc = String(p.datacenter || '').toLowerCase();
                const ts = new Date(p.created_at || p.updated_at || 0).getTime();
                return (dc === 'hetzner' || dc.startsWith('hetzner-')) && ts && (now - ts <= 3 * 3600 * 1000);
              });
              console.log(JSON.stringify(recent.map(p => ({
                telegram_id: String(p.telegram_id || ''),
                server_id: String(p.server_id || ''),
                server_name: p.server_name,
                datacenter: p.datacenter,
                flavor_id: p.flavor_id,
                duration: p.duration,
                amount: p.amount,
                status: p.status,
                public_ip: p.public_ip,
                lifecycle_error_code: p.lifecycle_error_code,
                provider_action_id: p.provider_action_id,
                created_at: p.created_at,
                updated_at: p.updated_at,
                delivered_at: p.delivered_at
              })), null, 2));
            } catch (e) {
              console.error('PURCHASE_DIAG_ERROR', e.message);
              process.exitCode = 1;
            } finally {
              process.exit();
            }
          })();
NODE

          echo '=== RECENT PURCHASE WALLET LOGS (LAST 3H) ==='
          node <<'NODE'
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({host:process.env.DB_HOST||'localhost',user:process.env.DB_USER||'root',password:process.env.DB_PASSWORD||'',database:process.env.DB_NAME||'hamooncloud_db'});
            try {
              const [rows] = await conn.execute(`SELECT telegram_id, amount, description, type, timestamp FROM wallet_logs WHERE timestamp >= DATE_SUB(NOW(), INTERVAL 3 HOUR) AND (type='purchase' OR description LIKE '%Hetzner%' OR description LIKE '%هتزنر%') ORDER BY timestamp DESC LIMIT 100`);
              console.log(JSON.stringify(rows, null, 2));
            } finally { await conn.end(); }
          })().catch(e=>{console.error('WALLET_DIAG_ERROR',e.message);process.exitCode=1});
NODE

          echo '=== HETZNER API BASIC CHECK ==='
          node <<'NODE'
          require('dotenv').config();
          const axios = require('axios');
          const token = process.env.HETZNER_API_TOKEN || process.env.HETZNER_TOKEN || process.env.HCLOUD_TOKEN;
          (async()=>{
            try {
              const r = await axios.get('https://api.hetzner.cloud/v1/servers?per_page=1', {headers:{Authorization:`Bearer ${token}`}, timeout:12000});
              console.log(JSON.stringify({status:r.status, servers:Array.isArray(r.data?.servers)?r.data.servers.length:null, meta:r.data?.meta?.pagination||null}));
            } catch(e) {
              console.log(JSON.stringify({status:e.response?.status||null, code:e.code||null, message:e.message, providerError:e.response?.data?.error||null}));
            }
          })();
NODE
          REMOTE
