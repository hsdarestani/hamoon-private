name: Validate No-Reuse Hetzner IP

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/validate-no-reuse-ip-trigger.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and no-reuse wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check services/hetzner-lifecycle.js
          node --check services/hetzner-change-ip.js
          node --check services/hetzner-reconcile-policy.js
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('services/hetzner-lifecycle.js', 'utf8');
          if (!src.includes("require('./hetzner-change-ip')")) throw new Error('history helper import missing');
          if (!src.includes('reserveUniquePrimaryIpv4(db')) throw new Error('unique reservation missing');
          if (!src.includes('provisioning_quality_rejected')) throw new Error('rejected IP history event missing');
          if (!/rotateProvisioningIp\(\{[\s\S]*?db,[\s\S]*?telegramId:[\s\S]*?datacenter:/m.test(src)) throw new Error('reconcile rotation context missing');
          const policy = fs.readFileSync('services/hetzner-reconcile-policy.js', 'utf8');
          if (!/rotateProvisioningIp\(\{[\s\S]*?db,[\s\S]*?telegramId:[\s\S]*?datacenter:/m.test(policy)) throw new Error('inconclusive rotation context missing');
          require('./services/hetzner-lifecycle');
          console.log('no-reuse wiring: ok');
          NODE
