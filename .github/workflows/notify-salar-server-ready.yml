name: Notify Salar Server Ready
on:
  push:
    branches: [main]
    paths: ['.github/workflows/notify-salar-server-ready.yml']
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Send verified ready notification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const TelegramBot=require('node-telegram-bot-api');
          const db=require('./db');
          (async()=>{
            const [rows]=await db.pool.execute("SELECT telegram_id,status,public_ip,delivered_at FROM purchases WHERE server_name='Srv-HET-5e6860' ORDER BY created_at DESC LIMIT 1");
            const p=rows[0];
            if(!p||p.status!=='active'||!p.delivered_at) throw new Error('SERVER_NOT_VERIFIED_DELIVERED');
            const bot=new TelegramBot(process.env.TELEGRAM_BOT_TOKEN,{polling:false});
            const msg='✅ سلام، سرور Srv-HET-5e6860 آماده و مشکل آن برطرف شد.\n\n🌐 IP نهایی: '+p.public_ip+'\n✅ SSH بررسی و تأیید شده\n✅ دسترسی IP از ایران و نقاط خارجی بررسی و تأیید شده\n\nسرور الان فعال و قابل استفاده است. 🙏';
            const sent=await bot.sendMessage(String(p.telegram_id),msg);
            console.log('TELEGRAM_NOTIFY_SENT=yes');
            console.log('TELEGRAM_NOTIFY_MESSAGE_ID='+sent.message_id);
            await db.pool.end();
          })().catch(async e=>{console.error(e);try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
