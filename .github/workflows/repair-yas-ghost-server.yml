name: Repair YAS Ghost Server

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-yas-ghost-server.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify provider and repair DB row
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          node - <<'NODE'
          require('dotenv').config();
          const db = require('./db');
          const cloud = require('./cloud-api');
          const datacenters = require('./datacenters');

          function is404(error) {
            return Number(error?.response?.status ?? error?.status ?? error?.statusCode ?? 0) === 404;
          }

          (async () => {
            const targetName = 'Srv-HET-0aadff';
            const [rows] = await db.pool.execute(
              `SELECT telegram_id, server_id, server_name, datacenter, status, deleted_at
                 FROM purchases
                WHERE server_name = ?
                ORDER BY created_at DESC`,
              [targetName]
            );

            console.log('MATCH_COUNT=' + rows.length);
            if (!rows.length) throw new Error('TARGET_PURCHASE_NOT_FOUND');

            for (const row of rows) {
              console.log('ROW_BEFORE=' + JSON.stringify(row));
              const dcKey = String(row.datacenter || '');
              const dc = datacenters[dcKey] || datacenters[dcKey.split('__')[0]];
              if (!dc) throw new Error('DATACENTER_CONFIG_MISSING:' + dcKey);

              let providerMissing = false;
              try {
                const tok = await cloud.getToken(dc);
                await cloud.getServer(dc, tok, String(row.server_id));
                console.log('PROVIDER_EXISTS=yes server_id=' + row.server_id);
              } catch (error) {
                if (!is404(error)) throw error;
                providerMissing = true;
                console.log('PROVIDER_EXISTS=no server_id=' + row.server_id);
              }

              if (providerMissing) {
                const marked = await db.markDeleted(
                  String(row.telegram_id),
                  String(row.server_id),
                  String(row.datacenter)
                );
                console.log('MARK_DELETED=' + (marked ? 'yes' : 'no') + ' server_id=' + row.server_id);
              } else {
                console.log('MARK_DELETED=skipped_provider_exists server_id=' + row.server_id);
              }
            }

            const [after] = await db.pool.execute(
              `SELECT telegram_id, server_id, server_name, datacenter, status, deleted_at, auto_renew
                 FROM purchases
                WHERE server_name = ?
                ORDER BY created_at DESC`,
              [targetName]
            );
            console.log('ROWS_AFTER=' + JSON.stringify(after));
            await db.pool.end();
          })().catch(async (error) => {
            console.error('REPAIR_FAILED=' + String(error?.message || error));
            try { await db.pool.end(); } catch {}
            process.exit(1);
          });
          NODE
          REMOTE
