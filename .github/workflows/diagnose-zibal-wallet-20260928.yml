name: Diagnose Zibal Wallet 2026-09-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-zibal-wallet-20260928.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Inspect Zibal payments
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/k -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          node - <<'NODE'
          require('dotenv').config();
          const db=require('./db');
          (async()=>{
            const conn=await db.pool.getConnection();
            try {
              const [z]=await conn.query(
                `SELECT id,telegram_id,track_id,amount_toman,paid_rial,credited,created_at,updated_at
                   FROM zibal_payments
                  WHERE track_id IN ('4814436321','4814456091')
                  ORDER BY id ASC`
              );
              console.log('ZIBAL='+JSON.stringify(z));
              const users=[...new Set(z.map(x=>String(x.telegram_id)))];
              for(const uid of users){
                const [[u]]=await conn.query('SELECT telegram_id,wallet,updated_at FROM users WHERE telegram_id=?',[uid]);
                console.log('USER='+JSON.stringify(u||null));
                const [logs]=await conn.query(
                  `SELECT id,amount,type,description,timestamp
                     FROM wallet_logs
                    WHERE telegram_id=?
                    ORDER BY timestamp DESC,id DESC
                    LIMIT 20`,[uid]
                );
                console.log('LOGS='+JSON.stringify(logs));
                const [p]=await conn.query(
                  `SELECT server_id,server_name,amount,duration,status,created_at,last_billed_at
                     FROM purchases
                    WHERE telegram_id=?
                    ORDER BY created_at DESC
                    LIMIT 20`,[uid]
                );
                console.log('PURCHASES='+JSON.stringify(p));
              }
              const [r]=await conn.query(
                `SELECT * FROM zibal_rounding_refunds
                  WHERE track_id IN ('4814436321','4814456091')`
              ).catch(async()=>[[]]);
              console.log('ROUNDING_REFUNDS='+JSON.stringify(r));
            } finally {
              conn.release();
              await db.pool.end();
            }
          })().catch(async e=>{console.error('DIAG='+JSON.stringify({message:e.message,code:e.code}));try{await db.pool.end()}catch{};process.exit(1)});
          NODE
          REMOTE
