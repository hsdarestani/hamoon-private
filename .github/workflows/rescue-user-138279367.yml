name: Rescue SSH for user 138279367

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rescue-user-138279367.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT" && test -n "$SSH_KEY" && test -n "$SERVER_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Recover guest SSH without rebuilding disk
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"

          node <<'NODE'
          const net = require('net');
          const { Client } = require('ssh2');
          require('dotenv').config();
          const mysql = require('mysql2/promise');
          const dcs = require('./datacenters');
          const hetzner = require('./Hetzner/hetzner-api');
          const userId = '138279367';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          function tcp22(ip, timeout=4000) {
            return new Promise(resolve => {
              if (!ip) return resolve(false);
              const s = net.createConnection({host:ip, port:22});
              let done=false;
              const finish=v=>{ if(done)return; done=true; s.destroy(); resolve(v); };
              s.setTimeout(timeout); s.once('connect',()=>finish(true)); s.once('timeout',()=>finish(false)); s.once('error',()=>finish(false));
            });
          }
          async function waitTcp(ip, attempts=30, delay=3000) {
            for (let i=1;i<=attempts;i++) {
              const ok=await tcp22(ip);
              console.log('WAIT_TCP22 ' + JSON.stringify({attempt:i,ip,ok}));
              if(ok)return true;
              if(i<attempts)await sleep(delay);
            }
            return false;
          }
          async function rawServer(dc,id){ return (await hetzner.hetznerRequest(dc,'GET',`/servers/${id}`)).server; }
          async function sshExec(host,password,script){
            return new Promise((resolve,reject)=>{
              const c=new Client();
              let stdout='',stderr='';
              c.on('ready',()=>{
                c.exec('bash -s',(err,stream)=>{
                  if(err){c.end();return reject(err);}
                  stream.on('close',(code)=>{c.end(); code===0?resolve({stdout,stderr}):reject(Object.assign(new Error(`RESCUE_SCRIPT_EXIT_${code}: ${stderr.slice(-800)}`),{stdout,stderr,code}));});
                  stream.on('data',d=>stdout+=d.toString());
                  stream.stderr.on('data',d=>stderr+=d.toString());
                  stream.end(script);
                });
              }).on('error',reject).connect({host,port:22,username:'root',password,readyTimeout:20000,keepaliveInterval:5000});
            });
          }

          (async()=>{
            const conn=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            let rows;
            try{[rows]=await conn.execute("SELECT server_id,datacenter,public_ip,status FROM purchases WHERE telegram_id=? AND status<>'deleted' ORDER BY created_at DESC",[userId]);}
            finally{await conn.end();}
            if(rows.length!==1)throw new Error(`EXPECTED_ONE_LIVE_PURCHASE_GOT_${rows.length}`);
            const p=rows[0];
            const dc=dcs[p.datacenter];
            if(!dc||String(dc.provider||dc.apiType||'').toLowerCase()!=='hetzner')throw new Error('LIVE_PURCHASE_NOT_HETZNER');
            let srv=await rawServer(dc,p.server_id);
            const oldDbIp=p.public_ip||null;
            const ip=srv?.public_net?.ipv4?.ip||oldDbIp;
            console.log('START ' + JSON.stringify({server_id:String(p.server_id),status:srv.status,ip,db_ip:oldDbIp}));

            const rescue=await hetzner.hetznerRequest(dc,'POST',`/servers/${p.server_id}/actions/enable_rescue`,{type:'linux64'});
            const rescuePassword=rescue?.root_password;
            if(!rescuePassword)throw new Error('RESCUE_PASSWORD_MISSING');
            if(rescue?.action?.id)await hetzner.waitHetznerAction(dc,rescue.action.id,120000);
            const reboot=await hetzner.hetznerRequest(dc,'POST',`/servers/${p.server_id}/actions/reboot`,{});
            if(reboot?.action?.id)await hetzner.waitHetznerAction(dc,reboot.action.id,180000);
            if(!(await waitTcp(ip,30,3000)))throw new Error('RESCUE_SSH_NOT_REACHABLE');
            console.log('RESCUE_SSH_READY');

            const repairScript=`set -euo pipefail
OLD_IP='${String(oldDbIp||'').replace(/'/g,"'\\''")}'
NEW_IP='${String(ip||'').replace(/'/g,"'\\''")}'
ROOT_PART="$(lsblk -rpno NAME,TYPE,FSTYPE | awk '$2=="part" && ($3=="ext4" || $3=="xfs" || $3=="btrfs") {print $1; exit}')"
if [ -z "$ROOT_PART" ]; then ROOT_PART="$(lsblk -rpno NAME,TYPE,FSTYPE | awk '$2=="disk" && ($3=="ext4" || $3=="xfs" || $3=="btrfs") {print $1; exit}')"; fi
[ -n "$ROOT_PART" ] || { echo 'ROOT_PART_NOT_FOUND' >&2; lsblk -f >&2; exit 20; }
mkdir -p /mnt/root
mount "$ROOT_PART" /mnt/root
echo "ROOT_PART=$ROOT_PART"
mkdir -p /mnt/root/dev /mnt/root/proc /mnt/root/sys /mnt/root/run
mount --bind /dev /mnt/root/dev
mount -t proc proc /mnt/root/proc
mount -t sysfs sys /mnt/root/sys
mount --bind /run /mnt/root/run || true
cp -L /etc/resolv.conf /mnt/root/etc/resolv.conf || true
if [ -n "$OLD_IP" ] && [ -n "$NEW_IP" ] && [ "$OLD_IP" != "$NEW_IP" ]; then
  for dir in /mnt/root/etc/netplan /mnt/root/etc/network /mnt/root/etc/systemd/network; do
    [ -d "$dir" ] || continue
    grep -RIl -- "$OLD_IP" "$dir" 2>/dev/null | while read -r f; do cp -a "$f" "$f.hamoon-backup"; sed -i "s/${oldDbIp||''}/${ip||''}/g" "$f"; echo "UPDATED_IP_CONFIG=$f"; done
  done
fi
mkdir -p /mnt/root/etc/ssh/sshd_config.d
cat > /mnt/root/etc/ssh/sshd_config.d/99-hamoon-recovery.conf <<'EOF'
Port 22
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
EOF
if [ ! -x /mnt/root/usr/sbin/sshd ]; then
  chroot /mnt/root /usr/bin/apt-get update
  chroot /mnt/root /usr/bin/env DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get install -y openssh-server
fi
chroot /mnt/root /usr/sbin/sshd -t
systemctl --root=/mnt/root enable ssh.service >/dev/null 2>&1 || systemctl --root=/mnt/root enable sshd.service >/dev/null 2>&1 || true
if [ -x /mnt/root/usr/sbin/ufw ]; then
  chroot /mnt/root /usr/sbin/ufw --force insert 1 allow 22/tcp || true
fi
rm -f /mnt/root/etc/ssh/sshd_not_to_be_run 2>/dev/null || true
sync
echo 'GUEST_REPAIR_OK'
`;
            const repaired=await sshExec(ip,rescuePassword,repairScript);
            console.log(repaired.stdout.trim().split('\n').slice(-20).join('\n'));
            if(repaired.stderr.trim())console.log('RESCUE_STDERR ' + repaired.stderr.trim().slice(-1000));

            const disable=await hetzner.hetznerRequest(dc,'POST',`/servers/${p.server_id}/actions/disable_rescue`,{}).catch(()=>null);
            if(disable?.action?.id)await hetzner.waitHetznerAction(dc,disable.action.id,120000).catch(()=>null);
            const finalReboot=await hetzner.hetznerRequest(dc,'POST',`/servers/${p.server_id}/actions/reboot`,{});
            if(finalReboot?.action?.id)await hetzner.waitHetznerAction(dc,finalReboot.action.id,180000);
            const finalOk=await waitTcp(ip,40,3000);
            srv=await rawServer(dc,p.server_id);
            console.log('FINAL_PROVIDER ' + JSON.stringify({status:srv.status,ip:srv?.public_net?.ipv4?.ip||null,tcp22:finalOk}));

            const sync=await mysql.createConnection({host:process.env.DB_HOST||'127.0.0.1',user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME||'hamooncloud_db'});
            try{await sync.execute("UPDATE purchases SET public_ip=?,status='active',suspend_reason=NULL,lifecycle_error_code=NULL,lifecycle_updated_at=CURRENT_TIMESTAMP,updated_at=CURRENT_TIMESTAMP WHERE telegram_id=? AND server_id=? AND datacenter=? AND status<>'deleted'",[srv?.public_net?.ipv4?.ip||ip,userId,String(p.server_id),String(p.datacenter)]);}finally{await sync.end();}
            if(!finalOk)throw Object.assign(new Error('GUEST_SSH_STILL_UNREACHABLE_AFTER_RESCUE_REPAIR'),{code:'GUEST_SSH_STILL_UNREACHABLE_AFTER_RESCUE_REPAIR'});
            console.log('RECOVERY_SUCCESS');
          })().catch(e=>{console.error('RECOVERY_FATAL ' + JSON.stringify({code:e?.code||null,message:String(e?.message||e).slice(0,400)}));process.exitCode=1;});
          NODE
          REMOTE
