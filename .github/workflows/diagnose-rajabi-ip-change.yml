name: Diagnose Rajabi Hetzner IP change

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-rajabi-ip-change.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HAMOON_SERVER_HOST }}
      SSH_USER: ${{ secrets.HAMOON_SERVER_USER }}
      SSH_PORT: ${{ secrets.HAMOON_SERVER_PORT }}
      SSH_KEY: ${{ secrets.HAMOON_SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.HAMOON_SERVER_PATH }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hamoon_server_key
          chmod 600 ~/.ssh/hamoon_server_key
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Read-only production diagnosis
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH_B64="$(printf '%s' "$SERVER_PATH" | base64 -w0)"
          ssh -i ~/.ssh/hamoon_server_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "APP_PATH_B64='$APP_PATH_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$(printf '%s' "$APP_PATH_B64" | base64 -d)"
          cd "$APP_PATH"
          echo "PRODUCTION_HEAD=$(git rev-parse HEAD)"
          node <<'NODE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const ips=['5.75.193.123','5.75.207.199'];
          (async()=>{
            const c=await mysql.createConnection({
              host:process.env.DB_HOST||'127.0.0.1',
              user:process.env.DB_USER,
              password:process.env.DB_PASSWORD,
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try {
              const [columns]=await c.execute("SHOW COLUMNS FROM purchases");
              const names=new Set(columns.map(x=>x.Field));
              const ipColumns=['public_ip','ip_address','server_ip','ipv4'].filter(x=>names.has(x));
              console.log('PURCHASE_IP_COLUMNS='+JSON.stringify(ipColumns));
              for(const col of ipColumns){
                const [rows]=await c.execute(
                  `SELECT telegram_id,server_id,server_name,datacenter,status,${col} matched_ip,updated_at
                   FROM purchases WHERE ${col} IN (?,?)`,
                  ips
                );
                for(const row of rows) console.log('MATCHED_PURCHASE='+JSON.stringify(row));
              }
              const [histCols]=await c.execute(
                `SELECT TABLE_NAME,COLUMN_NAME FROM information_schema.COLUMNS
                 WHERE TABLE_SCHEMA=DATABASE()
                   AND (COLUMN_NAME LIKE '%ip%' OR COLUMN_NAME IN ('telegram_id','server_id','event','created_at'))
                   AND TABLE_NAME LIKE '%ip%'`
              );
              console.log('IP_HISTORY_SCHEMA='+JSON.stringify(histCols));
            } finally {await c.end();}
          })().catch(e=>{console.error('DIAG_DB_FAILED='+String(e.code||e.message));console.error('DIAG_DB_MESSAGE='+String(e.sqlMessage||e.message));process.exit(1)});
          NODE
          node <<'NODEPROBE'
          require('dotenv').config();
          const mysql=require('mysql2/promise');
          const runtime=require('./runtime-bootstrap');
          runtime.applyRuntimeSafetyDefaults();
          require('./services/check-host-strict-fetch').installStrictCheckHostFetch();
          const lifecycle=require('./services/hetzner-lifecycle');
          (async()=>{
            const c=await mysql.createConnection({
              host:process.env.DB_HOST||'127.0.0.1',
              user:process.env.DB_USER,
              password:process.env.DB_PASSWORD,
              database:process.env.DB_NAME||'hamooncloud_db'
            });
            try {
              const [rows]=await c.execute(
                `SELECT server_id,server_name,public_ip FROM purchases
                 WHERE telegram_id='6940016723' AND status='active' AND public_ip IS NOT NULL
                 ORDER BY updated_at DESC LIMIT 2`
              );
              console.log('ACTIVE_PROBE_TARGETS='+rows.length);
              for(const row of rows){
                const result=await lifecycle.checkIpQuality(row.public_ip,{polls:15,pollDelayMs:1500});
                console.log('LIVE_PROBE='+JSON.stringify({
                  server_id:String(row.server_id),
                  server_name:row.server_name,
                  ok:Boolean(result.ok),
                  definitive:Boolean(result.definitive),
                  reason:result.reason,
                  iran:result.iran,
                  global:result.global
                }));
              }
            } finally {await c.end();}
          })().catch(e=>{console.error('LIVE_PROBE_FAILED='+String(e.message||e));process.exit(1)});
          NODEPROBE
          echo "IP_CHANGE_LOGS_BEGIN"
          timeout 20s pm2 logs hamoonbot --lines 8000 --nostream 2>/dev/null |
            grep -A 14 -B 2 -E '5\.75\.193\.123|5\.75\.207\.199|HETZNER_CHANGE_IP_INCONCLUSIVE_RETRY|HETZNER_CHANGE_IP_CLEAN_REJECTED_ROLLED_BACK|IP_QUALITY_CHECK_UNAVAILABLE' |
            tail -n 500 || true
          echo "IP_CHANGE_LOGS_END"
          REMOTE
